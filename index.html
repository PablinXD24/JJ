<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Art Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        /* Reset e Base */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); overflow-x: hidden; cursor: none; display: flex; flex-direction: column; min-height: 100vh; }

        /* Cursor Custom */
        .cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--jj-yellow-main); border-radius: 50%; z-index: 10000; pointer-events: none; }
        .cursor-outline { position: fixed; width: 40px; height: 40px; border: 2px solid var(--jj-yellow-main); border-radius: 50%; z-index: 9999; pointer-events: none; transition: 0.1s; }

        /* Nav */
        .main-nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background: rgba(248, 249, 250, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .logo-img { height: 50px; width: auto; }
        
        .category-nav { display: flex; gap: 15px; overflow-x: auto; padding: 15px 5%; scrollbar-width: none; background: var(--jj-bg); position: sticky; top: 80px; z-index: 90; }
        .cat-filter-btn { padding: 8px 20px; border-radius: 15px; border: none; background: var(--jj-bg); box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); font-size: 0.7rem; font-weight: 700; color: var(--jj-brown); cursor: pointer; white-space: nowrap; text-transform: uppercase; transition: 0.3s; }
        .cat-filter-btn.active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); color: var(--jj-yellow-main); }

        /* Cards Neumorfistas */
        .content-wrapper { padding: 20px 0 60px 0; flex: 1; }
        .category-title { margin-left: 5%; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px; color: var(--jj-brown); position: relative; }
        .category-title::after { content: ''; position: absolute; left: 0; bottom: -8px; width: 40px; height: 3px; background: var(--jj-yellow-main); border-radius: 2px; }
        
        .carousel-container { display: flex; gap: 30px; overflow-x: auto; padding: 20px 5% 45px 5%; scrollbar-width: none; }
        .product-card {
            flex: 0 0 300px; background: var(--jj-bg); padding: 25px; padding-bottom: 85px; border-radius: 45px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            transition: 0.4s; cursor: pointer; position: relative; min-height: 560px;
            transform-style: preserve-3d;
        }
        
        .img-sculpt-frame {
            background: var(--jj-bg); height: 260px; border-radius: 35px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
            position: relative; overflow: hidden; margin-bottom: 25px;
            transform: translateZ(20px);
        }
        .img-sculpt-frame img { max-width: 85%; max-height: 85%; object-fit: contain; }

        .card-btn-fix {
            position: absolute; bottom: 25px; left: 25px; right: 25px;
            background: var(--jj-yellow-main); color: #1a1a1a; border: none; padding: 16px; border-radius: 22px;
            font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: 0.3s;
            box-shadow: 6px 6px 15px rgba(255, 200, 0, 0.35); text-transform: uppercase;
        }

        /* FOOTER (Restaurado) */
        footer {
            position: relative; background-image: url('jjvidro2.png'); background-size: cover; background-position: center;
            padding: 80px 5% 40px 5%; border-radius: 60px 60px 0 0; overflow: hidden; color: #fff; text-align: center;
            margin-top: 40px;
        }
        footer::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.8); z-index: 1; }
        .footer-content { position: relative; z-index: 2; }
        .footer-logo { height: 70px; margin-bottom: 25px; filter: brightness(0) invert(1); }
        .footer-copy { font-size: 0.6rem; color: rgba(255,255,255,0.6); letter-spacing: 2px; text-transform: uppercase; }

        /* Modais */
        .modal { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(12px); }
        .modal-content { background: var(--jj-bg); width: 100%; max-width: 900px; border-radius: 50px; position: relative; z-index: 2100; padding: 40px; max-height: 90vh; overflow-y: auto; box-shadow: 25px 25px 50px rgba(0,0,0,0.2); }
        .close-btn { position: absolute; top: 25px; right: 25px; background: none; border: none; font-size: 2.2rem; cursor: pointer; color: var(--jj-brown); }

        /* UI Admin */
        .edit-field, .user-input { width: 100%; background: var(--jj-bg); border: none; padding: 12px; border-radius: 15px; box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); margin-bottom: 12px; outline: none; font-size: 0.8rem; font-family: inherit; }
        .jj-btn-ghost { background: var(--jj-bg); border: none; padding: 10px 20px; border-radius: 15px; box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light); font-weight: 700; font-size: 0.65rem; color: var(--jj-brown); cursor: pointer; }

        #cart-btn-floating { position: fixed; bottom: 30px; left: 30px; width: 65px; height: 65px; border-radius: 50%; background: var(--jj-bg); z-index: 1500; box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light); display: none; align-items: center; justify-content: center; font-size: 24px; border:none; cursor:pointer; }
        #admin-btn { display: none; position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; border-radius: 50%; z-index: 1500; font-size: 32px; border: none; background: var(--jj-yellow-main); cursor: pointer; }

        @media (max-width: 768px) { .modal-grid { grid-template-columns: 1fr !important; } .cursor-dot, .cursor-outline { display: none; } .modal-content { padding: 30px 20px; } }
    </style>
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="main-nav">
        <img src="jjvidro.png" alt="Logo J&J" class="logo-img">
        <div id="auth-ui"></div>
    </nav>

    <div class="category-nav" id="cat-nav-list">
        <button class="cat-filter-btn active" onclick="filterCat('all')">Todos</button>
    </div>

    <main class="content-wrapper" id="main-content"></main>

    <footer>
        <div class="footer-content">
            <img src="jjvidro.png" alt="Logo J&J" class="footer-logo">
            <p class="footer-copy">© 2025 J&J ART COLLECTION. DESIGNED FOR EXCLUSIVITY.</p>
        </div>
    </footer>

    <button id="cart-btn-floating" onclick="openCartModal()">🛒 <div id="cart-badge" style="position:absolute; top:0; right:0; background:var(--jj-yellow-main); width:20px; height:20px; border-radius:50%; font-size:10px; display:flex; align-items:center; justify-content:center; font-weight:700">0</div></button>
    <button id="admin-btn" onclick="openAdmin()">+</button>

    <div id="details-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <div id="details-body" class="modal-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:30px"></div>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content" style="max-width: 550px;">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <h2 style="margin-bottom:20px; font-size:1.2rem; color:var(--jj-brown)">PAINEL ADMINISTRATIVO</h2>
            <div style="display:flex; gap:10px; margin-bottom:20px">
                <button class="jj-btn-ghost" onclick="renderAdminView('create')">NOVO PRODUTO</button>
                <button class="jj-btn-ghost" onclick="renderAdminView('orders')">PEDIDOS</button>
            </div>
            <div id="admin-render-area"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";
        const WPP_NUM = "5511998937643";
        
        let cart = JSON.parse(localStorage.getItem('jj_cart')) || [];
        let currentProduct = null;
        let selectedColor = "";

        auth.onAuthStateChanged(user => {
            const ui = document.getElementById('auth-ui');
            if (user) {
                ui.innerHTML = `<span style="font-size:0.7rem; font-weight:700">${user.displayName}</span> <button class="jj-btn-ghost" onclick="auth.signOut()" style="margin-left:10px">SAIR</button>`;
                if (user.email === ADM_EMAIL) document.getElementById('admin-btn').style.display = 'block';
            } else {
                ui.innerHTML = `<button class="jj-btn-ghost" onclick="auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())">ENTRAR</button>`;
            }
            listenToProducts();
            updateCartBadge();
        });

        function listenToProducts() {
            database.ref('produtos').on('value', snap => {
                const main = document.getElementById('main-content');
                const catNav = document.getElementById('cat-nav-list');
                main.innerHTML = "";
                catNav.innerHTML = `<button class="cat-filter-btn active" onclick="filterCat('all')">Todos</button>`;
                
                const data = snap.val();
                if (data) {
                    const products = Object.values(data);
                    const categories = [...new Set(products.map(p => p.category))];
                    
                    categories.forEach(cat => {
                        catNav.innerHTML += `<button class="cat-filter-btn" onclick="filterCat('${cat}')">${cat}</button>`;
                        const group = document.createElement('div');
                        group.className = `cat-group cat-${cat.replace(/\s+/g, '-')}`;
                        group.innerHTML = `<h2 class="category-title">${cat}</h2><div class="carousel-container" id="cont-${cat.replace(/\s+/g, '-')}"></div>`;
                        main.appendChild(group);

                        products.filter(p => p.category === cat).forEach(p => {
                            const firstCol = p.colors ? p.colors.split(',')[0].trim() : "";
                            const img = (p.variants && p.variants[firstCol]) ? p.variants[firstCol].img : "https://via.placeholder.com/300?text=J&J";
                            
                            const card = document.createElement('div');
                            card.className = 'product-card';
                            card.setAttribute('data-tilt', '');
                            card.onclick = () => openDetails(p);
                            card.innerHTML = `
                                ${auth.currentUser?.email === ADM_EMAIL ? `<button onclick="event.stopPropagation(); deleteProduct('${p.id}')" style="position:absolute; top:15px; right:15px; border:none; background:none; font-size:1.5rem; cursor:pointer;">&times;</button>` : ''}
                                <div class="img-sculpt-frame"><img src="${img}"></div>
                                <h3>${p.name}</h3>
                                <p style="font-weight:700; color:var(--jj-brown)">R$ ${p.price}</p>
                                <button class="card-btn-fix">DETALHES</button>`;
                            document.getElementById(`cont-${cat.replace(/\s+/g, '-')}`).appendChild(card);
                        });
                    });
                    VanillaTilt.init(document.querySelectorAll(".product-card"), { max: 15, speed: 400, glare: true, "max-glare": 0.2 });
                }
            });
        }

        // --- ADMIN ---
        function renderAdminView(view) {
            const area = document.getElementById('admin-render-area');
            if (view === 'create') {
                area.innerHTML = `
                    <input id="adm-cat" class="edit-field" placeholder="Categoria">
                    <input id="adm-name" class="edit-field" placeholder="Nome">
                    <input id="adm-price" class="edit-field" placeholder="Preço">
                    <input id="adm-colors" class="edit-field" placeholder="Cores (Azul, Branco)">
                    <textarea id="adm-desc" class="edit-field" placeholder="Descrição"></textarea>
                    <button class="card-btn-fix" style="position:static; width:100%" onclick="saveNewProduct()">CADASTRAR</button>`;
            } else if (view === 'orders') {
                database.ref('pedidos').limitToLast(10).on('value', snap => {
                    let h = `<div style="max-height:300px; overflow-y:auto">`;
                    if(snap.val()) Object.values(snap.val()).reverse().forEach(o => {
                        h += `<div style="padding:12px; background:white; border-radius:12px; margin-bottom:10px; font-size:0.7rem; box-shadow:4px 4px 8px var(--shadow-dark)">
                            <b>${o.cliente}</b> - R$ ${o.total.toFixed(2)}<br><small>${o.data}</small>
                        </div>`;
                    });
                    area.innerHTML = h + `</div>`;
                });
            }
        }

        async function saveNewProduct() {
            const id = database.ref('produtos').push().key;
            await database.ref('produtos/'+id).set({
                id, category: document.getElementById('adm-cat').value, name: document.getElementById('adm-name').value, 
                price: document.getElementById('adm-price').value, colors: document.getElementById('adm-colors').value, desc: document.getElementById('adm-desc').value
            });
            alert("Sucesso!"); closeModals();
        }

        // --- COMPRA ---
        function openDetails(p) {
            currentProduct = p;
            selectedColor = p.colors ? p.colors.split(',')[0].trim() : "";
            renderUI();
            document.getElementById('details-modal').style.display='flex';
            setTimeout(()=>document.getElementById('details-modal').classList.add('active'),10);
        }

        function renderUI() {
            const p = currentProduct;
            const area = document.getElementById('details-body');
            const v = (p.variants && p.variants[selectedColor]) ? p.variants[selectedColor] : {img:"", stock:""};
            const colorList = p.colors.split(',').map(c=>c.trim());

            if(auth.currentUser?.email === ADM_EMAIL) {
                area.innerHTML = `<div style="grid-column: span 2">
                    <h3>VARIACIÓN: ${selectedColor}</h3>
                    <input type="file" onchange="uploadImg('${p.id}','${selectedColor}',this)" class="user-input">
                    <input id="v-stock" class="edit-field" placeholder="Estoque P:10, M:5" value="${v.stock}">
                    <button class="jj-btn-ghost" onclick="saveStk('${p.id}','${selectedColor}')">SALVAR ESTOQUE</button>
                    <div style="margin-top:15px">${colorList.map(c=>`<button class="jj-btn-ghost" style="margin:2px" onclick="selectedColor='${c}';renderUI()">${c}</button>`).join('')}</div>
                </div>`;
            } else {
                const stockArr = v.stock.split(',').filter(s=>parseInt(s.split(':')[1]) > 0);
                const opts = stockArr.map(s=>`<option value="${s.split(':')[0].trim()}">${s.trim()}</option>`).join('');
                area.innerHTML = `<div class="img-sculpt-frame"><img src="${v.img}"></div>
                    <div><h2>${p.name}</h2><p style="font-size:0.8rem;margin:15px 0">${p.desc||''}</p>
                    <div style="background:rgba(0,0,0,0.03);padding:15px;border-radius:20px;margin-bottom:15px">
                        ${colorList.map(c=>`<div onclick="selectedColor='${c}';renderUI()" style="background:${c};width:25px;height:25px;border-radius:50%;display:inline-block;margin:5px;cursor:pointer;border:2px solid ${selectedColor===c?'var(--jj-yellow-main)':'white'}"></div>`).join('')}
                        <br><br><label>TAMANHO:</label><select id="u-sz" class="user-input">${opts||'<option>Esgotado</option>'}</select>
                    </div><div style="font-size:1.5rem;font-weight:700">R$ ${p.price}</div>
                    <button class="card-btn-fix" style="position:static;width:100%;margin-top:15px" onclick="addToCart()">ADICIONAR</button></div>`;
            }
        }

        async function uploadImg(pid, col, input) {
            const file = input.files[0]; if(!file) return;
            const r = new FileReader(); r.onload = async(e) => {
                await database.ref(`produtos/${pid}/variants/${col}/img`).set(e.target.result);
                alert("Imagem OK!"); renderUI();
            }; r.readAsDataURL(file);
        }
        async function saveStk(pid, col) { await database.ref(`produtos/${pid}/variants/${col}/stock`).set(document.getElementById('v-stock').value); alert("Salvo!"); }

        function addToCart() {
            const sz = document.getElementById('u-sz').value; if(sz==="Esgotado") return;
            cart.push({ productId: currentProduct.id, name: currentProduct.name, price: parseFloat(currentProduct.price), color: selectedColor, size: sz });
            localStorage.setItem('jj_cart', JSON.stringify(cart)); updateCartBadge(); closeModals();
        }

        function openCartModal() {
            const area = document.getElementById('details-body');
            let total = 0;
            let list = cart.map((i, idx) => { total += i.price; return `<div style="padding:10px;background:white;border-radius:10px;margin-bottom:8px;position:relative"><b>${i.name}</b> (${i.color}/${i.size})<br>R$ ${i.price.toFixed(2)}<button onclick="cart.splice(${idx},1);localStorage.setItem('jj_cart',JSON.stringify(cart));openCartModal();updateCartBadge();" style="position:absolute;right:10px;top:10px;border:none;background:none;cursor:pointer">&times;</button></div>`; }).join('');
            area.innerHTML = `<div style="grid-column: span 2"><h2>LISTA</h2><div style="max-height:250px;overflow-y:auto;margin:15px 0">${list||'Vazio'}</div><div style="background:var(--jj-yellow-main);padding:15px;border-radius:15px;font-weight:700;text-align:right">TOTAL: R$ ${total.toFixed(2)}</div><input id="u-nome" class="user-input" placeholder="Seu Nome" style="margin-top:15px"><button class="card-btn-fix" style="position:static;width:100%" onclick="finish(${total})">WHATSAPP</button></div>`;
            document.getElementById('details-modal').style.display='flex'; document.getElementById('details-modal').classList.add('active');
        }

        async function finish(total) {
            const n = document.getElementById('u-nome').value; if(!n) return alert("Nome?");
            const id = database.ref('pedidos').push().key;
            await database.ref('pedidos/'+id).set({ cliente: n, total, itens: cart, data: new Date().toLocaleString('pt-BR') });
            for(const item of cart) {
                const snap = await database.ref(`produtos/${item.productId}/variants/${item.color}/stock`).once('value');
                let ns = (snap.val()||"").split(',').map(p=>{ let [s,q]=p.split(':'); if(s.trim()===item.size) return `${s}:${Math.max(0,parseInt(q)-1)}`; return p; }).join(', ');
                await database.ref(`produtos/${item.productId}/variants/${item.color}/stock`).set(ns);
            }
            window.open(`https://wa.me/${WPP_NUM}?text=Pedido: ${n}`, '_blank');
            cart=[]; localStorage.removeItem('jj_cart'); updateCartBadge(); closeModals();
        }

        function updateCartBadge() { document.getElementById('cart-badge').innerText = cart.length; document.getElementById('cart-btn-floating').style.display = cart.length>0?'flex':'none'; }
        function closeModals() { document.querySelectorAll('.modal').forEach(m=>{m.classList.remove('active'); setTimeout(()=>m.style.display='none',300);}); }
        function openAdmin() { document.getElementById('admin-modal').style.display='flex'; setTimeout(()=>document.getElementById('admin-modal').classList.add('active'),10); renderAdminView('create'); }
        function filterCat(cat) { document.querySelectorAll('.cat-filter-btn').forEach(b=>b.classList.remove('active')); event.target.classList.add('active'); document.querySelectorAll('.cat-group').forEach(g=>g.style.display=(cat==='all'||g.classList.contains(`cat-${cat.replace(/\s+/g,'-')}`))?'block':'none'); }
        function deleteProduct(id) { if(confirm("Apagar?")) database.ref('produtos/'+id).remove(); }

        if (window.innerWidth > 768) {
            const dot = document.querySelector('.cursor-dot'), out = document.querySelector('.cursor-outline');
            window.onmousemove = (e) => { dot.style.left = e.clientX+'px'; dot.style.top = e.clientY+'px'; out.style.left = (e.clientX - 16) +'px'; out.style.top = (e.clientY - 16) +'px'; };
        }
    </script>
</body>
</html>
