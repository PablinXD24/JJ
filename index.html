<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Art Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); overflow-x: hidden; cursor: none; }

        /* Cursor */
        .cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--jj-yellow-main); border-radius: 50%; z-index: 10000; pointer-events: none; }
        .cursor-outline { position: fixed; width: 40px; height: 40px; border: 2px solid var(--jj-yellow-main); border-radius: 50%; z-index: 9999; pointer-events: none; transition: 0.1s; }

        /* Navbar & Categorias */
        .main-nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background: rgba(248, 249, 250, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .logo-img { height: 50px; width: auto; }

        .category-nav { display: flex; gap: 15px; overflow-x: auto; padding: 15px 5%; scrollbar-width: none; background: var(--jj-bg); position: sticky; top: 80px; z-index: 90; }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-filter-btn { padding: 8px 20px; border-radius: 15px; border: none; background: var(--jj-bg); box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); font-size: 0.7rem; font-weight: 700; color: var(--jj-brown); cursor: pointer; white-space: nowrap; text-transform: uppercase; transition: 0.3s; }
        .cat-filter-btn.active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); color: var(--jj-yellow-main); }

        .content-wrapper { padding: 20px 0 60px 0; min-height: 80vh; }
        .category-title { margin-left: 5%; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px; color: var(--jj-brown); position: relative; }
        .category-title::after { content: ''; position: absolute; left: 0; bottom: -8px; width: 40px; height: 3px; background: var(--jj-yellow-main); border-radius: 2px; }
        
        .carousel-container { display: flex; gap: 30px; overflow-x: auto; padding: 20px 5% 45px 5%; scrollbar-width: none; }
        .carousel-container::-webkit-scrollbar { display: none; }

        /* Card Luxo */
        .product-card {
            flex: 0 0 300px; background: var(--jj-bg); padding: 25px; padding-bottom: 85px; border-radius: 45px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            transition: 0.4s; cursor: pointer; position: relative; min-height: 560px;
        }
        
        .img-sculpt-frame {
            background: var(--jj-bg); height: 260px; border-radius: 35px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
            position: relative; overflow: hidden; margin-bottom: 25px;
        }
        .img-sculpt-frame img { max-width: 85%; max-height: 85%; object-fit: contain; z-index: 2; transition: 0.5s; }
        .product-card:hover .img-sculpt-frame img { transform: scale(1.1); }

        .card-label { font-size: 0.55rem; font-weight: 700; color: var(--jj-yellow-main); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; display: block; }
        .product-card h3 { font-weight: 700; font-size: 1rem; text-transform: uppercase; margin-bottom: 8px; color: var(--jj-brown); }
        .card-desc-preview { font-size: 0.7rem; color: #777; line-height: 1.4; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-card .price { font-weight: 800; color: var(--jj-text); font-size: 1.2rem; }

        .card-btn-fix {
            position: absolute; bottom: 25px; left: 25px; right: 25px;
            background: var(--jj-yellow-main); color: #1a1a1a; border: none; padding: 16px; border-radius: 22px;
            font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: 0.3s;
            box-shadow: 6px 6px 15px rgba(255, 200, 0, 0.35); text-transform: uppercase;
        }

        /* Inputs & Modals */
        .jj-btn-ghost { background: var(--jj-bg); border: none; padding: 10px 20px; border-radius: 15px; box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light); font-weight: 700; font-size: 0.65rem; color: var(--jj-brown); cursor: pointer; }
        .edit-field, .user-input { width: 100%; background: var(--jj-bg); border: none; padding: 15px; border-radius: 18px; box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); margin-bottom: 15px; outline: none; font-size: 0.85rem; }

        .modal { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(12px); }
        .modal-content { background: var(--jj-bg); width: 100%; max-width: 850px; border-radius: 50px; position: relative; z-index: 2100; padding: 45px; max-height: 90vh; overflow-y: auto; box-shadow: 25px 25px 50px rgba(0,0,0,0.2); transition: 0.4s; transform: translateY(40px); opacity: 0; }
        .modal.active .modal-content { transform: translateY(0); opacity: 1; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .close-btn { position: absolute; top: 25px; right: 25px; background: none; border: none; font-size: 2.2rem; cursor: pointer; color: var(--jj-brown); }

        #cart-btn-floating { position: fixed; bottom: 30px; left: 30px; width: 65px; height: 65px; border-radius: 50%; background: var(--jj-bg); z-index: 1500; box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light); border: none; cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 24px; }
        #cart-badge { position: absolute; top: 0; right: 0; background: var(--jj-yellow-main); font-size: 10px; font-weight: 700; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        #admin-btn { display: none; position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; border-radius: 50%; z-index: 1500; font-size: 32px; border: none; background: var(--jj-yellow-main); cursor: pointer; }

        @media (max-width: 768px) {
            .modal { align-items: flex-end; padding: 0; }
            .modal-content { border-radius: 40px 40px 0 0; padding: 50px 25px 35px 25px; transform: translateY(100%); }
            .modal-grid { grid-template-columns: 1fr; gap: 20px; }
            .product-card { flex: 0 0 285px; }
            .cursor-dot, .cursor-outline { display: none; }
            body { cursor: auto; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="main-nav">
        <img src="j&j vidro.png" alt="Logo" class="logo-img">
        <div id="auth-ui"><button class="jj-btn-ghost" onclick="loginGoogle()">ENTRAR</button></div>
    </nav>

    <div class="category-nav" id="cat-nav-list">
        <button class="cat-filter-btn active" onclick="filterCat('all')">Todos</button>
    </div>

    <main class="content-wrapper" id="main-content"></main>

    <button id="cart-btn-floating" onclick="openCartModal()">🛒 <div id="cart-badge">0</div></button>
    <button id="admin-btn" onclick="openAdmin()">+</button>

    <div id="details-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <div id="details-body" class="modal-grid"></div>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content" style="max-width: 500px;">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <h2 style="margin-bottom:20px; font-size:1rem; color:var(--jj-brown)">CADASTRAR ITEM</h2>
            <input type="text" id="p-category" class="edit-field" placeholder="Categoria (Ex: Decoração)">
            <input type="text" id="p-name" class="edit-field" placeholder="Nome">
            <input type="text" id="p-price" class="edit-field" placeholder="Preço (299,00)">
            <textarea id="p-sizes" class="edit-field" placeholder="Tamanhos (P, M, G)"></textarea>
            <input type="text" id="p-colors" class="edit-field" placeholder="Cores (Preto, Branco)">
            <input type="file" id="p-file" class="edit-field" onchange="handleFileSelect(this, 'p-img-prev')">
            <img id="p-img-prev" style="width:60px; display:none; border-radius:10px; margin-bottom:10px">
            <textarea id="p-desc" class="edit-field" placeholder="Descrição..." rows="3"></textarea>
            <button class="card-btn-fix" onclick="saveToRTDB()" style="position:static; width:100%">SALVAR</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        const provider = new firebase.auth.GoogleAuthProvider();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";
        const WPP_NUM = "5511998937643";
        let cart = [], tempBase64 = "";

        function loginGoogle() { auth.signInWithPopup(provider); }
        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            const authUI = document.getElementById('auth-ui');
            if (user) {
                authUI.innerHTML = `<span style="font-size:0.65rem; font-weight:700">${user.displayName}</span><button class="jj-btn-ghost" onclick="logout()" style="margin-left:10px">SAIR</button>`;
                if (user.email === ADM_EMAIL) document.getElementById('admin-btn').style.display = 'block';
            } else {
                authUI.innerHTML = `<button class="jj-btn-ghost" onclick="loginGoogle()">ENTRAR</button>`;
            }
            listenToProducts();
        });

        function handleFileSelect(input, prevId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => { tempBase64 = e.target.result; document.getElementById(prevId).src = tempBase64; document.getElementById(prevId).style.display = 'block'; };
                reader.readAsDataURL(file);
            }
        }

        function saveToRTDB() {
            const name = document.getElementById('p-name').value;
            if (name && tempBase64) {
                const ref = database.ref('produtos').push();
                ref.set({
                    id: ref.key,
                    category: document.getElementById('p-category').value || "Geral",
                    name: name,
                    price: document.getElementById('p-price').value,
                    sizes: document.getElementById('p-sizes').value,
                    colors: document.getElementById('p-colors').value,
                    desc: document.getElementById('p-desc').value,
                    img: tempBase64
                }).then(closeModals);
            }
        }

        function listenToProducts() {
            database.ref('produtos').on('value', snap => {
                const data = snap.val();
                const main = document.getElementById('main-content');
                const catNav = document.getElementById('cat-nav-list');
                main.innerHTML = "";
                catNav.innerHTML = `<button class="cat-filter-btn active" onclick="filterCat('all')">Todos</button>`;
                
                if (data) {
                    const products = Object.values(data);
                    const cats = [...new Set(products.map(p => p.category))];
                    
                    cats.forEach(cat => {
                        catNav.innerHTML += `<button class="cat-filter-btn" onclick="filterCat('${cat}')">${cat}</button>`;
                        const section = document.createElement('div');
                        section.className = `cat-group cat-${cat.replace(/\s+/g, '-')}`;
                        section.innerHTML = `<h2 class="category-title">${cat}</h2><div class="carousel-container" id="cat-container-${cat.replace(/\s+/g, '-')}"></div>`;
                        main.appendChild(section);
                        
                        products.filter(p => p.category === cat).forEach(p => {
                            const card = document.createElement('div');
                            card.className = 'product-card';
                            card.onclick = () => openDetails(p);
                            card.innerHTML = `
                                ${auth.currentUser?.email === ADM_EMAIL ? `<button onclick="event.stopPropagation(); deleteProduct('${p.id}')" style="position:absolute; top:20px; right:20px; border:none; background:none; font-size:1.5rem; color:var(--jj-brown); cursor:pointer; z-index:20">&times;</button>` : ''}
                                <div class="img-sculpt-frame"><img></div>
                                <div class="card-info">
                                    <span class="card-label">Design Exclusive</span>
                                    <h3>${p.name}</h3>
                                    <p class="card-desc-preview">${p.desc || ''}</p>
                                    <div class="price">R$ ${p.price}</div>
                                </div>
                                <button class="card-btn-fix">RESERVAR PEÇA</button>`;
                            card.querySelector('img').src = p.img;
                            document.getElementById(`cat-container-${cat.replace(/\s+/g, '-')}`).appendChild(card);
                        });
                    });
                    if (window.innerWidth > 768) VanillaTilt.init(document.querySelectorAll(".product-card"), { max: 5, speed: 400 });
                }
            });
        }

        function filterCat(cat) {
            document.querySelectorAll('.cat-filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.cat-group').forEach(g => {
                if (cat === 'all' || g.classList.contains(`cat-${cat.replace(/\s+/g, '-')}`)) g.style.display = 'block';
                else g.style.display = 'none';
            });
        }

        function openDetails(p) {
            const body = document.getElementById('details-body');
            const isAdm = auth.currentUser?.email === ADM_EMAIL;
            if (isAdm) {
                body.innerHTML = `
                    <div class="img-sculpt-frame"><img src="${p.img}" id="e-img"></div>
                    <div>
                        <input type="text" id="e-name" class="user-input" value="${p.name}">
                        <input type="text" id="e-price" class="user-input" value="${p.price}">
                        <textarea id="e-desc" class="user-input" rows="5">${p.desc || ''}</textarea>
                        <button class="card-btn-fix" style="position:static; width:100%" onclick="updateProduct('${p.id}', '${p.img}')">ATUALIZAR</button>
                    </div>`;
            } else {
                const sizes = p.sizes ? p.sizes.split(',').map(s=>`<option>${s.trim()}</option>`).join('') : '<option>Único</option>';
                const colors = p.colors ? p.colors.split(',').map(c=>`<option>${c.trim()}</option>`).join('') : '<option>Padrão</option>';
                body.innerHTML = `
                    <div class="img-sculpt-frame"><img src="${p.img}"></div>
                    <div>
                        <span class="card-label">Exclusive Collection</span>
                        <h2 style="color:var(--jj-brown); margin-bottom:12px">${p.name}</h2>
                        <p style="font-size:0.85rem; color:#555; line-height:1.6; margin-bottom:20px">${p.desc}</p>
                        <div style="background:rgba(0,0,0,0.03); padding:20px; border-radius:25px; margin-bottom:20px">
                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
                                <select id="u-size" class="user-input">${sizes}</select>
                                <select id="u-color" class="user-input">${colors}</select>
                            </div>
                            <input type="number" id="u-qty" class="user-input" value="1" min="1">
                        </div>
                        <div style="font-weight:800; font-size:1.6rem; margin-bottom:20px">R$ ${p.price}</div>
                        <button class="card-btn-fix" style="position:static; width:100%" onclick="addToCart('${p.name}', '${p.price}')">ADICIONAR À LISTA</button>
                    </div>`;
            }
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
        }

        function addToCart(name, price) {
            cart.push({ name, price, size: document.getElementById('u-size').value, color: document.getElementById('u-color').value, qty: document.getElementById('u-qty').value });
            document.getElementById('cart-badge').innerText = cart.length;
            document.getElementById('cart-btn-floating').style.display = 'flex';
            closeModals();
        }

        function openCartModal() {
            const userName = auth.currentUser ? auth.currentUser.displayName : "";
            const body = document.getElementById('details-body');
            let list = cart.map((i, idx) => `<div style="padding:15px; background:white; border-radius:15px; margin-bottom:10px; font-size:0.8rem; position:relative"><b>${i.name}</b> (${i.size}/${i.color}) x${i.qty}<button onclick="cart.splice(${idx},1); openCartModal();" style="position:absolute; right:10px; top:12px; border:none; background:none; cursor:pointer">×</button></div>`).join('');
            body.innerHTML = `<div style="grid-column: span 2"><h2 style="margin-bottom:20px">MINHA LISTA</h2>${list || '<p style="opacity:0.5; text-align:center">Vazio</p>'}<div style="margin-top:20px"><input type="text" id="u-final-name" class="user-input" placeholder="Nome" value="${userName}"><select id="u-final-pay" class="user-input"><option>Pix</option><option>Cartão</option></select><button class="card-btn-fix" style="position:static; width:100%" onclick="sendWhatsApp()">PEDIR VIA WHATSAPP</button></div></div>`;
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
        }

        function sendWhatsApp() {
            const user = document.getElementById('u-final-name').value;
            const pay = document.getElementById('u-final-pay').value;
            if(!user || cart.length === 0) return alert("Erro no pedido!");
            let msg = `Olá J&J! Me chamo ${user}.%0A%0A*MEU PEDIDO:*%0A`;
            cart.forEach(i => msg += `- *${i.name}* (${i.size}/${i.color}) x${i.qty}%0A`);
            msg += `%0A*PAGAMENTO:* ${pay}`;
            window.open(`https://wa.me/${WPP_NUM}?text=${msg}`, '_blank');
        }

        function deleteProduct(id) { if(confirm("Apagar?")) database.ref('produtos/'+id).remove(); }
        function openAdmin() { document.getElementById('admin-modal').style.display='flex'; setTimeout(()=>document.getElementById('admin-modal').classList.add('active'),10); }
        function closeModals() { document.querySelectorAll('.modal').forEach(m=>{m.classList.remove('active'); setTimeout(()=>m.style.display='none',400);}); tempBase64=""; }

        if (window.innerWidth > 768) {
            const dot = document.querySelector('.cursor-dot'), out = document.querySelector('.cursor-outline');
            window.onmousemove = (e) => { dot.style.left = out.style.left = e.clientX+'px'; dot.style.top = out.style.top = e.clientY+'px'; };
        }
    </script>
</body>
</html>
