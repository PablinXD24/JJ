<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Executive Dashboard Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
            --success: #28a745;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); padding-bottom: 50px; overflow-x: hidden; }

        /* Login */
        #login-screen { position: fixed; inset: 0; background: var(--jj-bg); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--jj-bg); padding: 50px; border-radius: 50px; box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light); text-align: center; }

        #dash-content { display: none; padding: 30px 5%; opacity: 0; transition: opacity 0.5s; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .logo-img { height: 45px; }

        /* Neumorphic Containers */
        .card-jj { 
            background: var(--jj-bg); padding: 30px; border-radius: 40px; 
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            margin-bottom: 30px; position: relative;
        }

        .section-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--jj-brown); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ''; width: 4px; height: 15px; background: var(--jj-yellow-main); border-radius: 2px; }

        /* Search & Filters */
        .search-container { margin-bottom: 20px; width: 100%; }
        .search-input {
            width: 100%; padding: 15px 25px; border-radius: 20px; border: none; background: var(--jj-bg);
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            font-family: inherit; outline: none; color: var(--jj-brown);
        }

        /* Progress Bar */
        .bar-bg { height: 16px; background: #e0e5ec; border-radius: 20px; box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); overflow: hidden; margin: 20px 0; }
        .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--jj-brown), var(--jj-yellow-main)); transition: 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67); position: relative; }
        
        /* Inputs */
        .edit-field {
            width: 100%; border: none; background: transparent; padding: 10px; font-family: inherit; font-size: 0.8rem;
            border-radius: 10px; box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
            outline: none; transition: 0.3s;
        }
        .edit-field:focus { box-shadow: inset 1px 1px 2px var(--shadow-dark); background: rgba(255, 200, 0, 0.05); }
        .edit-field.saved { border: 1px solid var(--success); }

        .meta-input {
            background: transparent; border: none; font-size: 1.4rem; font-weight: 700; color: var(--jj-brown); width: 150px; text-align: right; outline: none;
            border-bottom: 2px solid var(--jj-yellow-main);
        }

        /* Notifications */
        #notification-toast {
            position: fixed; bottom: 30px; right: 30px; z-index: 11000;
            background: var(--jj-bg); padding: 20px 30px; border-radius: 25px;
            box-shadow: 10px 10px 20px var(--shadow-dark);
            border-left: 10px solid var(--jj-yellow-main);
            display: none; animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { text-align: left; padding: 12px; font-size: 0.6rem; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 12px; border-top: 1px solid rgba(0,0,0,0.05); }

        .btn-jj { padding: 12px 25px; border-radius: 15px; border: none; background: var(--jj-yellow-main); font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-jj:hover { transform: translateY(-2px); box-shadow: 5px 5px 15px var(--shadow-dark); }
        
        .loading-skeleton { background: linear-gradient(90deg, #eff1f3 25%, #e2e2e2 50%, #eff1f3 75%); background-size: 200% 100%; animation: loading 1.5s infinite; height: 20px; border-radius: 10px; }
        @keyframes loading { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <img src="jjvidro.png" style="height: 50px; margin-bottom: 25px;">
            <p style="font-size: 0.7rem; font-weight: 700; letter-spacing: 2px; margin-bottom: 25px; opacity: 0.6;">AUTENTICAÇÃO EXECUTIVA</p>
            <button class="btn-jj" onclick="login()">ENTRAR COM CONTA PABLO</button>
        </div>
    </div>

    <div id="dash-content">
        <header class="header">
            <img src="jjvidro.png" class="logo-img">
            <div style="text-align: right">
                <p id="adm-user" style="font-size: 0.8rem; font-weight: 700; color: var(--jj-brown);"></p>
                <p style="font-size: 0.6rem; opacity: 0.5; font-weight: 700;">ADMINISTRADOR TOTAL</p>
            </div>
        </header>

        <div class="card-jj">
            <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px;">
                <div>
                    <h3 class="section-title">Performance de Vendas</h3>
                    <p style="font-size: 0.65rem; opacity: 0.5;">Faturamento em tempo real vs. Meta estabelecida.</p>
                </div>
                <div>
                    <span style="font-size: 0.8rem; opacity: 0.5; font-weight: 700;">OBJETIVO R$</span>
                    <input type="number" id="meta-val" class="meta-input" onchange="salvarMeta(this.value)">
                </div>
            </div>
            <div class="bar-bg"><div id="meta-bar" class="bar-fill"></div></div>
            <div style="display: flex; justify-content: space-between;">
                <span id="txt-faturamento" style="font-size: 0.8rem; font-weight: 700; color: var(--jj-brown);">Calculando...</span>
                <span id="txt-porcentagem" style="font-size: 1.2rem; font-weight: 700; color: var(--jj-yellow-main);">0%</span>
            </div>
        </div>

        <div class="card-jj">
            <div class="search-container">
                <input type="text" id="pedido-search" class="search-input" placeholder="🔍 Buscar cliente ou token..." oninput="filtrarPedidos()">
            </div>
            <h3 class="section-title">Pedidos & CRM</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Token</th>
                            <th>Cliente VIP</th>
                            <th>Total (R$)</th>
                            <th>Status Pagamento</th>
                            <th style="text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-pedidos"></tbody>
                </table>
            </div>
        </div>

        <div class="card-jj">
            <h3 class="section-title">Gerenciamento de Acervo</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Nome do Produto</th>
                            <th>Preço Unitário</th>
                            <th>Categoria</th>
                        </tr>
                    </thead>
                    <tbody id="lista-produtos"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="notification-toast">
        <p style="font-size: 0.6rem; font-weight: 700; opacity: 0.5; text-transform: uppercase;">Aviso do Sistema</p>
        <p id="notif-msg" style="font-size: 0.9rem; font-weight: 700; color: var(--jj-brown); margin-top: 5px;"></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), database = firebase.database();
        const provider = new firebase.auth.GoogleAuthProvider();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";
        
        let metaGlobal = 15000;
        let lastLevel = 0;
        let allPedidos = {};
        let debounceTimer;

        function login() { auth.signInWithPopup(provider).catch(e => alert("Erro na autenticação: " + e.message)); }

        auth.onAuthStateChanged(user => {
            if(user && user.email === ADM_EMAIL) {
                const dash = document.getElementById('dash-content');
                document.getElementById('login-screen').style.display = 'none';
                dash.style.display = 'block';
                setTimeout(() => dash.style.opacity = '1', 100);
                document.getElementById('adm-user').innerText = user.displayName;
                iniciarDashboard();
            } else if (user) {
                alert("Acesso Negado. Esta área é exclusiva para o administrador.");
                auth.signOut();
            }
        });

        function iniciarDashboard() {
            database.ref('configuracoes/meta').on('value', snap => {
                metaGlobal = parseFloat(snap.val()) || 15000;
                document.getElementById('meta-val').value = metaGlobal;
                recalcularTudo();
            });

            database.ref('pedidos').on('value', snap => {
                allPedidos = snap.val() || {};
                renderPedidos(allPedidos);
                recalcularTudo();
            });

            database.ref('produtos').on('value', snap => renderProdutos(snap.val() || {}));
        }

        function renderPedidos(data) {
            const html = Object.values(data).reverse().map(p => `
                <tr id="row-${p.token}">
                    <td><code style="background:#eee; padding:2px 5px; border-radius:5px">${p.token}</code></td>
                    <td><input class="edit-field" value="${p.cliente || ''}" oninput="debouncedUpdate('pedidos/${p.token}', 'cliente', this)"></td>
                    <td><input class="edit-field" type="text" value="${p.total || 0}" oninput="debouncedUpdate('pedidos/${p.token}', 'total', this, true)"></td>
                    <td><input class="edit-field" value="${p.pagamento || ''}" oninput="debouncedUpdate('pedidos/${p.token}', 'pagamento', this)"></td>
                    <td style="text-align:center"><button onclick="remover('pedidos/${p.token}')" style="border:none; background:none; cursor:pointer; font-size:1.2rem">🗑️</button></td>
                </tr>
            `).join('');
            document.getElementById('lista-pedidos').innerHTML = html || '<tr><td colspan="5" style="text-align:center; opacity:0.5">Nenhum pedido encontrado.</td></tr>';
        }

        function filtrarPedidos() {
            const termo = document.getElementById('pedido-search').value.toLowerCase();
            const filtrados = Object.values(allPedidos).filter(p => 
                (p.cliente && p.cliente.toLowerCase().includes(termo)) || 
                (p.token && p.token.toLowerCase().includes(termo))
            );
            renderPedidos(Object.fromEntries(filtrados.map(p => [p.token, p])));
        }

        function renderProdutos(data) {
            const html = Object.entries(data).map(([id, p]) => `
                <tr>
                    <td><input class="edit-field" value="${p.name || ''}" oninput="debouncedUpdate('produtos/${id}', 'name', this)"></td>
                    <td><input class="edit-field" value="${p.price || 0}" oninput="debouncedUpdate('produtos/${id}', 'price', this, true)"></td>
                    <td><input class="edit-field" value="${p.category || ''}" oninput="debouncedUpdate('produtos/${id}', 'category', this)"></td>
                </tr>
            `).join('');
            document.getElementById('lista-produtos').innerHTML = html;
        }

        function debouncedUpdate(path, key, element, isNumber = false) {
            element.style.borderBottom = "2px solid var(--jj-yellow-main)";
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                let val = element.value;
                if(isNumber) val = parseFloat(val.replace(',', '.')) || 0;
                
                database.ref(path).update({ [key]: val }).then(() => {
                    element.style.borderBottom = "none";
                    element.classList.add('saved');
                    setTimeout(() => element.classList.remove('saved'), 1000);
                });
            }, 800);
        }

        function recalcularTudo() {
            const total = Object.values(allPedidos).reduce((acc, p) => acc + (parseFloat(p.total) || 0), 0);
            const perc = metaGlobal > 0 ? Math.floor((total / metaGlobal) * 100) : 0;
            
            document.getElementById('meta-bar').style.width = Math.min(perc, 100) + "%";
            document.getElementById('txt-faturamento').innerText = "Faturamento: R$ " + total.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            document.getElementById('txt-porcentagem').innerText = perc + "%";

            const currentLevel = Math.floor(perc / 10) * 10;
            if(currentLevel > lastLevel && currentLevel <= 100) {
                mostrarNotificacao(`Excelente! Você alcançou ${currentLevel}% da meta.`);
                lastLevel = currentLevel;
            }
        }

        function mostrarNotificacao(msg) {
            const toast = document.getElementById('notification-toast');
            document.getElementById('notif-msg').innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 5000);
        }

        function salvarMeta(v) { 
            const val = parseFloat(v.replace(',', '.')) || 0;
            database.ref('configuracoes/meta').set(val); 
        }

        function remover(path) { 
            if(confirm("Deseja apagar este registro permanentemente?")) {
                database.ref(path).remove().then(() => mostrarNotificacao("Registro removido com sucesso."));
            }
        }
    </script>
</body>
</html>
