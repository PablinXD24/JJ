<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | LOJAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); overflow-x: hidden; cursor: none; display: flex; flex-direction: column; min-height: 100vh; }

        /* Cursor Custom */
        .cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--jj-yellow-main); border-radius: 50%; z-index: 10000; pointer-events: none; }
        .cursor-outline { position: fixed; width: 40px; height: 40px; border: 2px solid var(--jj-yellow-main); border-radius: 50%; z-index: 9999; pointer-events: none; transition: 0.1s; }

        /* Nav */
        .main-nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background: rgba(248, 249, 250, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .logo-img { height: 50px; width: auto; }
        
        .category-nav { display: flex; gap: 15px; overflow-x: auto; padding: 15px 5%; scrollbar-width: none; background: var(--jj-bg); position: sticky; top: 80px; z-index: 90; }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-filter-btn { padding: 8px 20px; border-radius: 15px; border: none; background: var(--jj-bg); box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); font-size: 0.7rem; font-weight: 700; color: var(--jj-brown); cursor: pointer; white-space: nowrap; text-transform: uppercase; transition: 0.3s; }
        .cat-filter-btn.active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); color: var(--jj-yellow-main); }

        /* Cards e Carousel */
        .content-wrapper { padding: 20px 0 60px 0; flex: 1; }
        .category-title { margin-left: 5%; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px; color: var(--jj-brown); position: relative; }
        .category-title::after { content: ''; position: absolute; left: 0; bottom: -8px; width: 40px; height: 3px; background: var(--jj-yellow-main); border-radius: 2px; }
        
        .carousel-container { display: flex; gap: 30px; overflow-x: auto; padding: 20px 5% 45px 5%; scrollbar-width: none; }
        .carousel-container::-webkit-scrollbar { display: none; }

        .product-card {
            flex: 0 0 300px; background: var(--jj-bg); padding: 25px; padding-bottom: 85px; border-radius: 45px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            transition: 0.4s; cursor: pointer; position: relative; min-height: 560px;
            transform-style: preserve-3d; transform: perspective(1000px);
        }
        
        .img-sculpt-frame {
            background: var(--jj-bg); height: 260px; border-radius: 35px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
            position: relative; overflow: hidden; margin-bottom: 25px;
            transform: translateZ(20px);
        }
        .img-sculpt-frame img { max-width: 85%; max-height: 85%; object-fit: contain; z-index: 2; transition: 0.5s; }

        .card-btn-fix {
            position: absolute; bottom: 25px; left: 25px; right: 25px;
            background: var(--jj-yellow-main); color: #1a1a1a; border: none; padding: 16px; border-radius: 22px;
            font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: 0.3s;
            box-shadow: 6px 6px 15px rgba(255, 200, 0, 0.35); text-transform: uppercase;
            transform: translateZ(30px);
        }

        /* Footer */
        footer {
            position: relative; background-image: url('jjvidro2.png'); background-size: cover; background-position: center;
            padding: 80px 5% 40px 5%; border-radius: 60px 60px 0 0; overflow: hidden; color: #fff; text-align: center;
        }
        footer::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); z-index: 1; }
        .footer-content { position: relative; z-index: 2; }
        .footer-logo { height: 70px; margin-bottom: 25px; filter: brightness(0) invert(1); }
        .footer-copy { font-size: 0.6rem; color: rgba(255,255,255,0.6); letter-spacing: 2px; text-transform: uppercase; }

        /* Modais */
        .modal { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(12px); }
        .modal-content { background: var(--jj-bg); width: 100%; max-width: 900px; border-radius: 50px; position: relative; z-index: 2100; padding: 40px; max-height: 90vh; overflow-y: auto; box-shadow: 25px 25px 50px rgba(0,0,0,0.2); transition: 0.4s; transform: translateY(40px); opacity: 0; }
        .modal.active .modal-content { transform: translateY(0); opacity: 1; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .close-btn { position: absolute; top: 25px; right: 25px; background: none; border: none; font-size: 2.2rem; cursor: pointer; color: var(--jj-brown); }

        /* UI */
        .user-input, .edit-field { width: 100%; background: var(--jj-bg); border: none; padding: 12px; border-radius: 15px; box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); margin-bottom: 12px; outline: none; font-size: 0.8rem; }
        .jj-btn-ghost { background: var(--jj-bg); border: none; padding: 10px 20px; border-radius: 15px; box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light); font-weight: 700; font-size: 0.65rem; color: var(--jj-brown); cursor: pointer; }

        #cart-btn-floating { position: fixed; bottom: 30px; left: 30px; width: 65px; height: 65px; border-radius: 50%; background: var(--jj-bg); z-index: 1500; box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light); border: none; cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 24px; }
        #cart-badge { position: absolute; top: 0; right: 0; background: var(--jj-yellow-main); font-size: 10px; font-weight: 700; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        #admin-btn { display: none; position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; border-radius: 50%; z-index: 1500; font-size: 32px; border: none; background: var(--jj-yellow-main); cursor: pointer; }

        @media (max-width: 768px) {
            .modal { align-items: flex-end; padding: 0; }
            .modal-content { border-radius: 40px 40px 0 0; padding: 50px 20px 30px 20px; transform: translateY(100%); }
            .modal-grid { grid-template-columns: 1fr; gap: 20px; }
            .cursor-dot, .cursor-outline { display: none; }
            body { cursor: auto; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="main-nav">
        <img src="jjvidro.png" alt="Logo J&J" class="logo-img">
        <div id="auth-ui"></div>
    </nav>

    <div class="category-nav" id="cat-nav-list">
        <button class="cat-filter-btn active" onclick="filterCat('all')">Todos</button>
    </div>

    <main class="content-wrapper" id="main-content"></main>

    <footer>
        <div class="footer-content">
            <img src="jjvidro.png" alt="Logo J&J" class="footer-logo">
            <p class="footer-copy">© 2025 J&J ART COLLECTION. DESIGNED FOR EXCLUSIVITY.</p>
        </div>
    </footer>

    <button id="cart-btn-floating" onclick="openCartModal()">🛒 <div id="cart-badge">0</div></button>
    <button id="admin-btn" onclick="openAdmin()">+</button>

    <div id="details-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <div id="details-body" class="modal-grid"></div>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content" style="max-width: 500px;">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <h2 style="margin-bottom:20px; font-size:1rem; color:var(--jj-brown)">PAINEL DE CONTROLE</h2>
            <div style="display:flex; gap:10px; margin-bottom:20px">
                <button class="jj-btn-ghost" onclick="showAdminView('create')">CRIAR NOVO</button>
                <button class="jj-btn-ghost" onclick="showAdminView('orders')">PEDIDOS</button>
            </div>
            <div id="admin-view-content"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";
        const WPP_NUM = "5511998937643";
        
        let cart = JSON.parse(localStorage.getItem('jj_cart')) || [];
        let currentProduct = null;
        let selectedColor = "";

        // --- INICIALIZAÇÃO ---
        window.addEventListener('popstate', () => closeModals(false));
        auth.onAuthStateChanged(user => {
            const authUI = document.getElementById('auth-ui');
            if (user) {
                authUI.innerHTML = `<span style="font-size:0.65rem; font-weight:700">${user.displayName}</span><button class="jj-btn-ghost" onclick="auth.signOut()" style="margin-left:10px">SAIR</button>`;
                if (user.email === ADM_EMAIL) document.getElementById('admin-btn').style.display = 'block';
            } else {
                authUI.innerHTML = `<button class="jj-btn-ghost" onclick="auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())">ENTRAR</button>`;
            }
            listenToProducts();
            updateCartBadge();
        });

        // --- FUNÇÕES DE VENDAS E ESTOQUE ---
        async function finalizarVenda() {
            const user = document.getElementById('u-final-name').value;
            const pay = document.getElementById('u-payment').value;
            if(!user) return alert("Por favor, informe seu nome.");
            
            const total = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
            const orderId = database.ref('pedidos').push().key;

            try {
                // 1. Salva pedido no banco
                await database.ref(`pedidos/${orderId}`).set({
                    id: orderId,
                    cliente: user,
                    pagamento: pay,
                    total: total,
                    itens: cart,
                    data: new Date().toLocaleString('pt-BR')
                });

                // 2. Baixa estoque real
                for (const item of cart) {
                    const snap = await database.ref(`produtos/${item.productId}/variants/${item.color}/stock`).once('value');
                    let stockStr = snap.val() || "";
                    let parts = stockStr.split(',').map(s => s.trim());
                    let newParts = parts.map(p => {
                        let [sz, q] = p.split(':');
                        if (sz === item.size) return `${sz}:${Math.max(0, parseInt(q) - item.qty)}`;
                        return p;
                    });
                    await database.ref(`produtos/${item.productId}/variants/${item.color}/stock`).set(newParts.join(', '));
                }

                // 3. WhatsApp e Limpeza
                let msg = `*PEDIDO J&J ART COLLECTION*%0A*Cliente:* ${user}%0A*Total:* R$ ${total.toFixed(2)}%0A%0A*ITENS:*%0A`;
                cart.forEach(i => msg += `- ${i.name} (${i.color}/${i.size}) x${i.qty}%0A`);
                window.open(`https://wa.me/${WPP_NUM}?text=${msg}`, '_blank');
                
                cart = [];
                localStorage.removeItem('jj_cart');
                updateCartBadge();
                closeModals();
                alert("Pedido enviado com sucesso!");

            } catch (e) { console.error(e); alert("Erro ao processar. Tente novamente."); }
        }

        // --- CARREGAMENTO E ANIMAÇÃO ---
        function listenToProducts() {
            database.ref('produtos').on('value', snap => {
                const data = snap.val();
                const main = document.getElementById('main-content');
                const catNav = document.getElementById('cat-nav-list');
                main.innerHTML = "";
                catNav.innerHTML = `<button class="cat-filter-btn active" onclick="filterCat('all')">Todos</button>`;
                
                if (data) {
                    const products = Object.values(data);
                    const cats = [...new Set(products.map(p => p.category))];
                    cats.forEach(cat => {
                        catNav.innerHTML += `<button class="cat-filter-btn" onclick="filterCat('${cat}')">${cat}</button>`;
                        const section = document.createElement('div');
                        section.className = `cat-group cat-${cat.replace(/\s+/g, '-')}`;
                        section.innerHTML = `<h2 class="category-title">${cat}</h2><div class="carousel-container" id="cont-${cat.replace(/\s+/g, '-')}"></div>`;
                        main.appendChild(section);
                        
                        products.filter(p => p.category === cat).forEach(p => {
                            const firstCol = p.colors ? p.colors.split(',')[0].trim() : "";
                            const img = (p.variants && p.variants[firstCol]) ? p.variants[firstCol].img : "https://via.placeholder.com/300?text=J&J";
                            const card = document.createElement('div');
                            card.className = 'product-card';
                            card.setAttribute('data-tilt', ''); // Reativa animação
                            card.onclick = () => openDetails(p);
                            card.innerHTML = `
                                ${auth.currentUser?.email === ADM_EMAIL ? `<button onclick="event.stopPropagation(); deleteProduct('${p.id}')" style="position:absolute; top:20px; right:20px; border:none; background:none; font-size:1.5rem; color:var(--jj-brown); z-index:20">&times;</button>` : ''}
                                <div class="img-sculpt-frame"><img src="${img}"></div>
                                <h3>${p.name}</h3>
                                <div style="font-weight:700; color:var(--jj-brown)">R$ ${p.price}</div>
                                <button class="card-btn-fix">DETALHES</button>`;
                            document.getElementById(`cont-${cat.replace(/\s+/g, '-')}`).appendChild(card);
                        });
                    });
                    // Reinicializa o Tilt após carregar os elementos
                    VanillaTilt.init(document.querySelectorAll(".product-card"), { max: 15, speed: 400, glare: true, "max-glare": 0.2 });
                }
            });
        }

        // --- MODAIS ---
        function openDetails(p) {
            currentProduct = p;
            const body = document.getElementById('details-body');
            selectedColor = p.colors ? p.colors.split(',')[0].trim() : "";
            updateDetailsUI();
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
            history.pushState({ modal: true }, "");
        }

        function updateDetailsUI() {
            const p = currentProduct;
            const body = document.getElementById('details-body');
            const v = (p.variants && p.variants[selectedColor]) ? p.variants[selectedColor] : { img: "https://via.placeholder.com/300?text=J&J", stock: "" };
            
            // Filtra tamanhos com estoque > 0
            const stocks = v.stock.split(',').filter(s => parseInt(s.split(':')[1]) > 0);
            const sizeOpts = stocks.map(s => `<option value="${s.split(':')[0].trim()}">${s.trim()}</option>`).join('');
            const colDots = p.colors.split(',').map(c => `<div onclick="selectedColor='${c.trim()}'; updateDetailsUI()" class="color-dot-btn ${c.trim()===selectedColor?'selected':''}" style="background:${c.trim()}; width:30px; height:30px; border-radius:50%; display:inline-block; margin:5px; cursor:pointer; border:2px solid white; box-shadow: 2px 2px 5px rgba(0,0,0,0.1)"></div>`).join('');

            body.innerHTML = `
                <div class="img-sculpt-frame"><img src="${v.img}"></div>
                <div>
                    <h2>${p.name}</h2>
                    <p style="font-size:0.8rem; margin:15px 0">${p.desc || ''}</p>
                    <div style="background:rgba(0,0,0,0.03); padding:15px; border-radius:20px; margin-bottom:15px">
                        <label>CORES:</label><br>${colDots}<br><br>
                        <label>TAMANHO:</label>
                        <select id="u-size" class="user-input">${sizeOpts || '<option>Esgotado</option>'}</select>
                        <label>QTD:</label>
                        <input type="number" id="u-qty" class="user-input" value="1" min="1">
                    </div>
                    <div style="font-size:1.5rem; font-weight:700; margin-bottom:15px">R$ ${p.price}</div>
                    <button class="card-btn-fix" style="position:static; width:100%" onclick="addToCart()">ADICIONAR</button>
                </div>`;
        }

        function addToCart() {
            const size = document.getElementById('u-size').value;
            if(size === "Esgotado") return alert("Item sem estoque.");
            cart.push({ productId: currentProduct.id, name: currentProduct.name, price: parseFloat(currentProduct.price), size, color: selectedColor, qty: parseInt(document.getElementById('u-qty').value) });
            saveCart();
            closeModals();
        }

        function openCartModal() {
            const body = document.getElementById('details-body');
            let total = 0;
            let list = cart.map((i, idx) => { 
                total += (i.price * i.qty); 
                return `<div style="padding:15px; background:white; border-radius:15px; margin-bottom:10px; font-size:0.75rem; position:relative;">
                    <b>${i.name}</b><br>${i.color} | ${i.size} | x${i.qty}<br><b>R$ ${(i.price*i.qty).toFixed(2)}</b>
                    <button onclick="cart.splice(${idx},1); saveCart(); openCartModal();" style="position:absolute; right:15px; top:15px; border:none; background:none; cursor:pointer; font-size:1.2rem">&times;</button>
                </div>`;
            }).join('');

            body.innerHTML = `
                <div style="grid-column: span 2">
                    <h2>SUA LISTA</h2>
                    <div style="max-height:300px; overflow-y:auto; margin:20px 0">${list || 'Vazio'}</div>
                    <div style="background:var(--jj-yellow-main); padding:15px; border-radius:15px; font-weight:700; text-align:right">TOTAL: R$ ${total.toFixed(2)}</div>
                    <br>
                    <input type="text" id="u-final-name" class="user-input" placeholder="Seu Nome">
                    <select id="u-payment" class="user-input"><option value="Pix">Pix</option><option value="Cartão">Cartão</option></select>
                    <button class="card-btn-fix" style="position:static; width:100%" onclick="finalizarVenda()">FINALIZAR NO WHATSAPP</button>
                </div>`;
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
            history.pushState({ modal: true }, "");
        }

        // --- AUXILIARES ---
        function saveCart() { localStorage.setItem('jj_cart', JSON.stringify(cart)); updateCartBadge(); }
        function updateCartBadge() {
            document.getElementById('cart-badge').innerText = cart.length;
            document.getElementById('cart-btn-floating').style.display = cart.length > 0 ? 'flex' : 'none';
        }
        function closeModals(goBack = true) {
            document.querySelectorAll('.modal').forEach(m => { m.classList.remove('active'); setTimeout(() => m.style.display = 'none', 400); });
            if (goBack && history.state?.modal) history.back();
        }
        function filterCat(cat) {
            document.querySelectorAll('.cat-filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.cat-group').forEach(g => g.style.display = (cat === 'all' || g.classList.contains(`cat-${cat.replace(/\s+/g, '-')}`)) ? 'block' : 'none');
        }
        function deleteProduct(id) { if(confirm("Apagar?")) database.ref('produtos/'+id).remove(); }
        function openAdmin() { document.getElementById('admin-modal').style.display='flex'; setTimeout(()=>document.getElementById('admin-modal').classList.add('active'),10); showAdminView('create'); }
        
        function showAdminView(v) {
            const cont = document.getElementById('admin-view-content');
            if(v === 'create') {
                cont.innerHTML = `<input id="p-cat" class="edit-field" placeholder="Categoria"><input id="p-name" class="edit-field" placeholder="Nome"><input id="p-price" class="edit-field" placeholder="Preço"><input id="p-colors" class="edit-field" placeholder="Cores (Azul, Preto)"><textarea id="p-desc" class="edit-field" placeholder="Descrição"></textarea><button class="card-btn-fix" style="position:static; width:100%" onclick="saveNewProd()">CRIAR</button>`;
            } else {
                database.ref('pedidos').limitToLast(10).on('value', snap => {
                    let html = `<div style="max-height:350px; overflow-y:auto">`;
                    if(snap.val()) Object.values(snap.val()).reverse().forEach(o => {
                        html += `<div style="padding:10px; background:white; border-radius:10px; margin-bottom:10px; font-size:0.7rem"><b>${o.cliente}</b> - R$ ${o.total.toFixed(2)}<br><small>${o.data}</small></div>`;
                    });
                    cont.innerHTML = html + `</div>`;
                });
            }
        }

        function saveNewProd() {
            const ref = database.ref('produtos').push();
            ref.set({ id: ref.key, category: document.getElementById('p-cat').value, name: document.getElementById('p-name').value, price: document.getElementById('p-price').value, colors: document.getElementById('p-colors').value, desc: document.getElementById('p-desc').value }).then(()=>closeModals());
        }

        // Cursor
        if (window.innerWidth > 768) {
            const dot = document.querySelector('.cursor-dot'), out = document.querySelector('.cursor-outline');
            window.onmousemove = (e) => { dot.style.left = e.clientX+'px'; dot.style.top = e.clientY+'px'; out.style.left = (e.clientX - 16) +'px'; out.style.top = (e.clientY - 16) +'px'; };
        }
    </script>
</body>
</html>
