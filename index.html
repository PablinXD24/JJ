<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Art Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        /* Reset e Base */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); overflow-x: hidden; cursor: none; display: flex; flex-direction: column; min-height: 100vh; }

        /* Cursor Custom */
        .cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--jj-yellow-main); border-radius: 50%; z-index: 10000; pointer-events: none; }
        .cursor-outline { position: fixed; width: 40px; height: 40px; border: 2px solid var(--jj-yellow-main); border-radius: 50%; z-index: 9999; pointer-events: none; transition: 0.1s; }

        /* Nav */
        .main-nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background: rgba(248, 249, 250, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .logo-img { height: 50px; width: auto; }
        
        /* Categorias */
        .category-nav { display: flex; gap: 15px; overflow-x: auto; padding: 15px 5%; scrollbar-width: none; background: var(--jj-bg); position: sticky; top: 80px; z-index: 90; }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-filter-btn { padding: 8px 20px; border-radius: 15px; border: none; background: var(--jj-bg); box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); font-size: 0.7rem; font-weight: 700; color: var(--jj-brown); cursor: pointer; white-space: nowrap; text-transform: uppercase; transition: 0.3s; }
        .cat-filter-btn.active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); color: var(--jj-yellow-main); }

        /* Cards */
        .content-wrapper { padding: 20px 0 60px 0; flex: 1; }
        .category-title { margin-left: 5%; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px; color: var(--jj-brown); position: relative; }
        .category-title::after { content: ''; position: absolute; left: 0; bottom: -8px; width: 40px; height: 3px; background: var(--jj-yellow-main); border-radius: 2px; }
        
        .carousel-container { display: flex; gap: 30px; overflow-x: auto; padding: 20px 5% 45px 5%; scrollbar-width: none; }
        .carousel-container::-webkit-scrollbar { display: none; }

        .product-card {
            flex: 0 0 300px; background: var(--jj-bg); padding: 25px; padding-bottom: 85px; border-radius: 45px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            transition: 0.4s; cursor: pointer; position: relative; min-height: 560px;
        }
        
        .img-sculpt-frame {
            background: var(--jj-bg); height: 260px; border-radius: 35px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
            position: relative; overflow: hidden; margin-bottom: 25px;
        }
        .img-sculpt-frame img { max-width: 85%; max-height: 85%; object-fit: contain; z-index: 2; transition: 0.5s; }

        .card-btn-fix {
            position: absolute; bottom: 25px; left: 25px; right: 25px;
            background: var(--jj-yellow-main); color: #1a1a1a; border: none; padding: 16px; border-radius: 22px;
            font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: 0.3s;
            box-shadow: 6px 6px 15px rgba(255, 200, 0, 0.35); text-transform: uppercase;
        }

        /* Footer com imagem */
        footer {
            position: relative; background-image: url('jjvidro2.png'); background-size: cover; background-position: center;
            padding: 80px 5% 40px 5%; border-radius: 60px 60px 0 0; overflow: hidden; color: #fff; text-align: center;
        }
        footer::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); z-index: 1; }
        .footer-content { position: relative; z-index: 2; }
        .footer-logo { height: 70px; margin-bottom: 25px; filter: brightness(0) invert(1); }
        .footer-links { display: flex; justify-content: center; gap: 30px; margin-bottom: 25px; }
        .footer-links a { color: var(--jj-yellow-main); font-size: 0.75rem; text-decoration: none; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .footer-copy { font-size: 0.6rem; color: rgba(255,255,255,0.6); letter-spacing: 2px; text-transform: uppercase; }

        /* Modais */
        .modal { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(12px); }
        .modal-content { background: var(--jj-bg); width: 100%; max-width: 900px; border-radius: 50px; position: relative; z-index: 2100; padding: 40px; max-height: 90vh; overflow-y: auto; box-shadow: 25px 25px 50px rgba(0,0,0,0.2); transition: 0.4s; transform: translateY(40px); opacity: 0; }
        .modal.active .modal-content { transform: translateY(0); opacity: 1; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .close-btn { position: absolute; top: 25px; right: 25px; background: none; border: none; font-size: 2.2rem; cursor: pointer; color: var(--jj-brown); }

        /* Botões Flutuantes */
        #cart-btn-floating { position: fixed; bottom: 30px; left: 30px; width: 65px; height: 65px; border-radius: 50%; background: var(--jj-bg); z-index: 1500; box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light); border: none; cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 24px; }
        #cart-badge { position: absolute; top: 0; right: 0; background: var(--jj-yellow-main); font-size: 10px; font-weight: 700; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        #admin-btn { display: none; position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; border-radius: 50%; z-index: 1500; font-size: 32px; border: none; background: var(--jj-yellow-main); cursor: pointer; }

        /* UI Elements Adicionais */
        .color-dot-btn { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: 0.2s; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
        .color-dot-btn.selected { border-color: var(--jj-yellow-main); transform: scale(1.15); }
        .color-selector { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .jj-btn-ghost { background: var(--jj-bg); border: none; padding: 10px 20px; border-radius: 15px; box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light); font-weight: 700; font-size: 0.65rem; color: var(--jj-brown); cursor: pointer; }
        .user-input, .edit-field { width: 100%; background: var(--jj-bg); border: none; padding: 12px; border-radius: 15px; box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); margin-bottom: 12px; outline: none; font-size: 0.8rem; }

        @media (max-width: 768px) {
            .modal { align-items: flex-end; padding: 0; }
            .modal-content { border-radius: 40px 40px 0 0; padding: 50px 20px 30px 20px; transform: translateY(100%); }
            .modal-grid { grid-template-columns: 1fr; gap: 20px; }
            .cursor-dot, .cursor-outline { display: none; }
            body { cursor: auto; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="main-nav">
        <img src="jjvidro.png" alt="Logo J&J" class="logo-img">
        <div id="auth-ui"><button class="jj-btn-ghost" onclick="loginGoogle()">ENTRAR</button></div>
    </nav>

    <div class="category-nav" id="cat-nav-list">
        <button class="cat-filter-btn active" onclick="filterCat('all')">Todos</button>
    </div>

    <main class="content-wrapper" id="main-content"></main>

    <footer>
        <div class="footer-content">
            <img src="jjvidro.png" alt="Logo J&J" class="footer-logo">
            <div class="footer-links">
                <a href="#">Catálogo</a>
                <a href="#">Privacidade</a>
                <a href="#">Suporte</a>
            </div>
            <p class="footer-copy">© 2025 J&J ART COLLECTION. DESIGNED FOR EXCLUSIVITY.</p>
        </div>
    </footer>

    <button id="cart-btn-floating" onclick="openCartModal()">🛒 <div id="cart-badge">0</div></button>
    <button id="admin-btn" onclick="openAdmin()">+</button>

    <div id="details-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <div id="details-body" class="modal-grid"></div>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content" style="max-width: 500px;">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <h2 style="margin-bottom:20px; font-size:1rem; color:var(--jj-brown)">CRIAR NOVO ITEM</h2>
            <input type="text" id="p-category" class="edit-field" placeholder="Categoria">
            <input type="text" id="p-name" class="edit-field" placeholder="Nome">
            <input type="text" id="p-price" class="edit-field" placeholder="Preço (Apenas Números)">
            <input type="text" id="p-colors" class="edit-field" placeholder="Cores (Ex: Preto, Azul)">
            <textarea id="p-desc" class="edit-field" placeholder="Descrição"></textarea>
            <button class="card-btn-fix" onclick="saveToRTDB()" style="position:static; width:100%">CRIAR ITEM</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        const provider = new firebase.auth.GoogleAuthProvider();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";
        const WPP_NUM = "5511998937643";
        let cart = [], currentProduct = null, selectedColor = "";

        // AUTH
        function loginGoogle() { auth.signInWithPopup(provider); }
        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            const authUI = document.getElementById('auth-ui');
            if (user) {
                authUI.innerHTML = `<span style="font-size:0.65rem; font-weight:700">${user.displayName}</span><button class="jj-btn-ghost" onclick="logout()" style="margin-left:10px">SAIR</button>`;
                if (user.email === ADM_EMAIL) document.getElementById('admin-btn').style.display = 'block';
            } else {
                authUI.innerHTML = `<button class="jj-btn-ghost" onclick="loginGoogle()">ENTRAR</button>`;
            }
            listenToProducts();
        });

        // ADMIN
        function saveToRTDB() {
            const name = document.getElementById('p-name').value;
            if (name) {
                const ref = database.ref('produtos').push();
                ref.set({
                    id: ref.key,
                    category: document.getElementById('p-category').value || "Geral",
                    name: name,
                    price: document.getElementById('p-price').value.replace(',', '.'),
                    colors: document.getElementById('p-colors').value,
                    desc: document.getElementById('p-desc').value
                }).then(() => { closeModals(); alert("Item criado!"); });
            }
        }

        function listenToProducts() {
            database.ref('produtos').on('value', snap => {
                const data = snap.val();
                const main = document.getElementById('main-content');
                const catNav = document.getElementById('cat-nav-list');
                main.innerHTML = "";
                catNav.innerHTML = `<button class="cat-filter-btn active" onclick="filterCat('all')">Todos</button>`;
                
                if (data) {
                    const products = Object.values(data);
                    const cats = [...new Set(products.map(p => p.category))];
                    
                    cats.forEach(cat => {
                        catNav.innerHTML += `<button class="cat-filter-btn" onclick="filterCat('${cat}')">${cat}</button>`;
                        const section = document.createElement('div');
                        section.className = `cat-group cat-${cat.replace(/\s+/g, '-')}`;
                        section.innerHTML = `<h2 class="category-title">${cat}</h2><div class="carousel-container" id="cat-container-${cat.replace(/\s+/g, '-')}"></div>`;
                        main.appendChild(section);
                        
                        products.filter(p => p.category === cat).forEach(p => {
                            const firstColor = p.colors ? p.colors.split(',')[0].trim() : "";
                            const displayImg = (p.variants && p.variants[firstColor] && p.variants[firstColor].img) 
                                ? p.variants[firstColor].img 
                                : "https://via.placeholder.com/300?text=J&J+Art";

                            const card = document.createElement('div');
                            card.className = 'product-card';
                            card.onclick = () => openDetails(p);
                            card.innerHTML = `
                                ${auth.currentUser?.email === ADM_EMAIL ? `<button onclick="event.stopPropagation(); deleteProduct('${p.id}')" style="position:absolute; top:20px; right:20px; border:none; background:none; font-size:1.5rem; color:var(--jj-brown); cursor:pointer; z-index:20">&times;</button>` : ''}
                                <div class="img-sculpt-frame"><img src="${displayImg}"></div>
                                <div class="card-info">
                                    <span class="card-label">Exclusivo</span>
                                    <h3>${p.name}</h3>
                                    <div class="price">R$ ${p.price}</div>
                                </div>
                                <button class="card-btn-fix">VER DETALHES</button>`;
                            document.getElementById(`cat-container-${cat.replace(/\s+/g, '-')}`).appendChild(card);
                        });
                    });
                }
            });
        }

        // MODAL DETALHES
        function openDetails(p) {
            currentProduct = p;
            const body = document.getElementById('details-body');
            const isAdm = auth.currentUser?.email === ADM_EMAIL;
            const colors = p.colors ? p.colors.split(',').map(c => c.trim()) : [];
            selectedColor = colors[0] || "";

            if (isAdm) {
                let variantEditors = colors.map(c => {
                    const v = (p.variants && p.variants[c]) ? p.variants[c] : { img: "", stock: "" };
                    return `
                    <div style="margin-bottom:15px; padding:12px; background:rgba(0,0,0,0.02); border-radius:15px; border:1px solid rgba(0,0,0,0.05)">
                        <h4 style="color:var(--jj-brown); font-size:0.65rem; margin-bottom:8px">COR: ${c.toUpperCase()}</h4>
                        <input type="file" onchange="uploadVariantImg('${p.id}', '${c}', this)" style="font-size:0.6rem; margin-bottom:8px">
                        <img src="${v.img}" id="prev-${c}" style="width:50px; display:${v.img ? 'block' : 'none'}; border-radius:5px; margin-bottom:8px; height: 50px; object-fit: cover;">
                        <input type="text" class="edit-field v-stock" data-color="${c}" value="${v.stock || ''}" placeholder="Ex: P:5, M:10">
                    </div>`;
                }).join('');

                body.innerHTML = `
                    <div style="grid-column: 1 / -1">
                        <h3 style="margin-bottom:15px">EDITAR PRODUTO</h3>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px">
                            <input type="text" id="e-name" class="edit-field" value="${p.name}">
                            <input type="text" id="e-price" class="edit-field" value="${p.price}">
                            <input type="text" id="e-colors" class="edit-field" value="${p.colors}">
                            <input type="text" id="e-cat" class="edit-field" value="${p.category}">
                        </div>
                        <textarea id="e-desc" class="edit-field">${p.desc || ''}</textarea>
                        <h4 style="font-size:0.7rem; margin:10px 0">ESTOQUE E FOTOS POR COR:</h4>
                        <div style="max-height: 300px; overflow-y: auto;">${variantEditors}</div>
                        <button class="card-btn-fix" style="position:static; width:100%; margin-top:15px" onclick="updateProductAll('${p.id}')">SALVAR TUDO</button>
                    </div>`;
            } else {
                updateUserModalView(p, selectedColor);
            }
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
        }

        function updateUserModalView(p, color) {
            const body = document.getElementById('details-body');
            const v = (p.variants && p.variants[color]) ? p.variants[color] : { img: "https://via.placeholder.com/300?text=J&J+Art", stock: "" };
            
            const stockMap = {};
            if(v.stock) v.stock.split(',').forEach(item => { const [t, q] = item.split(':'); if(t && q) stockMap[t.trim()] = q.trim(); });
            
            const sizeOptions = Object.keys(stockMap).map(s => `<option value="${s}">${s}</option>`).join('');
            const colorDots = p.colors.split(',').map(c => {
                const cl = c.trim();
                return `<div class="color-dot-btn ${cl === color ? 'selected' : ''}" style="background:${cl}" onclick="switchColor('${cl}')"></div>`;
            }).join('');

            body.innerHTML = `
                <div class="img-sculpt-frame"><img id="main-view-img" src="${v.img}"></div>
                <div>
                    <h2 style="color:var(--jj-brown)">${p.name}</h2>
                    <p style="font-size:0.75rem; color:#666; margin:10px 0 20px 0">${p.desc || ''}</p>
                    <div style="background:rgba(0,0,0,0.03); padding:15px; border-radius:20px; margin-bottom:15px">
                        <label style="font-size:0.6rem; font-weight:700">COR: ${color.toUpperCase()}</label>
                        <div class="color-selector" style="margin-top:8px">${colorDots}</div>
                        <label style="font-size:0.6rem; font-weight:700">TAMANHO:</label>
                        <select id="u-size" class="user-input">${sizeOptions || '<option disabled>Indisponível</option>'}</select>
                        <label style="font-size:0.6rem; font-weight:700">QUANTIDADE:</label>
                        <input type="number" id="u-qty" class="user-input" value="1" min="1">
                    </div>
                    <div style="font-weight:800; font-size:1.4rem; margin-bottom:15px">R$ ${p.price}</div>
                    <button class="card-btn-fix" style="position:static; width:100%" onclick="addToCart('${p.name}', '${p.price}')">ADICIONAR À LISTA</button>
                </div>`;
        }

        function switchColor(color) { 
            selectedColor = color; 
            updateUserModalView(currentProduct, color); 
        }

        function uploadVariantImg(pid, color, input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64 = e.target.result;
                    database.ref(`produtos/${pid}/variants/${color}/img`).set(base64);
                    const prev = document.getElementById(`prev-${color}`);
                    if(prev) { prev.src = base64; prev.style.display = 'block'; }
                };
                reader.readAsDataURL(file);
            }
        }

        function updateProductAll(id) {
            const updates = {
                name: document.getElementById('e-name').value,
                price: document.getElementById('e-price').value,
                colors: document.getElementById('e-colors').value,
                category: document.getElementById('e-cat').value,
                desc: document.getElementById('e-desc').value
            };
            document.querySelectorAll('.v-stock').forEach(input => {
                const color = input.dataset.color;
                database.ref(`produtos/${id}/variants/${color}/stock`).set(input.value);
            });
            database.ref('produtos/'+id).update(updates).then(() => { alert("Atualizado!"); closeModals(); });
        }

        // CARRINHO
        function addToCart(name, price) {
            const size = document.getElementById('u-size').value;
            if(!size || size.includes("Indisponível")) return alert("Indisponível.");
            cart.push({ name, price: parseFloat(price), size, color: selectedColor, qty: parseInt(document.getElementById('u-qty').value) });
            document.getElementById('cart-badge').innerText = cart.length;
            document.getElementById('cart-btn-floating').style.display = 'flex';
            closeModals();
        }

        function openCartModal() {
            const body = document.getElementById('details-body');
            let total = 0;
            let list = cart.map((i, idx) => {
                total += (i.price * i.qty);
                return `
                <div style="padding:15px; background:white; border-radius:15px; margin-bottom:10px; font-size:0.75rem; position:relative; box-shadow: 4px 4px 10px rgba(0,0,0,0.05)">
                    <b>${i.name}</b><br>
                    <span style="color:var(--jj-brown)">${i.color} | ${i.size} | Qtd: ${i.qty}</span><br>
                    <div style="margin-top:5px; font-weight:700">R$ ${(i.price * i.qty).toFixed(2)}</div>
                    <button onclick="cart.splice(${idx},1); openCartModal();" style="position:absolute; right:15px; top:15px; border:none; background:none; cursor:pointer; font-size:1.2rem">&times;</button>
                </div>`;
            }).join('');
            
            body.innerHTML = `
                <div style="grid-column: span 2">
                    <h2 style="margin-bottom:20px; color:var(--jj-brown)">MINHA LISTA</h2>
                    <div style="max-height: 250px; overflow-y: auto; margin-bottom:20px">${list || '<p>Lista vazia.</p>'}</div>
                    <div style="padding:15px; background:var(--jj-yellow-main); border-radius:15px; margin-bottom:15px; font-weight:700; text-align:right">TOTAL: R$ ${total.toFixed(2)}</div>
                    
                    <input type="text" id="u-final-name" class="user-input" placeholder="Seu Nome Completo">
                    <label style="font-size:0.6rem; font-weight:700">FORMA DE PAGAMENTO:</label>
                    <select id="u-payment" class="user-input">
                        <option value="Pix">Pix</option>
                        <option value="Cartão de Crédito">Cartão de Crédito</option>
                        <option value="Boleto">Boleto</option>
                    </select>

                    <button class="card-btn-fix" style="position:static; width:100%" onclick="sendWhatsApp(${total})">FINALIZAR NO WHATSAPP</button>
                </div>`;
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
            if(cart.length === 0) document.getElementById('cart-btn-floating').style.display = 'none';
        }

        function sendWhatsApp(totalPedido) {
            const user = document.getElementById('u-final-name').value;
            const payment = document.getElementById('u-payment').value;
            if(!user) return alert("Por favor, informe seu nome.");
            
            let msg = `*PEDIDO J&J ART COLLECTION*\n`;
            msg += `----------------------------\n`;
            msg += `*Cliente:* ${user}\n`;
            msg += `*Pagamento:* ${payment}\n\n`;
            msg += `*ITENS DO PEDIDO:*\n`;
            
            cart.forEach((i, index) => {
                msg += `${index + 1}. *${i.name}*\n`;
                msg += `   • Cor: ${i.color} / Tamanho: ${i.size}\n`;
                msg += `   • Qtd: ${i.qty} x R$ ${i.price.toFixed(2)}\n\n`;
            });
            
            msg += `----------------------------\n`;
            msg += `*TOTAL DO PEDIDO:* R$ ${totalPedido.toFixed(2)}\n\n`;
            msg += `Volte sempre para mais compras em nossa loja!\n`;
            msg += `https://pablinxd24.github.io/JJ`;
            
            window.open(`https://wa.me/${WPP_NUM}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // UTIL
        function filterCat(cat) {
            document.querySelectorAll('.cat-filter-btn').forEach(b => b.classList.remove('active'));
            if(event) event.target.classList.add('active');
            document.querySelectorAll('.cat-group').forEach(g => {
                g.style.display = (cat === 'all' || g.classList.contains(`cat-${cat.replace(/\s+/g, '-')}`)) ? 'block' : 'none';
            });
        }
        function deleteProduct(id) { if(confirm("Apagar permanentemente?")) database.ref('produtos/'+id).remove(); }
        function openAdmin() { document.getElementById('admin-modal').style.display='flex'; setTimeout(()=>document.getElementById('admin-modal').classList.add('active'),10); }
        function closeModals() { document.querySelectorAll('.modal').forEach(m=>{m.classList.remove('active'); setTimeout(()=>m.style.display='none',400);}); }

        if (window.innerWidth > 768) {
            const dot = document.querySelector('.cursor-dot'), out = document.querySelector('.cursor-outline');
            window.onmousemove = (e) => { 
                dot.style.left = e.clientX+'px'; dot.style.top = e.clientY+'px'; 
                out.style.left = (e.clientX - 16) +'px'; out.style.top = (e.clientY - 16) +'px'; 
            };
        }
    </script>
</body>
</html>
