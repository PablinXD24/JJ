<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Painel Administrativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); overflow-x: hidden; cursor: none; display: flex; flex-direction: column; min-height: 100vh; }

        /* Estética das Cortinas e Tapete (Instruções Salvas) */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
            z-index: -1; pointer-events: none;
        }

        .cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--jj-yellow-main); border-radius: 50%; z-index: 10000; pointer-events: none; }
        .cursor-outline { position: fixed; width: 40px; height: 40px; border: 2px solid var(--jj-yellow-main); border-radius: 50%; z-index: 9999; pointer-events: none; transition: 0.1s; }

        .main-nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px); border-bottom: 2px solid var(--jj-yellow-main); color: white; }
        .logo-img { height: 50px; width: auto; filter: brightness(0) invert(1); }
        
        .category-nav { display: flex; gap: 15px; overflow-x: auto; padding: 15px 5%; scrollbar-width: none; background: var(--jj-bg); position: sticky; top: 80px; z-index: 90; }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-filter-btn { padding: 8px 20px; border-radius: 15px; border: none; background: var(--jj-bg); box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); font-size: 0.7rem; font-weight: 700; color: var(--jj-brown); cursor: pointer; white-space: nowrap; text-transform: uppercase; transition: 0.3s; }
        .cat-filter-btn.active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); color: var(--jj-yellow-main); }

        .content-wrapper { padding: 20px 0 60px 0; flex: 1; background: #8b0000; /* Simulação carpete vermelho */ }
        .category-title { margin-left: 5%; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px; color: #fff; position: relative; }
        
        .product-card {
            flex: 0 0 300px; background: var(--jj-bg); padding: 25px; padding-bottom: 85px; border-radius: 45px;
            box-shadow: 15px 15px 30px rgba(0,0,0,0.5); transition: 0.4s; cursor: pointer; position: relative; min-height: 560px;
        }

        .float-btn { position: fixed; width: 65px; height: 65px; border-radius: 50%; background: var(--jj-bg); z-index: 1500; box-shadow: 8px 8px 16px rgba(0,0,0,0.3); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: 0.3s; }
        #admin-btn { bottom: 30px; right: 30px; background: var(--jj-yellow-main); }
        #dash-btn-floating { bottom: 105px; right: 30px; background: var(--jj-brown); color: white; }
        #scan-btn-floating { bottom: 180px; right: 30px; }
        #caixa-btn-floating { bottom: 255px; right: 30px; }

        .modal { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); }
        .modal-content { background: var(--jj-bg); width: 100%; max-width: 900px; border-radius: 50px; position: relative; z-index: 2100; padding: 40px; max-height: 90vh; overflow-y: auto; }
        
        .edit-field { width: 100%; background: var(--jj-bg); border: none; padding: 12px; border-radius: 15px; box-shadow: inset 3px 3px 6px var(--shadow-dark); margin-bottom: 12px; outline: none; }
        
        @media (max-width: 768px) {
            .cursor-dot, .cursor-outline { display: none; }
            body { cursor: auto; }
        }
    </style>
</head>
<body>
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="main-nav">
        <img src="jjvidro.png" alt="Logo J&J" class="logo-img">
        <div id="auth-ui">
            <button class="cat-filter-btn" onclick="logoutAdm()" style="color: #ff4444;">SAIR DO ADM</button>
        </div>
    </nav>

    <div class="category-nav" id="cat-nav-list">
        <button class="cat-filter-btn active" onclick="filterCat('all')">Todos (Gestão)</button>
    </div>

    <main class="content-wrapper" id="main-content"></main>

    <button id="caixa-btn-floating" class="float-btn" onclick="openAdminTab('caixa')">🏦</button>
    <button id="scan-btn-floating" class="float-btn" onclick="openScanner()">📷</button>
    <button id="dash-btn-floating" class="float-btn" onclick="openAdminTab('dash')">📊</button>
    <button id="admin-btn" class="float-btn" onclick="openAdmin()">+</button>

    <div id="admin-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content" style="max-width: 600px;">
            <button class="close-btn" onclick="closeModals()" style="float:right; background:none; border:none; font-size:2rem;">&times;</button>
            <div style="display:flex; gap:10px; margin-bottom:25px;">
                <button class="cat-filter-btn active" id="tab-novo" onclick="switchAdminTab('novo')">Novo Item</button>
                <button class="cat-filter-btn" id="tab-caixa" onclick="switchAdminTab('caixa')">Caixa</button>
                <button class="cat-filter-btn" id="tab-dash" onclick="switchAdminTab('dash')">Pedidos</button>
            </div>
            
            <div id="admin-create-section">
                <input type="text" id="p-category" class="edit-field" placeholder="Categoria">
                <input type="text" id="p-name" class="edit-field" placeholder="Nome do Item">
                <input type="text" id="p-price" class="edit-field" placeholder="Preço (Ex: 150.00)">
                <input type="text" id="p-colors" class="edit-field" placeholder="Cores (Ex: Ouro, Prata)">
                <textarea id="p-desc" class="edit-field" placeholder="Descrição"></textarea>
                <button onclick="saveToRTDB()" style="width:100%; padding:15px; border-radius:15px; background:var(--jj-yellow-main); border:none; font-weight:700; cursor:pointer;">CADASTRAR</button>
            </div>
            </div>
    </div>

    <script>
        // CONFIGURAÇÃO FIREBASE (Usando suas credenciais do arquivo original)
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), database = firebase.database();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";

        // PROTEÇÃO DE ACESSO
        auth.onAuthStateChanged(user => {
            if (!user || user.email !== ADM_EMAIL) {
                window.location.href = 'index.html'; // Redireciona se não for ADM
            } else {
                listenToProducts(); // Carrega produtos se for ADM
            }
        });

        function logoutAdm() {
            auth.signOut().then(() => { window.location.href = 'index.html'; });
        }

        // FUNÇÕES DE GESTÃO (Idênticas ao index 23)
        function listenToProducts() {
            database.ref('produtos').on('value', snap => {
                const data = snap.val();
                const container = document.getElementById('main-content');
                container.innerHTML = '';
                if(!data) return;

                Object.keys(data).forEach(id => {
                    const p = data[id];
                    container.innerHTML += `
                        <div class="product-card" style="margin: 20px auto; width: 90%;">
                            <h3>${p.nome}</h3>
                            <p>R$ ${p.preco}</p>
                            <button onclick="deleteProduct('${id}')" style="background:#ff4444; color:white; border:none; padding:10px; border-radius:10px; cursor:pointer; margin-top:10px;">REMOVER ITEM</button>
                        </div>
                    `;
                });
            });
        }

        function deleteProduct(id) {
            if(confirm("Deseja realmente remover este item do catálogo?")) {
                database.ref('produtos/'+id).remove();
            }
        }

        function openAdmin() {
            document.getElementById('admin-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('admin-modal').classList.add('active'), 10);
        }

        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => {
                m.classList.remove('active');
                setTimeout(() => m.style.display = 'none', 400);
            });
        }

        function saveToRTDB() {
            const nome = document.getElementById('p-name').value;
            const preco = document.getElementById('p-price').value;
            if(!nome || !preco) return alert("Preencha os dados");
            
            const newId = database.ref('produtos').push().key;
            database.ref('produtos/'+newId).set({
                nome, preco, 
                categoria: document.getElementById('p-category').value,
                descricao: document.getElementById('p-desc').value
            }).then(() => {
                alert("Sucesso!");
                closeModals();
            });
        }

        // Lógica do cursor
        if(window.innerWidth > 768) {
            const dot = document.querySelector('.cursor-dot'), out = document.querySelector('.cursor-outline');
            window.onmousemove = (e) => {
                dot.style.left = e.clientX+'px'; dot.style.top = e.clientY+'px';
                out.style.left = e.clientX+'px'; out.style.top = e.clientY+'px';
            };
        }
    </script>
</body>
</html>
