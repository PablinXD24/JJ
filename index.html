<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Art Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow-light: #FFF4AC;
            --jj-yellow-main: #FFC800;
            --jj-olive: #7C8F65;
            --jj-brown: #834A29;
            --jj-dark-olive: #606C38;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.5);
            --shadow-light: rgba(255, 255, 255, 0.8);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); overflow-x: hidden; cursor: none; }

        .cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--jj-yellow-main); border-radius: 50%; z-index: 10000; pointer-events: none; }
        .cursor-outline { position: fixed; width: 40px; height: 40px; border: 2px solid var(--jj-yellow-main); border-radius: 50%; z-index: 9999; pointer-events: none; transition: 0.1s; }

        .main-nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background: rgba(248, 249, 250, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .logo-img { height: 60px; width: auto; object-fit: contain; }

        .content-wrapper { padding: 20px 0 40px 0; max-width: 100vw; }
        .category-section { margin-bottom: 50px; }
        .category-title { margin-left: 5%; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; color: var(--jj-brown); }
        
        .carousel-container { display: flex; gap: 30px; overflow-x: auto; padding: 20px 5% 40px 5%; scroll-behavior: smooth; scrollbar-width: none; }
        .carousel-container::-webkit-scrollbar { display: none; }

        .product-card {
            flex: 0 0 300px; background: var(--jj-bg); padding: 25px; padding-bottom: 85px; border-radius: 45px;
            box-shadow: 12px 12px 25px var(--shadow-dark), -12px -12px 25px var(--shadow-light);
            transition: 0.4s; cursor: pointer; position: relative; min-height: 520px;
        }
        .img-sculpt-frame {
            background: #ffffff; height: 260px; border-radius: 35px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            position: relative; overflow: hidden; margin-bottom: 20px;
        }
        .img-sculpt-frame img { max-width: 85%; max-height: 85%; object-fit: contain; z-index: 2; position: relative; }

        .size-pills { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .size-pill { font-size: 0.6rem; padding: 4px 8px; border-radius: 8px; background: var(--jj-yellow-light); color: var(--jj-brown); font-weight: 700; }

        .product-card h3 { font-weight: 700; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 5px; color: var(--jj-brown); }
        .product-card .price { font-weight: 700; color: var(--jj-yellow-main); font-size: 1.1rem; }

        .card-btn-fix {
            position: absolute; bottom: 25px; left: 25px; right: 25px;
            background: var(--jj-yellow-main); color: #1a1a1a; border: none; padding: 14px; border-radius: 18px;
            font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: 0.2s;
            box-shadow: 4px 4px 10px rgba(255, 200, 0, 0.3); font-family: var(--font-sans); text-transform: uppercase;
        }

        .edit-field { width: 100%; background: #ffffff; border: 1px solid rgba(0,0,0,0.05); padding: 12px; border-radius: 12px; margin-bottom: 10px; font-family: var(--font-sans); outline: none; font-size: 0.85rem; }

        /* Modal Ajustado para Mobile */
        .modal { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); }
        .modal-content { 
            background: #ffffff; width: 100%; max-width: 800px; max-height: 90vh; border-radius: 40px; 
            position: relative; z-index: 2100; padding: 40px; overflow-y: auto; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: slideUp 0.3s ease;
        }

        @media (max-width: 768px) {
            .modal-content { height: 100%; max-height: 100vh; border-radius: 0; padding: 60px 20px 30px 20px; }
            .modal-grid { grid-template-columns: 1fr !important; gap: 20px; }
            .product-card { flex: 0 0 280px; }
            .cursor-dot, .cursor-outline { display: none; }
            body { cursor: auto; }
        }

        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .close-btn { position: absolute; top: 20px; right: 20px; border: none; background: none; font-size: 2rem; color: var(--jj-brown); cursor: pointer; z-index: 2300; }

        #admin-btn { display: none; position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; z-index: 1500; font-size: 28px; border: none; color: #1a1a1a; background: var(--jj-yellow-main); cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="main-nav">
        <img src="j&j vidro.png" alt="J&J Logo" class="logo-img">
        <div id="auth-ui"></div>
    </nav>

    <main class="content-wrapper" id="main-content"></main>

    <div id="details-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <div id="details-body" class="modal-grid"></div>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content" style="max-width: 500px;">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <h2 style="margin-bottom:20px; color:var(--jj-brown)">Novo Produto</h2>
            <input type="text" id="p-category" class="edit-field" placeholder="Categoria">
            <input type="text" id="p-name" class="edit-field" placeholder="Nome">
            <input type="text" id="p-price" class="edit-field" placeholder="Preço (Ex: R$ 199,90)">
            <textarea id="p-sizes" class="edit-field" placeholder="Tamanhos e Qtd (Ex: P:2, M:5, G:0)"></textarea>
            <input type="file" id="p-file" class="edit-field" accept="image/*" onchange="handleFileSelect(this, 'p-img-preview')">
            <img id="p-img-preview" style="width:60px; display:none; margin-bottom:10px">
            <textarea id="p-desc" class="edit-field" placeholder="Descrição completa..." rows="3"></textarea>
            <button class="card-btn-fix" onclick="saveToRTDB()" style="position:static; width:100%">SALVAR PRODUTO</button>
        </div>
    </div>

    <button id="admin-btn" onclick="openAdmin()">+</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        const provider = new firebase.auth.GoogleAuthProvider();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";
        let tempBase64 = "";

        function loginGoogle() { auth.signInWithPopup(provider); }
        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            const authUI = document.getElementById('auth-ui');
            const adminBtn = document.getElementById('admin-btn');
            if (user) {
                authUI.innerHTML = `<span style="font-size:0.7rem; font-weight:700;">${user.displayName}</span> <button onclick="logout()" style="border:none; background:none; cursor:pointer; font-weight:700; color:var(--jj-brown); margin-left:10px">SAIR</button>`;
                if (user.email === ADM_EMAIL) adminBtn.style.display = 'block';
            } else {
                authUI.innerHTML = `<button onclick="loginGoogle()" class="jj-btn-ghost">ENTRAR</button>`;
                adminBtn.style.display = 'none';
            }
            listenToProducts();
        });

        function handleFileSelect(input, previewId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    tempBase64 = e.target.result;
                    document.getElementById(previewId).src = tempBase64;
                    document.getElementById(previewId).style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function saveToRTDB() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const sizesRaw = document.getElementById('p-sizes').value;
            const desc = document.getElementById('p-desc').value;
            const category = document.getElementById('p-category').value || "Geral";
            
            if (name && price && tempBase64) {
                const newRef = database.ref('produtos').push();
                newRef.set({ id: newRef.key, name, price, sizes: sizesRaw, img: tempBase64, desc, category }).then(() => {
                    tempBase64 = "";
                    closeModals();
                });
            }
        }

        function listenToProducts() {
            database.ref('produtos').on('value', (snapshot) => {
                const mainContent = document.getElementById('main-content');
                mainContent.innerHTML = "";
                const data = snapshot.val();
                if (data) {
                    const products = Object.values(data);
                    const categories = [...new Set(products.map(p => p.category || "Geral"))];

                    categories.forEach(cat => {
                        const section = document.createElement('div');
                        section.className = 'category-section';
                        section.innerHTML = `<h2 class="category-title">${cat}</h2><div class="carousel-container" id="cat-${cat}"></div>`;
                        mainContent.appendChild(section);

                        const container = document.getElementById(`cat-${cat}`);
                        products.filter(p => (p.category || "Geral") === cat).forEach(p => {
                            const isAdm = auth.currentUser && auth.currentUser.email === ADM_EMAIL;
                            const sizeDisplay = p.sizes ? p.sizes.split(',').map(s => `<span class="size-pill">${s.trim()}</span>`).join('') : '';
                            
                            const card = document.createElement('div');
                            card.className = 'product-card';
                            card.onclick = () => openDetails(p);
                            card.innerHTML = `
                                ${isAdm ? `<button onclick="event.stopPropagation(); deleteProduct('${p.id}')" style="position:absolute; top:20px; right:20px; border:none; background:none; font-size:1.5rem; color:var(--jj-brown); cursor:pointer; z-index:20">&times;</button>` : ''}
                                <div class="img-sculpt-frame"><img src="${p.img}"></div>
                                <div class="size-pills">${sizeDisplay}</div>
                                <h3>${p.name}</h3>
                                <p class="price">${p.price}</p>
                                <button class="card-btn-fix">VER DETALHES</button>
                            `;
                            container.appendChild(card);
                        });
                    });
                }
            });
        }

        function openDetails(p) {
            const body = document.getElementById('details-body');
            const isAdm = auth.currentUser && auth.currentUser.email === ADM_EMAIL;
            
            if (isAdm) {
                body.innerHTML = `
                    <div class="img-sculpt-frame"><img src="${p.img}" id="edit-img-modal"></div>
                    <div>
                        <input type="text" id="e-cat" class="edit-field" value="${p.category}">
                        <input type="text" id="e-name" class="edit-field" value="${p.name}">
                        <input type="text" id="e-price" class="edit-field" value="${p.price}">
                        <textarea id="e-sizes" class="edit-field" placeholder="Ex: P:2, M:5">${p.sizes || ''}</textarea>
                        <input type="file" class="edit-field" accept="image/*" onchange="handleFileSelect(this, 'edit-img-modal')">
                        <textarea id="e-desc" class="edit-field" rows="4">${p.desc}</textarea>
                        <button class="card-btn-fix" onclick="updateProduct('${p.id}')" style="position:static; width:100%">ATUALIZAR</button>
                    </div>
                `;
            } else {
                body.innerHTML = `
                    <div class="img-sculpt-frame"><img src="${p.img}"></div>
                    <div>
                        <h2 style="color:var(--jj-brown); text-transform:uppercase; margin-bottom:10px">${p.name}</h2>
                        <p style="font-size:0.85rem; line-height:1.6; color:#555; margin-bottom:20px">${p.desc}</p>
                        <div style="margin-bottom:20px">
                            <p style="font-weight:700; font-size:0.7rem; margin-bottom:8px">TAMANHOS DISPONÍVEIS:</p>
                            <div class="size-pills">${p.sizes ? p.sizes.split(',').map(s => `<span class="size-pill" style="font-size:0.8rem; padding:8px 12px">${s.trim()}</span>`).join('') : 'Sob consulta'}</div>
                        </div>
                        <p style="font-weight:700; font-size:1.8rem; color:var(--jj-yellow-main); margin-bottom:20px">${p.price}</p>
                        <button class="card-btn-fix" style="position:static; width:100%" onclick="orderWhatsApp('${p.name}')">INTERESSE NO WHATSAPP</button>
                    </div>
                `;
            }
            const modal = document.getElementById('details-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function updateProduct(id) {
            const updates = {
                category: document.getElementById('e-cat').value,
                name: document.getElementById('e-name').value,
                price: document.getElementById('e-price').value,
                sizes: document.getElementById('e-sizes').value,
                desc: document.getElementById('e-desc').value,
                img: tempBase64 || database.ref('produtos/'+id).img
            };
            database.ref('produtos/' + id).update(updates).then(closeModals);
        }

        function orderWhatsApp(productName) {
            window.open(`https://wa.me/5511999999999?text=Olá, vi o item ${productName} no catálogo e gostaria de saber mais.`, '_blank');
        }

        function deleteProduct(id) { if(confirm("Excluir item?")) database.ref('produtos/' + id).remove(); }
        function openAdmin() { document.getElementById('admin-modal').style.display='flex'; setTimeout(()=>document.getElementById('admin-modal').classList.add('active'),10); }
        function closeModals() { document.querySelectorAll('.modal').forEach(m => { m.classList.remove('active'); setTimeout(()=>m.style.display='none',300); }); tempBase64=""; }

        if (window.innerWidth > 768) {
            const dot = document.querySelector('.cursor-dot'), outline = document.querySelector('.cursor-outline');
            window.onmousemove = (e) => { dot.style.left = outline.style.left = e.clientX + 'px'; dot.style.top = outline.style.top = e.clientY + 'px'; };
        }
    </script>
</body>
</html>
