<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Art Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.35);
            --shadow-light: rgba(255, 255, 255, 0.85);
            --font-sans: 'Montserrat', sans-serif;
            --success: #2ecc71;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); overflow-x: hidden; }

        .cursor-dot { width: 8px; height: 8px; background: var(--jj-brown); position: fixed; border-radius: 50%; z-index: 100000; pointer-events: none; transition: transform 0.1s; }
        .cursor-outline { width: 40px; height: 40px; border: 2px solid var(--jj-brown); position: fixed; border-radius: 50%; z-index: 99999; pointer-events: none; transition: transform 0.15s; opacity: 0.3; }

        header { padding: 40px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { height: 60px; filter: drop-shadow(5px 5px 10px var(--shadow-dark)); }

        .cat-nav { padding: 0 5%; overflow-x: auto; white-space: nowrap; margin-bottom: 40px; scrollbar-width: none; }
        .cat-nav::-webkit-scrollbar { display: none; }
        .cat-filter-btn { 
            background: var(--jj-bg); border: none; padding: 12px 25px; margin-right: 15px; border-radius: 30px;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; color: var(--jj-brown); transition: 0.3s;
        }
        .cat-filter-btn.active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); color: var(--jj-yellow-main); }

        .category-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 4px; padding: 0 5%; margin: 50px 0 25px; display: flex; align-items: center; gap: 15px; color: var(--jj-brown); }
        .category-title::after { content: ''; flex: 1; height: 1px; background: rgba(0,0,0,0.05); }

        .carousel-container { display: flex; overflow-x: auto; padding: 20px 5%; gap: 35px; scrollbar-width: none; scroll-snap-type: x mandatory; }
        .carousel-container::-webkit-scrollbar { display: none; }

        .product-card { 
            min-width: 280px; background: var(--jj-bg); padding: 25px; border-radius: 45px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; position: relative; scroll-snap-align: start;
        }
        .product-card:hover { transform: translateY(-10px) scale(1.02); }

        .img-sculpt-frame { 
            width: 100%; aspect-ratio: 1/1; border-radius: 35px; overflow: hidden; margin-bottom: 20px;
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .img-sculpt-frame img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(10px 10px 20px rgba(0,0,0,0.15)); }

        .product-card h3 { font-size: 0.85rem; font-weight: 700; color: var(--jj-brown); margin-bottom: 8px; }
        .card-btn-fix { 
            width: 100%; padding: 15px; border-radius: 20px; border: none; background: var(--jj-yellow-main);
            color: var(--jj-brown); font-weight: 800; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px;
            margin-top: 20px; cursor: pointer; transition: 0.3s;
        }

        .modal { position: fixed; inset: 0; background: rgba(248, 249, 250, 0.95); z-index: 50000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); opacity: 0; transition: 0.4s; }
        .modal.active { opacity: 1; }
        .modal-content { background: var(--jj-bg); width: 95%; max-width: 900px; max-height: 90vh; border-radius: 50px; padding: 40px; position: relative; overflow-y: auto; box-shadow: 30px 30px 60px var(--shadow-dark), -30px -30px 60px var(--shadow-light); }
        .close-btn { position: absolute; top: 30px; right: 30px; font-size: 1.5rem; cursor: pointer; color: var(--jj-brown); font-weight: 900; }

        .details-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 40px; }
        .color-selector { display: flex; gap: 15px; margin: 25px 0; }
        .color-dot-btn { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 3px solid white; box-shadow: 4px 4px 8px var(--shadow-dark); transition: 0.3s; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 800; }
        .color-dot-btn.selected { transform: scale(1.3); border-color: var(--jj-yellow-main); }
        .size-dot-btn { background: white; width: auto; min-width: 40px; padding: 0 10px; border-radius: 12px; }
        .size-selected { background: var(--jj-brown); color: white; }
        .out-of-stock { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }

        .bottom-nav { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.8); backdrop-filter: blur(15px); padding: 10px 30px; border-radius: 40px; display: flex; gap: 40px; box-shadow: 10px 10px 30px var(--shadow-dark); z-index: 40000; }
        .nav-item { font-size: 1.2rem; cursor: pointer; opacity: 0.4; transition: 0.3s; }
        .nav-item.active { opacity: 1; color: var(--jj-yellow-main); }

        #cart-counter { position: absolute; top: -5px; right: -10px; background: var(--jj-brown); color: white; font-size: 0.5rem; width: 15px; height: 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; }

        .edit-field { width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(0,0,0,0.1); padding: 12px 5px; font-family: inherit; font-size: 0.8rem; margin-bottom: 15px; outline: none; }
        .edit-field:focus { border-bottom-color: var(--jj-yellow-main); }
        .variant-box { background: rgba(0,0,0,0.02); padding: 15px; border-radius: 20px; margin: 15px 0; border: 1px dashed #ccc; }

        .user-input { width: 100%; background: white; border-radius: 15px; border: none; padding: 15px; font-family: inherit; margin-bottom: 10px; box-shadow: inset 3px 3px 6px var(--shadow-dark); }
        
        @media (max-width: 768px) {
            .details-grid { grid-template-columns: 1fr; }
            .modal-content { padding: 30px 20px; }
            .cursor-dot, .cursor-outline { display: none; }
        }

        #qr-reader { width: 100% !important; border-radius: 30px; overflow: hidden; border: none !important; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <header>
        <img src="jjvidro.png" class="logo">
        <div id="admin-indicator" style="display:none; font-size:0.55rem; font-weight:800; background:var(--jj-yellow-main); padding:5px 12px; border-radius:20px; letter-spacing:1px">MODO ADMINISTRADOR</div>
    </header>

    <nav class="cat-nav" id="cat-nav-list"></nav>

    <main id="main-content"></main>

    <div class="bottom-nav">
        <div class="nav-item active" id="tab-home" onclick="changeTab('home')">🏠</div>
        <div class="nav-item" id="tab-novo" onclick="changeTab('novo')">➕</div>
        <div class="nav-item" id="tab-caixa" onclick="changeTab('caixa')" style="position:relative">📦 <div id="cart-counter">0</div></div>
        <div class="nav-item" id="tab-dash" onclick="changeTab('dash')">📊</div>
    </div>

    <div id="details-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModals()">✕</span>
            <div class="details-grid" id="details-body"></div>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModals()">✕</span>
            <h2 class="category-title" style="margin:0 0 30px">Gerenciar Peças</h2>
            <div id="qr-reader" style="margin-bottom:30px"></div>
            <button class="card-btn-fix" onclick="startScanner()" style="margin-bottom:30px">ESCANEAR QR CODE</button>
            <div id="new-product-form">
                <input type="text" id="n-cat" class="edit-field" placeholder="Categoria (Ex: Vasos)">
                <input type="text" id="n-name" class="edit-field" placeholder="Nome da Peça">
                <input type="text" id="n-price" class="edit-field" placeholder="Preço (Ex: 149.90)">
                <input type="text" id="n-colors" class="edit-field" placeholder="Cores (Ex: Âmbar, Fumê)">
                <textarea id="n-desc" class="edit-field" placeholder="Descrição da peça..." style="height:80px"></textarea>
                <button class="card-btn-fix" onclick="createNewProduct()">CADASTRAR PEÇA</button>
            </div>
        </div>
    </div>

    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModals()">✕</span>
            <h2 class="category-title" style="margin:0 0 30px">Sua Lista</h2>
            <div id="cart-items-list"></div>
            <div style="margin-top:30px; padding-top:20px; border-top:2px solid var(--jj-yellow-main)">
                <input type="text" id="c-cliente" class="user-input" placeholder="Nome do Cliente">
                <select id="c-pgto" class="user-input">
                    <option value="PIX">Pagamento via PIX</option>
                    <option value="CARTÃO">Cartão de Crédito/Débito</option>
                    <option value="DINHEIRO">Dinheiro</option>
                </select>
                <div style="display:flex; justify-content:space-between; align-items:center; margin:20px 0">
                    <span style="font-weight:800; color:var(--jj-brown)">TOTAL</span>
                    <span id="cart-total-val" style="font-size:1.5rem; font-weight:900">R$ 0,00</span>
                </div>
                <button class="card-btn-fix" onclick="finalizeOrder()">FINALIZAR PEDIDO</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database(), auth = firebase.auth();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";
        let cart = [], currentProduct = null, selectedSizeData = { size: null, max: 0 }, html5QrCode = null;

        auth.onAuthStateChanged(user => {
            if(user?.email === ADM_EMAIL) document.getElementById('admin-indicator').style.display = 'block';
            listenToProducts();
        });

        function listenToProducts() {
            database.ref('produtos').on('value', snap => {
                const data = snap.val();
                const main = document.getElementById('main-content');
                const catNav = document.getElementById('cat-nav-list');
                main.innerHTML = "";
                catNav.innerHTML = `<button class="cat-filter-btn active" onclick="filterCat('all')">Todos</button>`;
                if(data) {
                    const products = Object.values(data);
                    const cats = [...new Set(products.map(p => p.category))];
                    cats.forEach(cat => {
                        catNav.innerHTML += `<button class="cat-filter-btn" onclick="filterCat('${cat}')">${cat}</button>`;
                        const section = document.createElement('div');
                        section.className = `cat-group cat-${cat.replace(/\s+/g, '-')}`;
                        section.innerHTML = `<h2 class="category-title">${cat}</h2><div class="carousel-container" id="cat-container-${cat.replace(/\s+/g, '-')}"></div>`;
                        main.appendChild(section);
                        products.filter(p => p.category === cat).forEach(p => {
                            // PRIORIZA VARIANTES DO DASH
                            const variantKeys = p.variants ? Object.keys(p.variants) : [];
                            const colorList = variantKeys.length > 0 ? variantKeys : (p.colors ? p.colors.split(',').map(c => c.trim()) : []);
                            const firstColor = colorList[0] || "";
                            
                            const img = (p.variants && p.variants[firstColor] && p.variants[firstColor].img) ? p.variants[firstColor].img : "jjvidro2.png";
                            const card = document.createElement('div');
                            card.className = 'product-card';
                            card.onclick = () => openDetails(p);
                            card.innerHTML = `${auth.currentUser?.email === ADM_EMAIL ? `<button onclick="event.stopPropagation(); deleteProduct('${p.id}')" style="position:absolute; top:20px; right:20px; border:none; background:none; font-size:1.5rem; color:var(--jj-brown); z-index:20">&times;</button>` : ''}<div class="img-sculpt-frame"><img src="${img}"></div><h3>${p.name}</h3><div style="font-weight:700">R$ ${p.price}</div><button class="card-btn-fix">VER PEÇA</button>`;
                            document.getElementById(`cat-container-${cat.replace(/\s+/g, '-')}`).appendChild(card);
                        });
                    });
                }
            });
        }

        function openDetails(p) {
            currentProduct = p;
            selectedSizeData = { size: null, max: 0 };
            const body = document.getElementById('details-body');
            
            // PRIORIZA VARIANTES DO DASH
            const variantKeys = p.variants ? Object.keys(p.variants) : [];
            const colors = variantKeys.length > 0 ? variantKeys : (p.colors ? p.colors.split(',').map(c => c.trim()) : []);
            let selectedCol = colors[0] || "";

            if(auth.currentUser?.email === ADM_EMAIL) {
                let variantEditor = colors.map(c => {
                    const v = (p.variants && p.variants[c]) ? p.variants[c] : { img: "", stock: "", hex: "" };
                    return `
                    <div class="variant-box">
                        <div class="color-picker-wrapper">
                            <label style="font-size:0.6rem; font-weight:700">COR: ${c.toUpperCase()}</label>
                            <input type="color" class="admin-color-input v-hex" data-color="${c}" value="${v.hex || getDotColor(null, c)}">
                        </div>
                        <input type="file" onchange="uploadImg('${p.id}', '${c}', this)" style="display:block; margin:10px 0; font-size:0.7rem">
                        <input type="text" class="edit-field v-stock" data-color="${c}" value="${v.stock || ''}" placeholder="Tamanhos (P:5, M:2)">
                    </div>`;
                }).join('');
                
                body.innerHTML = `<div style="grid-column: 1/-1"><div id="qrcode-container" style="text-align:center; margin-bottom:20px"></div><input type="text" id="e-cat" class="edit-field" value="${p.category}"><input type="text" id="e-name" class="edit-field" value="${p.name}"><input type="text" id="e-price" class="edit-field" value="${p.price}"><input type="text" id="e-colors" class="edit-field" value="${p.colors || ''}"><textarea id="e-desc" class="edit-field" style="height:80px">${p.desc || ''}</textarea>${variantEditor}<button class="card-btn-fix" onclick="updateProductAll('${p.id}')">SALVAR TUDO</button></div>`;
                
                setTimeout(() => { new QRCode(document.getElementById("qrcode-container"), { text: p.id, width: 100, height: 100 }); }, 50);
            } else {
                renderUserView(p, selectedCol);
            }
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
        }

        function renderUserView(p, color) {
            const body = document.getElementById('details-body');
            const v = (p.variants && p.variants[color]) ? p.variants[color] : { img: "jjvidro2.png", stock: "" };
            
            const variantKeys = p.variants ? Object.keys(p.variants) : (p.colors ? p.colors.split(',').map(c => c.trim()) : []);
            
            const colorDots = variantKeys.map(c => {
                const cTrim = c.trim();
                return `<div class="color-dot-btn ${cTrim === color ? 'selected' : ''}" style="background:${getDotColor(p, cTrim)}" onclick="renderUserView(currentProduct, '${cTrim}')"></div>`;
            }).join('');
            
            const stockArr = v.stock ? v.stock.split(',').map(s => s.trim()) : [];
            const sizeDots = stockArr.map(s => {
                const [tam, qtd] = s.split(':');
                const isOut = parseInt(qtd) <= 0;
                return `<div class="color-dot-btn size-dot-btn ${isOut ? 'out-of-stock' : ''} ${selectedSizeData.size === tam ? 'size-selected' : ''}" onclick="${isOut ? '' : `selectSize(this, '${tam}', ${qtd})`}">${tam}</div>`;
            }).join('') || `<div class="color-dot-btn size-dot-btn size-selected" onclick="selectSize(this, 'Padrão', 999)">P</div>`;

            body.innerHTML = `<div class="img-sculpt-frame"><img src="${v.img}"></div><div><h2>${p.name}</h2><p style="font-size:0.75rem; margin:15px 0; opacity:0.8">${p.desc || ''}</p><div class="color-selector">${colorDots}</div><div class="color-selector">${sizeDots}</div><input type="number" id="u-qty" class="user-input" value="1" min="1"><div style="font-size:1.5rem; font-weight:800; margin-bottom:15px">R$ ${p.price}</div><button class="card-btn-fix" onclick="addToCart('${p.name}', '${p.price}', '${color}')">ADICIONAR</button></div>`;
        }

        function getDotColor(p, color) {
            const v = (p && p.variants && p.variants[color]) ? p.variants[color] : null;
            if(v && v.hex) return v.hex;
            const map = { 'âmbar': '#FFBF00', 'fumê': '#545454', 'transparente': '#e2e2e2', 'azul': '#0074D9', 'verde': '#2ECC40' };
            return map[color.toLowerCase()] || '#ccc';
        }

        function updateProductAll(id) {
            const updates = {
                category: document.getElementById('e-cat').value,
                name: document.getElementById('e-name').value,
                price: document.getElementById('e-price').value,
                colors: document.getElementById('e-colors').value,
                desc: document.getElementById('e-desc').value,
                variants: currentProduct.variants || {}
            };
            document.querySelectorAll('.v-hex').forEach(input => {
                const c = input.dataset.color;
                if(!updates.variants[c]) updates.variants[c] = {};
                updates.variants[c].hex = input.value;
            });
            document.querySelectorAll('.v-stock').forEach(input => {
                const c = input.dataset.color;
                if(!updates.variants[c]) updates.variants[c] = {};
                updates.variants[c].stock = input.value;
            });
            database.ref('produtos/'+id).update(updates).then(() => closeModals());
        }

        function createNewProduct() {
            const id = 'JJ' + Date.now();
            const colorsStr = document.getElementById('n-colors').value;
            const vars = {};
            colorsStr.split(',').forEach(c => { if(c.trim()) vars[c.trim()] = { stock: "P:10", hex: "#ccc", img: "jjvidro2.png" } });
            
            const p = {
                id,
                category: document.getElementById('n-cat').value,
                name: document.getElementById('n-name').value,
                price: document.getElementById('n-price').value,
                colors: colorsStr,
                desc: document.getElementById('n-desc').value,
                variants: vars
            };
            database.ref('produtos/'+id).set(p).then(() => closeModals());
        }

        function uploadImg(id, color, input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                database.ref(`produtos/${id}/variants/${color}/img`).set(e.target.result);
                currentProduct.variants[color].img = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function addToCart(name, price, color) {
            const qty = parseInt(document.getElementById('u-qty').value);
            const size = selectedSizeData.size || 'P';
            cart.push({ name, price, color, size, qty });
            updateCartUI();
            closeModals();
        }

        function updateCartUI() {
            document.getElementById('cart-counter').innerText = cart.length;
            const list = document.getElementById('cart-items-list');
            let total = 0;
            list.innerHTML = cart.map((item, i) => {
                total += parseFloat(item.price) * item.qty;
                return `<div class="cart-item"><div><b>${item.name}</b><br><small>${item.color} - ${item.size} (x${item.qty})</small></div><span>R$ ${(item.price * item.qty).toFixed(2)}</span><button onclick="cart.splice(${i},1);updateCartUI()" style="border:none;background:none;color:var(--jj-brown)">✕</button></div>`;
            }).join('');
            document.getElementById('cart-total-val').innerText = `R$ ${total.toFixed(2)}`;
        }

        function finalizeOrder() {
            const token = Math.random().toString(36).substr(2, 6).toUpperCase();
            const order = {
                token,
                cliente: document.getElementById('c-cliente').value || 'Cliente',
                pagamento: document.getElementById('c-pgto').value,
                total: document.getElementById('cart-total-val').innerText.replace('R$ ', ''),
                status: 'orcamento',
                timestamp: Date.now(),
                itens_resumo: cart.map(i => `${i.qty}x ${i.name} (${i.color}/${i.size})`).join('\n')
            };
            database.ref('pedidos/'+token).set(order).then(() => {
                alert("Pedido Enviado! Token: #" + token);
                cart = [];
                updateCartUI();
                closeModals();
            });
        }

        function selectSize(el, tam, max) {
            document.querySelectorAll('.size-dot-btn').forEach(b => b.classList.remove('size-selected'));
            el.classList.add('size-selected');
            selectedSizeData = { size: tam, max: max };
        }

        function changeTab(t) {
            if(t === 'novo') { if(auth.currentUser?.email === ADM_EMAIL) openAdmin(); else auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
            else if(t === 'caixa') { document.getElementById('cart-modal').style.display='flex'; setTimeout(()=>document.getElementById('cart-modal').classList.add('active'), 10); }
            else if(t === 'dash') window.location.href = 'dash.html';
            
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('tab-'+t).classList.add('active');
        }

        function filterCat(c) {
            document.querySelectorAll('.cat-filter-btn').forEach(b => b.classList.remove('active'));
            if(event) event.target.classList.add('active');
            document.querySelectorAll('.cat-group').forEach(g => g.style.display = (c==='all' || g.classList.contains('cat-'+c.replace(/\s+/g, '-'))) ? 'block' : 'none');
        }

        function closeModals() { stopScanner(); document.querySelectorAll('.modal').forEach(m => { m.classList.remove('active'); setTimeout(()=>m.style.display='none', 400); }); }
        function deleteProduct(id) { if(confirm("Remover este item?")) database.ref('produtos/'+id).remove(); }
        function openAdmin() { document.getElementById('admin-modal').style.display='flex'; setTimeout(()=>document.getElementById('admin-modal').classList.add('active'), 10); }

        function startScanner() {
            html5QrCode = new Html5Qrcode("qr-reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => {
                stopScanner();
                database.ref('produtos/'+txt).once('value', snap => { if(snap.val()) openDetails(snap.val()); });
            });
        }
        function stopScanner() { if(html5QrCode) html5QrCode.stop(); }

        if(window.innerWidth > 768) {
            const dot = document.querySelector('.cursor-dot'), out = document.querySelector('.cursor-outline');
            window.onmousemove = (e) => { dot.style.left = e.clientX+'px'; dot.style.top = e.clientY+'px'; out.style.left = (e.clientX-16)+'px'; out.style.top = (e.clientY-16)+'px'; };
        }
    </script>
</body>
</html>
