<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | PDV CAIXA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --jj-yellow: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.5);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        body { 
            background: var(--jj-bg);
            font-family: var(--font-sans); 
            color: var(--jj-text); 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--jj-bg);
            box-shadow: 5px 5px 15px var(--shadow-dark);
            z-index: 10;
        }

        .pos-container { 
            display: grid; 
            grid-template-columns: 1fr 420px; 
            gap: 25px; 
            padding: 25px; 
            flex: 1; 
            overflow: hidden; 
        }

        .products-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden;
        }

        #search-pos {
            background: var(--jj-bg);
            border: none;
            padding: 18px 25px;
            border-radius: 20px;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
            font-size: 1rem;
            font-family: var(--font-sans);
            font-weight: 500;
        }

        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; 
            overflow-y: auto;
            padding: 10px;
        }

        .pos-item-card {
            background: var(--jj-bg);
            border-radius: 25px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            transition: 0.2s ease;
        }
        .pos-item-card:active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            transform: scale(0.98);
        }
        .pos-item-card h4 { font-size: 0.75rem; color: var(--jj-brown); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .pos-item-card span { font-weight: 800; font-size: 1.1rem; }

        .checkout-sidebar { 
            background: var(--jj-bg); 
            border-radius: 35px; 
            padding: 30px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .cart-list { flex: 1; overflow-y: auto; margin: 20px 0; padding-right: 5px; }
        .cart-item {
            padding: 15px;
            background: var(--jj-bg);
            border-radius: 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
        }

        .total-box {
            background: var(--jj-yellow);
            padding: 25px;
            border-radius: 25px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 6px 6px 12px rgba(0,0,0,0.1);
        }

        .input-caixa {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: none;
            background: var(--jj-bg);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            margin-bottom: 12px;
            font-family: var(--font-sans);
            font-weight: 600;
        }

        .btn-finish {
            width: 100%; padding: 20px; border-radius: 20px; border: none;
            background: var(--jj-brown); color: white; font-weight: 800; 
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
            letter-spacing: 1px;
        }
        .btn-finish:hover { filter: brightness(1.1); transform: translateY(-2px); }

        #variant-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center;
            backdrop-filter: blur(10px);
        }
        .variant-content { 
            background: var(--jj-bg); padding: 40px; border-radius: 35px; width: 450px; 
            text-align: center; box-shadow: 20px 20px 60px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.6);
            max-height: 90vh; overflow-y: auto;
        }
        
        .variant-option {
            padding: 12px 8px; border-radius: 15px; margin: 5px;
            cursor: pointer; display: inline-block; font-size: 0.75rem; font-weight: 700;
            background: var(--jj-bg);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            min-width: 90px;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .variant-option.selected-active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light) !important;
            border: 2px solid var(--jj-yellow) !important;
            background: #fff !important;
        }

        .qty-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 15px 0 20px 0;
        }
        .qty-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--jj-bg);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--jj-brown);
            cursor: pointer;
        }
        #modal-qty-display { font-size: 1.3rem; font-weight: 800; min-width: 30px; }

        .out-of-stock { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--jj-yellow); border-radius: 10px; }

        /* Estilo do botão do Scanner */
        #scan-btn-floating {
            position: fixed;
            bottom: 30px;
            right: 465px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: var(--jj-bg);
            z-index: 100;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <header>
        <img src="jjvidro.png" style="height: 40px;">
        <h2 style="font-size: 0.8rem; letter-spacing: 2px; color: var(--jj-brown); font-weight: 700;">TERMINAL DE VENDAS</h2>
        <button onclick="window.location.href='dash.html'" style="background:var(--jj-bg); border: none; box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); padding: 10px 25px; border-radius: 50px; cursor: pointer; font-weight: 700; color: var(--jj-brown); font-size: 0.7rem; text-transform: uppercase;">Painel</button>
    </header>

    <div class="pos-container">
        <div class="products-section">
            <input type="text" id="search-pos" placeholder="Procurar item..." oninput="filterPOS()">
            <div class="products-grid" id="pos-grid"></div>
        </div>

        <div class="checkout-sidebar">
            <h3 style="font-size: 0.8rem; margin-bottom: 25px; border-left: 5px solid var(--jj-yellow); padding-left: 15px; color: var(--jj-brown); font-weight: 700;">ITENS NO CARRINHO</h3>
            <div class="cart-list" id="pos-cart-list"></div>
            
            <div class="finalizacao">
                <input type="text" id="c-cliente" class="input-caixa" placeholder="Nome do Cliente">
                <select id="c-pagamento" class="input-caixa">
                    <option value="PIX">PIX</option>
                    <option value="DINHEIRO">DINHEIRO</option>
                    <option value="CARTÃO DÉBITO">CARTÃO DÉBITO</option>
                    <option value="CARTÃO CRÉDITO">CARTÃO CRÉDITO</option>
                </select>
                <div class="total-box">
                    <p style="font-size: 0.65rem; font-weight: 700; margin-bottom: 5px; color: var(--jj-brown); opacity: 0.7;">VALOR TOTAL</p>
                    <h2 id="pos-total-display" style="font-size: 2.2rem; font-weight: 800; color: var(--jj-brown);">R$ 0,00</h2>
                </div>
                <button class="btn-finish" onclick="finishPOSOrder()">Finalizar Venda</button>
            </div>
        </div>
    </div>

    <button id="scan-btn-floating" onclick="openScanner()">📷</button>

    <div id="variant-modal">
        <div class="variant-content">
            <div id="reader-container" style="display:none; margin-bottom: 20px;">
                <h3 style="font-size:0.7rem; margin-bottom:10px; color:var(--jj-brown)">ESCANEANDO ETIQUETA...</h3>
                <div id="reader" style="border-radius: 20px; overflow: hidden; box-shadow: inset 4px 4px 8px var(--shadow-dark);"></div>
            </div>

            <h2 id="modal-product-name" style="color: var(--jj-brown); font-size: 1.1rem; margin-bottom: 5px;"></h2>
            
            <p id="label-cor" style="font-size: 0.7rem; margin: 10px 0 5px; font-weight: 700; opacity: 0.6; text-transform: uppercase;">1. Escolha a Cor</p>
            <div id="color-options" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-bottom: 10px;"></div>
            
            <p id="label-tamanho" style="font-size: 0.7rem; margin: 10px 0 5px; font-weight: 700; opacity: 0.6; text-transform: uppercase; display: none;">2. Escolha o Tamanho</p>
            <div id="size-options" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-bottom: 10px;"></div>

            <div id="qty-area" style="display: none;">
                <p style="font-size: 0.7rem; margin: 10px 0 5px; font-weight: 700; opacity: 0.6; text-transform: uppercase;">3. Quantidade</p>
                <div class="qty-selector">
                    <button class="qty-btn" onclick="changeModalQty(-1)">-</button>
                    <span id="modal-qty-display">1</span>
                    <button class="qty-btn" onclick="changeModalQty(1)">+</button>
                </div>
                <button class="btn-finish" onclick="confirmVariantAddition()">Adicionar ao Pedido</button>
            </div>

            <p onclick="closeVariantModal()" style="margin-top:20px; cursor:pointer; font-size: 0.7rem; font-weight: 700; color: #999; text-transform: uppercase;">Cancelar</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let localCart = [];
        let allProducts = {};
        let selectedProductForModal = null;
        let selectedColor = null;
        let selectedSize = null;
        let currentAvailableStock = 0;
        let modalQty = 1;
        let html5QrCode = null;

        database.ref('produtos').on('value', snap => {
            allProducts = snap.val() || {};
            renderPOSGrid(Object.values(allProducts));
        });

        function cleanKey(key) { return key ? key.replace(/[\.\#\$\[\]]/g, "").trim() : "default"; }

        // Lógica do Scanner
        function openScanner() {
            document.getElementById('variant-modal').style.display = 'flex';
            document.getElementById('reader-container').style.display = 'block';
            document.getElementById('modal-product-name').innerText = "";
            document.getElementById('color-options').innerHTML = "";
            document.getElementById('size-options').innerHTML = "";
            document.getElementById('qty-area').style.display = 'none';

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (txt) => {
                stopScanner();
                let p = null;
                for(let k in allProducts) { 
                    if(k === txt || allProducts[k].barcode === txt) { 
                        p = allProducts[k]; 
                        break; 
                    } 
                }
                if(p) {
                    document.getElementById('reader-container').style.display = 'none';
                    openVariantModal(p.id);
                } else {
                    alert("Produto não encontrado.");
                    closeVariantModal();
                }
            });
        }

        function stopScanner() {
            if(html5QrCode) {
                html5QrCode.stop().then(() => { html5QrCode = null; });
            }
        }

        function renderPOSGrid(list) {
            document.getElementById('pos-grid').innerHTML = list.map(p => `
                <div class="pos-item-card" onclick="openVariantModal('${p.id}')">
                    <h4>${p.name}</h4>
                    <span>R$ ${parseFloat(p.price || 0).toFixed(2)}</span>
                </div>
            `).join('');
        }

        function filterPOS() {
            const term = document.getElementById('search-pos').value.toLowerCase();
            const filtered = Object.values(allProducts).filter(p => p.name.toLowerCase().includes(term));
            renderPOSGrid(filtered);
        }

        function openVariantModal(id) {
            selectedProductForModal = allProducts[id];
            selectedColor = null;
            selectedSize = null;
            modalQty = 1;
            
            document.getElementById('reader-container').style.display = 'none';
            document.getElementById('modal-product-name').innerText = selectedProductForModal.name;
            document.getElementById('label-tamanho').style.display = 'none';
            document.getElementById('size-options').innerHTML = '';
            document.getElementById('qty-area').style.display = 'none';
            
            const colorContainer = document.getElementById('color-options');
            colorContainer.innerHTML = '';

            const colors = selectedProductForModal.colors ? selectedProductForModal.colors.split(',') : [];
            colors.forEach(c => {
                const cTrim = c.trim();
                const btn = document.createElement('div');
                btn.className = 'variant-option';
                btn.innerText = cTrim;
                btn.onclick = () => selectColor(cTrim, btn);
                colorContainer.appendChild(btn);
            });

            document.getElementById('variant-modal').style.display = 'flex';
        }

        function selectColor(color, element) {
            selectedColor = color;
            selectedSize = null;
            document.getElementById('qty-area').style.display = 'none';
            
            document.querySelectorAll('#color-options .variant-option').forEach(b => b.classList.remove('selected-active'));
            element.classList.add('selected-active');

            const sizeContainer = document.getElementById('size-options');
            sizeContainer.innerHTML = '';
            document.getElementById('label-tamanho').style.display = 'block';

            const safeC = cleanKey(color);
            const vars = selectedProductForModal.variants || selectedProductForModal.variantes || {};
            const v = vars[safeC] || { stock: "" };
            
            const stockArr = v.stock ? v.stock.split(',').map(s => s.trim()) : [];
            
            if (stockArr.length > 0) {
                stockArr.forEach(s => {
                    const parts = s.split(':');
                    const tam = parts[0];
                    const qtd = parseInt(parts[1] || 0);
                    
                    const btn = document.createElement('div');
                    btn.className = `variant-option ${qtd <= 0 ? 'out-of-stock' : ''}`;
                    btn.innerHTML = `${tam}<br><small>Qtd: ${qtd}</small>`;
                    btn.onclick = () => selectSize(tam, qtd, btn);
                    sizeContainer.appendChild(btn);
                });
            } else {
                const btn = document.createElement('div');
                btn.className = 'variant-option';
                btn.innerText = 'Padrão';
                btn.onclick = () => selectSize('Padrão', 999, btn);
                sizeContainer.appendChild(btn);
            }
        }

        function selectSize(size, stock, element) {
            selectedSize = size;
            currentAvailableStock = stock;
            modalQty = 1;
            document.getElementById('modal-qty-display').innerText = modalQty;
            
            document.querySelectorAll('#size-options .variant-option').forEach(b => b.classList.remove('selected-active'));
            element.classList.add('selected-active');
            
            document.getElementById('qty-area').style.display = 'block';
        }

        function changeModalQty(val) {
            const newVal = modalQty + val;
            if(newVal >= 1 && newVal <= currentAvailableStock) {
                modalQty = newVal;
                document.getElementById('modal-qty-display').innerText = modalQty;
            }
        }

        function closeVariantModal() { 
            stopScanner();
            document.getElementById('variant-modal').style.display = 'none'; 
            document.getElementById('reader-container').style.display = 'none';
        }

        function confirmVariantAddition() {
            for(let i = 0; i < modalQty; i++) {
                localCart.push({ 
                    id: selectedProductForModal.id, 
                    name: selectedProductForModal.name, 
                    price: parseFloat(selectedProductForModal.price || 0), 
                    variant: `${selectedColor} (${selectedSize})`,
                    color: selectedColor,
                    size: selectedSize
                });
            }
            updatePOSCartUI();
            closeVariantModal();
        }

        function updatePOSCartUI() {
            const list = document.getElementById('pos-cart-list');
            let total = 0;
            const grouped = localCart.reduce((acc, item) => {
                const key = `${item.id}-${item.variant}`;
                if(!acc[key]) acc[key] = {...item, qty: 0};
                acc[key].qty++;
                return acc;
            }, {});

            list.innerHTML = Object.values(grouped).map(item => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                return `
                    <div class="cart-item">
                        <div>
                            <p style="font-size: 0.85rem; font-weight: 700; color: var(--jj-brown);">${item.name}</p>
                            <p style="font-size: 0.65rem; font-weight: 600; opacity: 0.6;">${item.qty}x ${item.variant}</p>
                        </div>
                        <div style="display:flex; align-items:center; gap:12px">
                            <b style="font-size: 0.9rem;">R$ ${itemTotal.toFixed(2)}</b>
                            <span onclick="removeFromCart('${item.id}', '${item.variant}')" style="cursor:pointer; color:#ff4444; font-weight:800; font-size:1.1rem">✕</span>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('pos-total-display').innerText = `R$ ${total.toFixed(2)}`;
        }

        function removeFromCart(id, variant) {
            localCart = localCart.filter(item => !(item.id === id && item.variant === variant));
            updatePOSCartUI();
        }

        async function finishPOSOrder() {
            if(localCart.length === 0) return alert("Carrinho vazio!");
            const token = "CAIXA-" + Math.floor(1000 + Math.random()*9000);
            
            try {
                for (const item of localCart) {
                    const safeC = cleanKey(item.color);
                    const snap = await database.ref(`produtos/${item.id}/variants/${safeC}/stock`).once('value');
                    let stockStr = snap.val();
                    if(stockStr && typeof stockStr === 'string') {
                        let parts = stockStr.split(',').map(s => s.trim());
                        let updatedParts = parts.map(p => {
                            let subParts = p.split(':');
                            if(subParts[0] === item.size) {
                                return `${subParts[0]}:${Math.max(0, parseInt(subParts[1]) - 1)}`;
                            }
                            return p;
                        });
                        await database.ref(`produtos/${item.id}/variants/${safeC}/stock`).set(updatedParts.join(', '));
                    }
                }

                const order = {
                    token,
                    cliente: document.getElementById('c-cliente').value || "Cliente Balcão",
                    total: localCart.reduce((a,b)=>a+b.price, 0).toFixed(2),
                    pagamento: document.getElementById('c-pagamento').value,
                    itens_resumo: localCart.map(i => `${i.name} (${i.variant})`).join(', '),
                    data: new Date().toLocaleString(),
                    status: "Concluído",
                    origem: "Caixa Físico"
                };
                await database.ref('pedidos/' + token).set(order);
                alert("VENDA FINALIZADA!");
                localCart = []; updatePOSCartUI();
                document.getElementById('c-cliente').value = "";
            } catch(e) { 
                console.error(e);
                alert("Erro ao processar venda."); 
            }
        }
    </script>
</body>
</html>
