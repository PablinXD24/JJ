<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Art Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow-light: #FFF4AC;
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); overflow-x: hidden; cursor: none; }

        /* Cursor */
        .cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--jj-yellow-main); border-radius: 50%; z-index: 10000; pointer-events: none; }
        .cursor-outline { position: fixed; width: 40px; height: 40px; border: 2px solid var(--jj-yellow-main); border-radius: 50%; z-index: 9999; pointer-events: none; transition: 0.1s; }

        /* Navbar */
        .main-nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background: rgba(248, 249, 250, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .logo-img { height: 55px; width: auto; object-fit: contain; }

        .content-wrapper { padding: 20px 0 60px 0; min-height: 80vh; }
        .category-title { margin-left: 5%; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; color: var(--jj-brown); }
        .carousel-container { display: flex; gap: 30px; overflow-x: auto; padding: 20px 5% 40px 5%; scrollbar-width: none; }
        .carousel-container::-webkit-scrollbar { display: none; }

        /* Card */
        .product-card {
            flex: 0 0 300px; background: var(--jj-bg); padding: 25px; padding-bottom: 85px; border-radius: 45px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            transition: 0.4s; cursor: pointer; position: relative; min-height: 540px;
        }
        
        .img-sculpt-frame {
            background: var(--jj-bg); height: 260px; border-radius: 35px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
            position: relative; overflow: hidden; margin-bottom: 20px;
        }
        .glass-inner-border { position: absolute; inset: 15px; border-radius: 25px; border: 1px solid rgba(255, 200, 0, 0.2); background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(4px); z-index: 1; }
        .img-sculpt-frame img { max-width: 85%; max-height: 85%; object-fit: contain; z-index: 2; position: relative; }

        .size-pills { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .size-pill { font-size: 0.6rem; padding: 5px 10px; border-radius: 10px; background: var(--jj-bg); color: var(--jj-brown); font-weight: 700; box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light); }

        .product-card h3 { font-weight: 700; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 5px; color: var(--jj-brown); }
        .product-card .price { font-weight: 700; color: var(--jj-yellow-main); font-size: 1.1rem; }

        .card-btn-fix {
            position: absolute; bottom: 25px; left: 25px; right: 25px;
            background: var(--jj-yellow-main); color: #1a1a1a; border: none; padding: 15px; border-radius: 20px;
            font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: 0.3s;
            box-shadow: 5px 5px 15px rgba(255, 200, 0, 0.3); font-family: var(--font-sans); text-transform: uppercase;
        }

        .jj-btn-ghost { background: var(--jj-bg); border: none; padding: 10px 20px; border-radius: 15px; box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light); font-weight: 700; font-size: 0.65rem; cursor: pointer; color: var(--jj-brown); }
        .edit-field { width: 100%; background: var(--jj-bg); border: none; padding: 15px; border-radius: 18px; box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); margin-bottom: 15px; font-family: var(--font-sans); outline: none; font-size: 0.85rem; }

        /* Modals */
        .modal { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(12px); }
        .modal-content { 
            background: var(--jj-bg); width: 100%; max-width: 850px; max-height: 90vh; border-radius: 50px; 
            position: relative; z-index: 2100; padding: 45px; overflow-y: auto; 
            box-shadow: 25px 25px 50px rgba(0,0,0,0.2); transition: 0.4s; transform: translateY(40px); opacity: 0;
        }
        .modal.active .modal-content { transform: translateY(0); opacity: 1; }

        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .close-btn { position: absolute; top: 25px; right: 25px; background: none; border: none; font-size: 2.2rem; cursor: pointer; color: var(--jj-brown); z-index: 2200; }

        #admin-btn { display: none; position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; border-radius: 50%; z-index: 1500; font-size: 32px; border: none; color: #1a1a1a; background: var(--jj-yellow-main); cursor: pointer; box-shadow: 10px 10px 25px rgba(0,0,0,0.15); }

        /* Footer Novo */
        .main-footer {
            position: relative;
            width: 100%;
            min-height: 250px;
            background-image: url('URL_DA_SUA_IMAGEM_AQUI'); /* Substitua aqui */
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 5%;
            margin-top: 50px;
        }

        .footer-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65); /* Escurece a imagem para o texto aparecer */
            backdrop-filter: blur(3px); /* Leve desfoque opcional */
        }

        .footer-content {
            position: relative;
            z-index: 2;
            color: white;
        }

        .footer-content h2 { font-size: 1.5rem; margin-bottom: 15px; letter-spacing: 3px; font-weight: 700; }
        .footer-content p { font-size: 0.8rem; opacity: 0.8; line-height: 1.8; max-width: 500px; margin: 0 auto; }
        .footer-copy { margin-top: 30px; font-size: 0.65rem; opacity: 0.5; text-transform: uppercase; }

        @media (max-width: 768px) {
            .modal { align-items: flex-end; padding: 0; }
            .modal-content { max-height: 85vh; border-radius: 40px 40px 0 0; padding: 50px 25px 30px 25px; transform: translateY(100%); }
            .modal.active .modal-content { transform: translateY(0); }
            .modal-grid { grid-template-columns: 1fr; gap: 20px; }
            .product-card { flex: 0 0 280px; }
            .cursor-dot, .cursor-outline { display: none; }
            body { cursor: auto; }
            .main-footer { min-height: 300px; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="main-nav">
        <img src="jjvidro.png" alt="J&J Logo" class="logo-img">
        <div id="auth-ui"><button class="jj-btn-ghost" onclick="loginGoogle()">ENTRAR</button></div>
    </nav>

    <main class="content-wrapper" id="main-content"></main>

    <footer class="main-footer">
        <div class="footer-overlay"></div>
        <div class="footer-content">
            <img src="jjvidro2.png" alt="J&J Logo" style="height: 40px; margin-bottom: 20px; filter: brightness(0) invert(1);">
            <h2>J&J ART COLLECTION</h2>
            <p>Curadoria exclusiva de peças atemporais e design moderno. Transformando o comum em extraordinário.</p>
            <div class="footer-copy">© 2026 J&J Art - Todos os direitos reservados.</div>
        </div>
    </footer>

    <div id="details-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <div id="details-body" class="modal-grid"></div>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content" style="max-width: 500px;">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <h2 style="color:var(--jj-brown); margin-bottom:25px; font-size:1.1rem;">CADASTRAR ITEM</h2>
            <input type="text" id="p-category" class="edit-field" placeholder="Categoria">
            <input type="text" id="p-name" class="edit-field" placeholder="Nome">
            <input type="text" id="p-price" class="edit-field" placeholder="Preço">
            <textarea id="p-sizes" class="edit-field" placeholder="Tamanhos (Ex: P:2, M:5)"></textarea>
            <input type="file" id="p-file" class="edit-field" accept="image/*" onchange="handleFileSelect(this, 'p-img-preview')">
            <img id="p-img-preview" style="width:70px; display:none; border-radius:15px; margin-bottom:15px;">
            <textarea id="p-desc" class="edit-field" placeholder="Descrição..." rows="3"></textarea>
            <button class="card-btn-fix" onclick="saveToRTDB()" style="position:static; width:100%">SALVAR NO CATÁLOGO</button>
        </div>
    </div>

    <button id="admin-btn" onclick="openAdmin()">+</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        const provider = new firebase.auth.GoogleAuthProvider();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";
        let tempBase64 = "";

        function loginGoogle() { auth.signInWithPopup(provider); }
        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            const authUI = document.getElementById('auth-ui');
            const adminBtn = document.getElementById('admin-btn');
            if (user) {
                authUI.innerHTML = `<span style="font-size:0.7rem; font-weight:700; color:var(--jj-brown)">${user.displayName}</span><button class="jj-btn-ghost" onclick="logout()" style="margin-left:15px">SAIR</button>`;
                if (user.email === ADM_EMAIL) adminBtn.style.display = 'block';
            } else {
                authUI.innerHTML = `<button class="jj-btn-ghost" onclick="loginGoogle()">ENTRAR</button>`;
                adminBtn.style.display = 'none';
            }
            listenToProducts();
        });

        function handleFileSelect(input, previewId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    tempBase64 = e.target.result;
                    const prev = document.getElementById(previewId);
                    prev.src = tempBase64;
                    prev.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function saveToRTDB() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const sizes = document.getElementById('p-sizes').value;
            const desc = document.getElementById('p-desc').value;
            const category = document.getElementById('p-category').value || "Geral";
            if (name && price && tempBase64) {
                const newRef = database.ref('produtos').push();
                newRef.set({ id: newRef.key, name, price, sizes, img: tempBase64, desc, category }).then(closeModals);
            }
        }

        function listenToProducts() {
            database.ref('produtos').on('value', (snapshot) => {
                const mainContent = document.getElementById('main-content');
                mainContent.innerHTML = "";
                const data = snapshot.val();
                if (data) {
                    const products = Object.values(data);
                    const categories = [...new Set(products.map(p => p.category || "Geral"))];
                    categories.forEach(cat => {
                        const section = document.createElement('div');
                        section.className = 'category-section';
                        section.innerHTML = `<h2 class="category-title">${cat}</h2><div class="carousel-container" id="cat-${cat}"></div>`;
                        mainContent.appendChild(section);
                        const container = document.getElementById(`cat-${cat}`);
                        products.filter(p => (p.category || "Geral") === cat).forEach(p => {
                            const sizeHtml = p.sizes ? p.sizes.split(',').map(s => `<span class="size-pill">${s.trim()}</span>`).join('') : '';
                            const card = document.createElement('div');
                            card.className = 'product-card';
                            card.onclick = () => openDetails(p);
                            card.innerHTML = `
                                ${auth.currentUser?.email === ADM_EMAIL ? `<button onclick="event.stopPropagation(); deleteProduct('${p.id}')" style="position:absolute; top:20px; right:20px; border:none; background:none; font-size:1.5rem; color:var(--jj-brown); cursor:pointer; z-index:20">&times;</button>` : ''}
                                <div class="img-sculpt-frame"><div class="glass-inner-border"></div><img src="${p.img}"></div>
                                <div class="size-pills">${sizeHtml}</div>
                                <h3>${p.name}</h3>
                                <p class="price">${p.price}</p>
                                <button class="card-btn-fix">DETALHES</button>
                            `;
                            container.appendChild(card);
                        });
                    });
                    if (window.innerWidth > 768) VanillaTilt.init(document.querySelectorAll(".product-card"), { max: 5, speed: 400 });
                }
            });
        }

        function openDetails(p) {
            const body = document.getElementById('details-body');
            const isAdm = auth.currentUser?.email === ADM_EMAIL;
            if (isAdm) {
                body.innerHTML = `
                    <div class="img-sculpt-frame"><img src="${p.img}" id="edit-img-modal"></div>
                    <div>
                        <input type="text" id="e-cat" class="edit-field" value="${p.category || ''}" placeholder="Categoria">
                        <input type="text" id="e-name" class="edit-field" value="${p.name || ''}" placeholder="Nome">
                        <input type="text" id="e-price" class="edit-field" value="${p.price || ''}" placeholder="Preço">
                        <textarea id="e-sizes" class="edit-field" placeholder="Tamanhos">${p.sizes || ''}</textarea>
                        <input type="file" class="edit-field" accept="image/*" onchange="handleFileSelect(this, 'edit-img-modal')">
                        <textarea id="e-desc" class="edit-field" rows="4" placeholder="Descrição">${p.desc || ''}</textarea>
                        <button class="card-btn-fix" onclick="updateProduct('${p.id}', '${p.img}')" style="position:static; width:100%">SALVAR ALTERAÇÕES</button>
                    </div>
                `;
            } else {
                const sizesInfo = p.sizes ? p.sizes.split(',').map(s => `<span class="size-pill" style="font-size:0.8rem; padding:10px 15px">${s.trim()}</span>`).join('') : 'Sob consulta';
                body.innerHTML = `
                    <div class="img-sculpt-frame"><div class="glass-inner-border"></div><img src="${p.img}"></div>
                    <div>
                        <h2 style="color:var(--jj-brown); text-transform:uppercase; margin-bottom:15px; font-size:1.2rem;">${p.name}</h2>
                        <p style="font-size:0.9rem; line-height:1.7; color:#444; margin-bottom:20px">${p.desc}</p>
                        <div style="margin-bottom:25px"><p style="font-weight:700; font-size:0.7rem; color:var(--jj-brown); margin-bottom:12px;">TAMANHOS:</p><div class="size-pills">${sizesInfo}</div></div>
                        <p style="font-weight:700; font-size:1.8rem; color:var(--jj-yellow-main); margin-bottom:20px">${p.price}</p>
                        <button class="card-btn-fix" style="position:static; width:100%" onclick="orderWhatsApp('${p.name}')">WHATSAPP</button>
                    </div>
                `;
            }
            const modal = document.getElementById('details-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function updateProduct(id, currentImg) {
            const updates = {
                category: document.getElementById('e-cat').value,
                name: document.getElementById('e-name').value,
                price: document.getElementById('e-price').value,
                sizes: document.getElementById('e-sizes').value,
                desc: document.getElementById('e-desc').value,
                img: tempBase64 || currentImg
            };
            database.ref('produtos/' + id).update(updates)
                .then(() => { tempBase64 = ""; closeModals(); })
                .catch(err => alert("Erro ao salvar: " + err));
        }

        function orderWhatsApp(n) { window.open(`https://wa.me/5511999999999?text=Interesse: ${n}`, '_blank'); }
        function deleteProduct(id) { if(confirm("Excluir?")) database.ref('produtos/' + id).remove(); }
        function openAdmin() { document.getElementById('admin-modal').style.display='flex'; setTimeout(()=>document.getElementById('admin-modal').classList.add('active'),10); }
        function closeModals() { document.querySelectorAll('.modal').forEach(m => { m.classList.remove('active'); setTimeout(()=>m.style.display='none',400); }); tempBase64=""; }

        if (window.innerWidth > 768) {
            const dot = document.querySelector('.cursor-dot'), outline = document.querySelector('.cursor-outline');
            window.onmousemove = (e) => { dot.style.left = outline.style.left = e.clientX + 'px'; dot.style.top = outline.style.top = e.clientY + 'px'; };
        }
    </script>
</body>
</html>
