<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Art Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            /* Paleta baseada na imagem enviada */
            --jj-gold: #FFC800;
            --jj-cream: #FFF4AC;
            --jj-olive: #7C8F65;
            --jj-brown: #834A29;
            --jj-dark-olive: #606C38;
            
            --jj-bg: #f8f9fa; /* Fundo principal quase branco para leveza */
            --jj-text: #2d3436;
            --shadow-dark: rgba(124, 143, 101, 0.2); /* Sombra suave em oliva */
            --shadow-light: rgba(255, 255, 255, 1);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); overflow-x: hidden; cursor: none; }

        /* Cursor Customizado em Amarelo */
        .cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--jj-gold); border-radius: 50%; z-index: 10000; pointer-events: none; }
        .cursor-outline { position: fixed; width: 40px; height: 40px; border: 2px solid var(--jj-gold); border-radius: 50%; z-index: 9999; pointer-events: none; transition: 0.1s; }

        /* Navbar */
        .main-nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--jj-cream); }
        .logo-img { height: 50px; width: auto; object-fit: contain; }

        /* Categorias e Carrossel */
        .content-wrapper { padding: 20px 0 40px 0; max-width: 100vw; }
        .category-section { margin-bottom: 50px; }
        .category-title { margin-left: 5%; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; color: var(--jj-brown); }
        
        .carousel-container { 
            display: flex; gap: 30px; overflow-x: auto; padding: 20px 5% 40px 5%; 
            scroll-behavior: smooth; scrollbar-width: none;
        }
        .carousel-container::-webkit-scrollbar { display: none; }

        /* Card Neumorphic com cores claras */
        .product-card {
            flex: 0 0 300px; background: var(--jj-bg); padding: 25px; padding-bottom: 85px; border-radius: 45px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            transition: 0.4s; cursor: pointer; position: relative; min-height: 500px;
        }
        .img-sculpt-frame {
            background: white; height: 260px; border-radius: 35px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            position: relative; overflow: hidden; margin-bottom: 20px;
        }
        .glass-inner-border { position: absolute; inset: 20px; border-radius: 25px; border: 1px solid var(--jj-cream); background: rgba(255, 244, 172, 0.1); backdrop-filter: blur(4px); z-index: 1; }
        .img-sculpt-frame img { max-width: 85%; max-height: 85%; object-fit: contain; z-index: 2; position: relative; }

        .badge-stock { font-size: 0.6rem; font-weight: 700; margin-bottom: 12px; display: inline-block; color: var(--jj-olive); }
        .product-card h3 { font-weight: 700; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 5px; color: var(--jj-brown); }
        .product-card .price { font-weight: 700; color: var(--jj-gold); font-size: 1.1rem; }

        /* Botão Fixo em Amarelo */
        .card-btn-fix {
            position: absolute; bottom: 25px; left: 25px; right: 25px;
            background: var(--jj-gold); color: #fff; border: none; padding: 14px; border-radius: 18px;
            font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: 0.2s;
            box-shadow: 4px 4px 10px rgba(255, 200, 0, 0.3); font-family: var(--font-sans); text-transform: uppercase;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .jj-btn-ghost { background: white; border: 1px solid var(--jj-cream); padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: 0.65rem; cursor: pointer; color: var(--jj-brown); }
        .edit-field { width: 100%; background: white; border: 1px solid var(--jj-cream); padding: 14px; border-radius: 15px; margin-bottom: 12px; font-family: var(--font-sans); outline: none; font-weight: 600; font-size: 0.85rem; }

        /* Modals Limpos */
        .modal { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(96, 108, 56, 0.2); backdrop-filter: blur(12px); }
        .modal-content { 
            background: white; 
            width: 100%; max-width: 900px; max-height: 90vh; border-radius: 45px; 
            position: relative; z-index: 2100; padding: 40px; overflow-y: auto; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
        }

        #admin-btn { display: none; position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; border-radius: 50%; z-index: 1500; font-size: 32px; border: none; color: white; background: var(--jj-gold); cursor: pointer; box-shadow: 0 10px 20px rgba(255, 200, 0, 0.4);}
        .close-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 2rem; cursor: pointer; color: var(--jj-brown); z-index: 2200; }

        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
        
        @media (max-width: 768px) { 
            .product-card { flex: 0 0 280px; }
            .cursor-dot, .cursor-outline { display: none; } 
            body { cursor: auto; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="main-nav">
        <img src="URL_DA_SUA_LOGO_AQUI.png" alt="J&J Logo" class="logo-img">
        <div class="auth-controls" id="auth-ui">
            <button class="jj-btn-ghost" onclick="loginGoogle()">LOGIN GOOGLE</button>
        </div>
    </nav>

    <main class="content-wrapper" id="main-content"></main>

    <div id="details-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <div id="details-body" class="modal-grid"></div>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content" style="max-width: 500px;">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <h2 style="font-weight: 700; text-transform: uppercase; margin-bottom: 25px; color: var(--jj-brown);">Novo Item</h2>
            <input type="text" id="p-category" class="edit-field" placeholder="Categoria">
            <input type="text" id="p-name" class="edit-field" placeholder="Nome">
            <input type="text" id="p-price" class="edit-field" placeholder="Preço">
            <input type="number" id="p-stock" class="edit-field" placeholder="Estoque">
            <input type="file" id="p-file" class="edit-field" accept="image/*" onchange="handleFileSelect(this, 'p-img-preview')">
            <input type="text" id="p-img" class="edit-field" placeholder="Ou URL da imagem">
            <img id="p-img-preview" src="" style="width:80px; display:none; border-radius:10px; margin-bottom:10px">
            <textarea id="p-desc" class="edit-field" placeholder="Descrição..." rows="3"></textarea>
            <button class="card-btn-fix" onclick="saveToRTDB()" style="position:static; width:100%">CADASTRAR</button>
        </div>
    </div>

    <button id="admin-btn" onclick="openAdmin()">+</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        const provider = new firebase.auth.GoogleAuthProvider();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";
        let tempBase64 = "";

        function loginGoogle() { auth.signInWithPopup(provider); }
        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            const authUI = document.getElementById('auth-ui');
            const adminBtn = document.getElementById('admin-btn');
            if (user) {
                authUI.innerHTML = `<span style="font-size:0.65rem; font-weight:700;">${user.displayName.toUpperCase()}</span><button class="jj-btn-ghost" onclick="logout()" style="margin-left:12px">SAIR</button>`;
                if (user.email === ADM_EMAIL) adminBtn.style.display = 'block';
            } else {
                authUI.innerHTML = `<button class="jj-btn-ghost" onclick="loginGoogle()">LOGIN GOOGLE</button>`;
                adminBtn.style.display = 'none';
            }
            listenToProducts();
        });

        function handleFileSelect(input, previewId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    tempBase64 = e.target.result;
                    const preview = document.getElementById(previewId);
                    preview.src = tempBase64;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function saveToRTDB() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const stock = document.getElementById('p-stock').value;
            const desc = document.getElementById('p-desc').value;
            const category = document.getElementById('p-category').value || "Geral";
            const imgUrl = document.getElementById('p-img').value;
            const finalImg = tempBase64 || imgUrl;

            if (name && price && finalImg) {
                const newRef = database.ref('produtos').push();
                newRef.set({ id: newRef.key, name, price, stock: parseInt(stock) || 0, img: finalImg, desc, category }).then(() => {
                    tempBase64 = "";
                    closeModals();
                });
            }
        }

        function listenToProducts() {
            database.ref('produtos').on('value', (snapshot) => {
                const mainContent = document.getElementById('main-content');
                mainContent.innerHTML = "";
                const data = snapshot.val();
                if (data) {
                    const products = Object.values(data);
                    const categories = [...new Set(products.map(p => p.category || "Geral"))];

                    categories.forEach(cat => {
                        const section = document.createElement('div');
                        section.className = 'category-section';
                        section.innerHTML = `<h2 class="category-title">${cat}</h2><div class="carousel-container" id="cat-${cat}"></div>`;
                        mainContent.appendChild(section);

                        const container = document.getElementById(`cat-${cat}`);
                        products.filter(p => (p.category || "Geral") === cat).forEach(p => {
                            const isAdm = auth.currentUser && auth.currentUser.email === ADM_EMAIL;
                            const card = document.createElement('div');
                            card.className = 'product-card';
                            card.onclick = () => openDetails(p);
                            card.innerHTML = `
                                ${isAdm ? `<button onclick="event.stopPropagation(); deleteProduct('${p.id}')" style="position:absolute; top:20px; right:20px; border:none; background:none; font-size:1.3rem; cursor:pointer; color:var(--jj-brown); z-index:10;">&times;</button>` : ''}
                                <div class="img-sculpt-frame">
                                    <div class="glass-inner-border"></div>
                                    <img src="${p.img}">
                                </div>
                                <span class="badge-stock">ESTOQUE: ${p.stock}</span>
                                <h3>${p.name}</h3>
                                <p class="price">${p.price}</p>
                                <button class="card-btn-fix">DETALHES</button>
                            `;
                            container.appendChild(card);
                        });
                    });
                }
            });
        }

        function openDetails(p) {
            const body = document.getElementById('details-body');
            const isAdm = auth.currentUser && auth.currentUser.email === ADM_EMAIL;
            
            if (isAdm) {
                body.innerHTML = `
                    <div class="img-sculpt-frame">
                        <img src="${p.img}" id="edit-img-preview-modal">
                    </div>
                    <div>
                        <input type="text" id="edit-cat" class="edit-field" value="${p.category || 'Geral'}">
                        <input type="text" id="edit-name" class="edit-field" value="${p.name}">
                        <input type="text" id="edit-price" class="edit-field" value="${p.price}">
                        <input type="number" id="edit-stock" class="edit-field" value="${p.stock}">
                        <input type="file" class="edit-field" accept="image/*" onchange="handleFileSelect(this, 'edit-img-preview-modal')">
                        <textarea id="edit-desc" class="edit-field" rows="3">${p.desc}</textarea>
                        <button class="card-btn-fix" onclick="updateProduct('${p.id}')" style="position:static; width:100%">SALVAR</button>
                    </div>
                `;
            } else {
                body.innerHTML = `
                    <div class="img-sculpt-frame"><img src="${p.img}"></div>
                    <div>
                        <h2 style="font-weight:700; text-transform:uppercase; color:var(--jj-brown);">${p.name}</h2>
                        <p style="color:#666; margin:15px 0; font-size:0.85rem;">${p.desc}</p>
                        <p style="font-weight:700; font-size:1.5rem; color:var(--jj-gold);">${p.price}</p>
                        <button class="card-btn-fix" style="position:static; width:100%; margin-top:20px" onclick="orderWhatsApp('${p.name}')">INTERESSE NO WHATSAPP</button>
                    </div>
                `;
            }
            const modal = document.getElementById('details-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function updateProduct(id) {
            const updates = {
                category: document.getElementById('edit-cat').value,
                name: document.getElementById('edit-name').value,
                price: document.getElementById('edit-price').value,
                stock: parseInt(document.getElementById('edit-stock').value),
                desc: document.getElementById('edit-desc').value,
                img: tempBase64 || database.ref('produtos/'+id).img
            };
            database.ref('produtos/' + id).update(updates).then(closeModals);
        }

        function orderWhatsApp(productName) {
            window.open(`https://wa.me/5511999999999?text=Interesse: ${productName}`, '_blank');
        }

        function deleteProduct(id) {
            if(confirm("Excluir?")) database.ref('produtos/' + id).remove();
        }

        function openAdmin() {
            document.getElementById('admin-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('admin-modal').classList.add('active'), 10);
        }

        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => {
                m.classList.remove('active');
                setTimeout(() => m.style.display = 'none', 500);
            });
            tempBase64 = "";
        }

        if (window.innerWidth > 768) {
            const dot = document.querySelector('.cursor-dot');
            const outline = document.querySelector('.cursor-outline');
            window.onmousemove = (e) => {
                dot.style.left = outline.style.left = e.clientX + 'px';
                dot.style.top = outline.style.top = e.clientY + 'px';
            };
        }
    </script>
</body>
</html>
