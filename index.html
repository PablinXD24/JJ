<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Art Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: var(--jj-bg); 
            font-family: var(--font-sans); 
            color: var(--jj-text); 
            overflow-x: hidden; 
            cursor: none; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
        }

        /* Cursor Custom */
        .cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--jj-yellow-main); border-radius: 50%; z-index: 10000; pointer-events: none; }
        .cursor-outline { position: fixed; width: 40px; height: 40px; border: 2px solid var(--jj-yellow-main); border-radius: 50%; z-index: 9999; pointer-events: none; transition: 0.1s; }

        /* Nav */
        .main-nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background: rgba(248, 249, 250, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .logo-img { height: 50px; width: auto; }
        
        .category-nav { display: flex; gap: 15px; overflow-x: auto; padding: 15px 5%; scrollbar-width: none; background: var(--jj-bg); position: sticky; top: 80px; z-index: 90; }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-filter-btn { padding: 8px 20px; border-radius: 15px; border: none; background: var(--jj-bg); box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); font-size: 0.7rem; font-weight: 700; color: var(--jj-brown); cursor: pointer; white-space: nowrap; text-transform: uppercase; transition: 0.3s; }
        .cat-filter-btn.active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); color: var(--jj-yellow-main); }

        /* Cards */
        .content-wrapper { padding: 20px 0 60px 0; flex: 1; }
        .category-title { margin-left: 5%; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px; color: var(--jj-brown); position: relative; }
        .category-title::after { content: ''; position: absolute; left: 0; bottom: -8px; width: 40px; height: 3px; background: var(--jj-yellow-main); border-radius: 2px; }
        
        .carousel-container { display: flex; gap: 30px; overflow-x: auto; padding: 20px 5% 45px 5%; scrollbar-width: none; }
        .carousel-container::-webkit-scrollbar { display: none; }

        .product-card {
            flex: 0 0 300px; background: var(--jj-bg); padding: 25px; padding-bottom: 85px; border-radius: 45px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            transition: 0.4s; cursor: pointer; position: relative; min-height: 560px;
        }
        
        .img-sculpt-frame {
            background: var(--jj-bg); height: 260px; border-radius: 35px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
            position: relative; overflow: hidden; margin-bottom: 25px;
        }
        .img-sculpt-frame img { max-width: 85%; max-height: 85%; object-fit: contain; z-index: 2; transition: 0.5s; }

        .card-btn-fix {
            position: absolute; bottom: 25px; left: 25px; right: 25px;
            background: var(--jj-yellow-main); color: #1a1a1a; border: none; padding: 16px; border-radius: 22px;
            font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: 0.3s;
            box-shadow: 6px 6px 15px rgba(255, 200, 0, 0.35); text-transform: uppercase;
        }

        footer {
            position: relative; background-image: url('jjvidro2.png'); background-size: cover; background-position: center;
            padding: 80px 5% 40px 5%; border-radius: 60px 60px 0 0; overflow: hidden; color: #fff; text-align: center;
        }
        footer::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); z-index: 1; }
        .footer-content { position: relative; z-index: 2; }
        .footer-logo { height: 70px; margin-bottom: 25px; filter: brightness(0) invert(1); }
        .footer-copy { font-size: 0.6rem; color: rgba(255,255,255,0.6); letter-spacing: 2px; text-transform: uppercase; }

        /* Modais */
        .modal { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(12px); }
        .modal-content { background: var(--jj-bg); width: 100%; max-width: 900px; border-radius: 50px; position: relative; z-index: 2100; padding: 40px; max-height: 90vh; overflow-y: auto; box-shadow: 25px 25px 50px rgba(0,0,0,0.2); transition: 0.4s; transform: translateY(40px); opacity: 0; }
        .modal.active .modal-content { transform: translateY(0); opacity: 1; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .close-btn { position: absolute; top: 25px; right: 25px; background: none; border: none; font-size: 2.2rem; cursor: pointer; color: var(--jj-brown); z-index: 10; }

        /* Floating Buttons */
        .float-btn { position: fixed; width: 65px; height: 65px; border-radius: 50%; background: var(--jj-bg); z-index: 1500; box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: 0.3s; }
        #cart-btn-floating { bottom: 30px; left: 30px; display: none; }
        #scan-btn-floating { bottom: 30px; left: 110px; color: var(--jj-brown); }
        #admin-btn { bottom: 30px; right: 30px; background: var(--jj-yellow-main); display: none; }
        #cart-badge { position: absolute; top: 0; right: 0; background: var(--jj-yellow-main); font-size: 10px; font-weight: 700; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        /* Inputs & UI Elements */
        .user-input, .edit-field { width: 100%; background: var(--jj-bg); border: none; padding: 12px; border-radius: 15px; box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); margin-bottom: 12px; outline: none; font-size: 0.8rem; }
        .jj-btn-ghost { background: var(--jj-bg); border: none; padding: 10px 20px; border-radius: 15px; box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light); font-weight: 700; font-size: 0.65rem; color: var(--jj-brown); cursor: pointer; }
        .color-selector { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .color-dot-btn { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: 0.2s; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
        .color-dot-btn.selected { border-color: var(--jj-yellow-main); transform: scale(1.15); }

        /* Scanner Container */
        #reader { width: 100%; border-radius: 30px; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.1); }
        .scan-action-card { background: var(--jj-bg); padding: 20px; border-radius: 30px; text-align: center; box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light); transition: 0.3s; cursor: pointer; }
        .scan-action-card:active { box-shadow: inset 4px 4px 8px var(--shadow-dark); }

        @media (max-width: 768px) {
            .modal { align-items: flex-end; padding: 0; }
            .modal-content { border-radius: 40px 40px 0 0; padding: 50px 20px 30px 20px; transform: translateY(100%); }
            .modal-grid { grid-template-columns: 1fr; gap: 20px; }
            .cursor-dot, .cursor-outline { display: none; }
            body { cursor: auto; }
            #scan-btn-floating { left: auto; right: 110px; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="main-nav">
        <img src="jjvidro.png" alt="Logo J&J" class="logo-img">
        <div id="auth-ui"><button class="jj-btn-ghost" onclick="loginGoogle()">ENTRAR</button></div>
    </nav>

    <div class="category-nav" id="cat-nav-list">
        <button class="cat-filter-btn active" onclick="filterCat('all')">Todos</button>
    </div>

    <main class="content-wrapper" id="main-content"></main>

    <footer>
        <div class="footer-content">
            <img src="jjvidro.png" alt="Logo J&J" class="footer-logo">
            <p class="footer-copy">© 2025 J&J ART COLLECTION. DESIGNED FOR EXCLUSIVITY.</p>
        </div>
    </footer>

    <button id="cart-btn-floating" class="float-btn" onclick="openCartModal()">🛒 <div id="cart-badge">0</div></button>
    <button id="scan-btn-floating" class="float-btn" onclick="openScanner()">📷</button>
    <button id="admin-btn" class="float-btn" onclick="openAdmin()">+</button>

    <div id="details-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <div id="details-body" class="modal-grid"></div>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content" style="max-width: 600px;">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <div style="display:flex; gap:10px; margin-bottom:25px">
                <button class="cat-filter-btn active" id="tab-novo" onclick="switchAdminTab('novo')">Novo Item</button>
                <button class="cat-filter-btn" id="tab-dash" onclick="switchAdminTab('dash')">Token</button>
            </div>
            <div id="admin-create-section">
                <input type="text" id="p-category" class="edit-field" placeholder="Categoria">
                <input type="text" id="p-name" class="edit-field" placeholder="Nome">
                <input type="text" id="p-price" class="edit-field" placeholder="Preço">
                <input type="text" id="p-colors" class="edit-field" placeholder="Cores (Ex: Preto, Azul)">
                <textarea id="p-desc" class="edit-field" placeholder="Descrição"></textarea>
                <button class="card-btn-fix" onclick="saveToRTDB()" style="position:static; width:100%">CRIAR ITEM</button>
            </div>
            <div id="admin-dashboard-section" style="display:none">
                <div style="display:flex; gap:10px; margin-bottom:20px">
                    <input type="text" id="search-token" class="edit-field" placeholder="Token Ex: jj1234">
                    <button class="jj-btn-ghost" onclick="searchOrderByToken()">BUSCAR</button>
                </div>
                <div id="token-result-area"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        const provider = new firebase.auth.GoogleAuthProvider();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";
        const WPP_NUM = "5511998937643";
        
        let cart = JSON.parse(localStorage.getItem('jj_cart')) || [];
        let currentProduct = null, selectedColor = "";
        let html5QrCode = null;

        window.onload = () => { updateCartBadge(); listenToProducts(); };

        function saveCart() { localStorage.setItem('jj_cart', JSON.stringify(cart)); updateCartBadge(); }
        function updateCartBadge() { 
            const badge = document.getElementById('cart-badge');
            badge.innerText = cart.length; 
            document.getElementById('cart-btn-floating').style.display = cart.length > 0 ? 'flex' : 'none'; 
        }

        auth.onAuthStateChanged(user => {
            const authUI = document.getElementById('auth-ui');
            if (user) {
                authUI.innerHTML = `<span style="font-size:0.65rem; font-weight:700">${user.displayName.split(' ')[0]}</span><button class="jj-btn-ghost" onclick="logout()" style="margin-left:10px">SAIR</button>`;
                if (user.email === ADM_EMAIL) document.getElementById('admin-btn').style.display = 'flex';
            } else { authUI.innerHTML = `<button class="jj-btn-ghost" onclick="loginGoogle()">ENTRAR</button>`; }
        });

        // --- SCANNER CORE ---
        function openScanner() {
            const body = document.getElementById('details-body');
            body.innerHTML = `
                <div style="grid-column: 1/-1; text-align:center">
                    <h3 style="margin-bottom:15px; letter-spacing:2px">SCANNER DE PEÇAS</h3>
                    <div id="reader"></div>
                    <p style="margin-top:15px; font-size:0.6rem; color:var(--jj-brown); font-weight:700">APONTE PARA O CÓDIGO DE BARRAS</p>
                </div>`;
            
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);

            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 15, qrbox: { width: 250, height: 150 } };

            html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
                stopScanner();
                showScanOptions(decodedText);
            });
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => { html5QrCode = null; }).catch(err => console.error(err));
            }
        }

        function showScanOptions(code) {
            database.ref('produtos').once('value', snap => {
                const products = snap.val();
                let found = null;
                for (let key in products) { if (key === code || products[key].barcode === code) { found = products[key]; break; } }
                
                if (found) {
                    const body = document.getElementById('details-body');
                    body.innerHTML = `
                        <div style="grid-column: 1/-1; text-align:center">
                            <h2 style="margin-bottom:5px">${found.name}</h2>
                            <p style="color:var(--jj-brown); font-weight:700; margin-bottom:30px">R$ ${found.price}</p>
                            
                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px">
                                <div class="scan-action-card" onclick="openDetails(JSON.parse('${JSON.stringify(found).replace(/'/g, "\\'")}'))">
                                    <div style="font-size:2rem; margin-bottom:10px">👁️</div>
                                    <div style="font-size:0.7rem; font-weight:700">VER DETALHES</div>
                                </div>
                                <div class="scan-action-card" onclick="quickSell(JSON.parse('${JSON.stringify(found).replace(/'/g, "\\'")}'))" style="background:var(--jj-yellow-main)">
                                    <div style="font-size:2rem; margin-bottom:10px">💰</div>
                                    <div style="font-size:0.7rem; font-weight:700">VENDA RÁPIDA</div>
                                </div>
                            </div>
                        </div>`;
                } else {
                    alert("Código não reconhecido no sistema.");
                    closeModals();
                }
            });
        }

        function quickSell(p) {
            const firstColor = p.colors ? p.colors.split(',')[0].trim() : "Única";
            cart.push({ name: p.name, price: parseFloat(p.price), size: "Padrão", color: firstColor, qty: 1 });
            saveCart();
            alert("Item adicionado à sua lista!");
            openCartModal();
        }

        // --- DATABASE & LISTING ---
        function listenToProducts() {
            database.ref('produtos').on('value', snap => {
                const data = snap.val();
                const main = document.getElementById('main-content');
                const catNav = document.getElementById('cat-nav-list');
                main.innerHTML = "";
                catNav.innerHTML = `<button class="cat-filter-btn active" onclick="filterCat('all')">Todos</button>`;
                if (data) {
                    const products = Object.values(data);
                    const cats = [...new Set(products.map(p => p.category))];
                    cats.forEach(cat => {
                        catNav.innerHTML += `<button class="cat-filter-btn" onclick="filterCat('${cat}')">${cat}</button>`;
                        const section = document.createElement('div');
                        section.className = `cat-group cat-${cat.replace(/\s+/g, '-')}`;
                        section.innerHTML = `<h2 class="category-title">${cat}</h2><div class="carousel-container" id="cat-container-${cat.replace(/\s+/g, '-')}"></div>`;
                        main.appendChild(section);
                        products.filter(p => p.category === cat).forEach(p => {
                            const firstColor = p.colors ? p.colors.split(',')[0].trim() : "";
                            const displayImg = (p.variants && p.variants[firstColor] && p.variants[firstColor].img) ? p.variants[firstColor].img : "https://via.placeholder.com/300?text=J&J+Art";
                            const card = document.createElement('div');
                            card.className = 'product-card';
                            card.onclick = () => openDetails(p);
                            card.innerHTML = `
                                ${auth.currentUser?.email === ADM_EMAIL ? `<button onclick="event.stopPropagation(); deleteProduct('${p.id}')" style="position:absolute; top:20px; right:20px; border:none; background:none; font-size:1.5rem; color:var(--jj-brown); cursor:pointer; z-index:20">&times;</button>` : ''}
                                <div class="img-sculpt-frame"><img src="${displayImg}"></div>
                                <div class="card-info"><h3>${p.name}</h3><div class="price">R$ ${p.price}</div></div>
                                <button class="card-btn-fix">EXPLORAR PEÇA</button>`;
                            document.getElementById(`cat-container-${cat.replace(/\s+/g, '-')}`).appendChild(card);
                        });
                    });
                }
            });
        }

        function openDetails(p) {
            currentProduct = p;
            const body = document.getElementById('details-body');
            const colors = p.colors ? p.colors.split(',').map(c => c.trim()) : [];
            selectedColor = colors[0] || "";

            if (auth.currentUser?.email === ADM_EMAIL) {
                let variantEditors = colors.map(c => {
                    const v = (p.variants && p.variants[c]) ? p.variants[c] : { img: "", stock: "" };
                    return `<div style="margin-bottom:15px; padding:12px; background:rgba(0,0,0,0.02); border-radius:15px; border:1px solid rgba(0,0,0,0.05)">
                        <h4 style="color:var(--jj-brown); font-size:0.6rem; margin-bottom:8px">VARIANTE: ${c.toUpperCase()}</h4>
                        <input type="file" onchange="uploadVariantImg('${p.id}', '${c}', this)" style="font-size:0.6rem; margin-bottom:8px">
                        <input type="text" class="edit-field v-stock" data-color="${c}" value="${v.stock || ''}" placeholder="Estoque ex: P:2, M:5">
                    </div>`;
                }).join('');

                body.innerHTML = `
                    <div style="grid-column: 1/-1">
                        <h3>MODO EDITOR</h3>
                        <div style="text-align:center; margin:15px 0; background:white; padding:15px; border-radius:25px">
                            <svg id="barcode-canvas"></svg>
                            <p style="font-size:0.5rem; letter-spacing:2px; margin-top:5px">${p.id}</p>
                        </div>
                        <input type="text" id="e-name" class="edit-field" value="${p.name}">
                        <input type="text" id="e-price" class="edit-field" value="${p.price}">
                        <textarea id="e-desc" class="edit-field">${p.desc || ''}</textarea>
                        ${variantEditors}
                        <button class="card-btn-fix" style="position:static; width:100%" onclick="updateProductAll('${p.id}')">SALVAR DADOS</button>
                    </div>`;
                
                setTimeout(() => { JsBarcode("#barcode-canvas", p.id, { format: "CODE128", width: 1.5, height: 40, displayValue: false }); }, 100);

            } else { updateUserModalView(p, selectedColor); }
            
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
            pushModalState();
        }

        function updateUserModalView(p, color) {
            const body = document.getElementById('details-body');
            const v = (p.variants && p.variants[color]) ? p.variants[color] : { img: "https://via.placeholder.com/300?text=J&J+Art", stock: "" };
            const stockMap = {}; if(v.stock) v.stock.split(',').forEach(item => { const parts = item.split(':'); if(parts.length===2) stockMap[parts[0].trim()] = parts[1].trim(); });
            const sizeOptions = Object.keys(stockMap).map(s => `<option value="${s}">${s} (${stockMap[s]} disp.)</option>`).join('');
            const colorDots = p.colors.split(',').map(c => `<div class="color-dot-btn ${c.trim() === color ? 'selected' : ''}" style="background:${c.trim()}" onclick="switchColor('${c.trim()}')"></div>`).join('');
            
            body.innerHTML = `
                <div class="img-sculpt-frame"><img src="${v.img}"></div>
                <div>
                    <h2 style="letter-spacing:2px">${p.name}</h2>
                    <p style="font-size:0.7rem; margin:15px 0; opacity:0.8; line-height:1.4">${p.desc || ''}</p>
                    <div style="background:rgba(0,0,0,0.03); padding:20px; border-radius:25px; margin-bottom:20px">
                        <div class="color-selector">${colorDots}</div>
                        <select id="u-size" class="user-input">${sizeOptions || '<option disabled>Tamanho Único</option>'}</select>
                        <input type="number" id="u-qty" class="user-input" value="1" min="1">
                    </div>
                    <div style="font-weight:800; font-size:1.4rem; margin-bottom:15px; color:var(--jj-brown)">R$ ${p.price}</div>
                    <button class="card-btn-fix" style="position:static; width:100%" onclick="addToCart('${p.name}', '${p.price}')">ADICIONAR À LISTA</button>
                </div>`;
        }

        // Funções de Suporte
        function switchColor(color) { selectedColor = color; updateUserModalView(currentProduct, color); }
        function switchAdminTab(tab) {
            document.getElementById('admin-create-section').style.display = tab === 'novo' ? 'block' : 'none';
            document.getElementById('admin-dashboard-section').style.display = tab === 'dash' ? 'block' : 'none';
            document.getElementById('tab-novo').classList.toggle('active', tab === 'novo');
            document.getElementById('tab-dash').classList.toggle('active', tab === 'dash');
        }

        function addToCart(name, price) {
            const size = document.getElementById('u-size').value;
            cart.push({ name, price: parseFloat(price), size, color: selectedColor, qty: parseInt(document.getElementById('u-qty').value) });
            saveCart(); closeModals();
        }

        function openCartModal() {
            const body = document.getElementById('details-body');
            let total = 0;
            let list = cart.map((i, idx) => { total += (i.price * i.qty); return `<div style="padding:15px; background:white; border-radius:15px; margin-bottom:10px; font-size:0.75rem; position:relative; box-shadow: 4px 4px 10px rgba(0,0,0,0.05)"><b>${i.name}</b><br><span style="color:var(--jj-brown)">${i.color} | ${i.size} | Qtd: ${i.qty}</span><br><b>R$ ${(i.price * i.qty).toFixed(2)}</b><button onclick="cart.splice(${idx},1); saveCart(); openCartModal();" style="position:absolute; right:15px; top:15px; border:none; background:none; cursor:pointer; font-size:1.2rem">&times;</button></div>`; }).join('');
            body.innerHTML = `<div style="grid-column: span 2"><h2 style="margin-bottom:20px; letter-spacing:2px">MINHA LISTA</h2><div style="max-height:250px; overflow-y:auto; margin-bottom:20px">${list || '<p>Lista vazia.</p>'}</div><div style="padding:15px; background:var(--jj-yellow-main); border-radius:20px; margin-bottom:15px; font-weight:700; text-align:right">TOTAL: R$ ${total.toFixed(2)}</div><input type="text" id="u-final-name" class="user-input" placeholder="Seu Nome"><button class="card-btn-fix" style="position:static; width:100%" onclick="sendWhatsApp(${total})">FINALIZAR PEDIDO</button></div>`;
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
            pushModalState();
        }

        function sendWhatsApp(totalPedido) {
            const user = document.getElementById('u-final-name').value;
            if(!user) return alert("Informe seu nome.");
            const token = "jj" + Math.floor(1000 + Math.random() * 9000);
            let resumoStr = "";
            let msg = `*PEDIDO J&J ART COLLECTION*\n*TOKEN:* ${token}\n*Cliente:* ${user}\n\n*ITENS:*\n`;
            cart.forEach(i => { msg += `• ${i.qty}x ${i.name} (${i.color}/${i.size})\n`; resumoStr += `${i.qty}x ${i.name} (${i.color}/${i.size}); `; });
            msg += `\n*TOTAL:* R$ ${totalPedido.toFixed(2)}`;
            database.ref('pedidos/' + token).set({ token, cliente: user, total: totalPedido, resumo: resumoStr, data: new Date().toLocaleString('pt-BR') })
            .finally(() => { cart = []; saveCart(); window.open(`https://wa.me/${WPP_NUM}?text=${encodeURIComponent(msg)}`, '_blank'); });
        }

        function saveToRTDB() {
            const name = document.getElementById('p-name').value;
            if (name) {
                const ref = database.ref('produtos').push();
                ref.set({ id: ref.key, barcode: ref.key, category: document.getElementById('p-category').value || "Geral", name, price: document.getElementById('p-price').value.replace(',', '.'), colors: document.getElementById('p-colors').value, desc: document.getElementById('p-desc').value })
                .then(() => { closeModals(); alert("Peça Criada!"); });
            }
        }

        function updateProductAll(id) {
            const updates = { name: document.getElementById('e-name').value, price: document.getElementById('e-price').value, desc: document.getElementById('e-desc').value };
            document.querySelectorAll('.v-stock').forEach(input => database.ref(`produtos/${id}/variants/${input.dataset.color}/stock`).set(input.value));
            database.ref('produtos/'+id).update(updates).then(() => { alert("Atualizado!"); closeModals(); });
        }

        function uploadVariantImg(pid, color, input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => database.ref(`produtos/${pid}/variants/${color}/img`).set(e.target.result);
                reader.readAsDataURL(file);
            }
        }

        function filterCat(cat) {
            document.querySelectorAll('.cat-filter-btn').forEach(b => b.classList.remove('active'));
            if(event) event.target.classList.add('active');
            document.querySelectorAll('.cat-group').forEach(g => g.style.display = (cat === 'all' || g.classList.contains(`cat-${cat.replace(/\s+/g, '-')}`)) ? 'block' : 'none');
        }

        function loginGoogle() { auth.signInWithPopup(provider); }
        function logout() { auth.signOut(); }
        function deleteProduct(id) { if(confirm("Apagar?")) database.ref('produtos/'+id).remove(); }
        function openAdmin() { document.getElementById('admin-modal').style.display='flex'; setTimeout(()=>document.getElementById('admin-modal').classList.add('active'),10); pushModalState(); }
        
        function closeModals(shouldGoBack = true) {
            stopScanner();
            document.querySelectorAll('.modal').forEach(m => { m.classList.remove('active'); setTimeout(() => m.style.display = 'none', 400); });
            if (shouldGoBack && history.state && history.state.modal) history.back();
        }
        function pushModalState() { history.pushState({ modal: true }, ""); }

        // Cursor
        if (window.innerWidth > 768) {
            const dot = document.querySelector('.cursor-dot'), out = document.querySelector('.cursor-outline');
            window.onmousemove = (e) => { dot.style.left = e.clientX+'px'; dot.style.top = e.clientY+'px'; out.style.left = (e.clientX - 16) +'px'; out.style.top = (e.clientY - 16) +'px'; };
        }
    </script>
</body>
</html>
