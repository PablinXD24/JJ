<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Executive BI</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); }

        #login-screen { position: fixed; inset: 0; background: var(--jj-bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--jj-bg); padding: 50px; border-radius: 50px; box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light); text-align: center; }

        #dash-content { display: none; padding: 30px 5%; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .logo-img { height: 45px; }

        /* GRID PRINCIPAL */
        .dashboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        
        .card { 
            background: var(--jj-bg); padding: 25px; border-radius: 35px; 
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light); 
        }

        .stat-val { font-size: 1.5rem; font-weight: 700; color: var(--jj-brown); margin-top: 5px; }
        .stat-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; opacity: 0.5; letter-spacing: 1px; }

        /* PROGRESS BAR (META) */
        .goal-container { grid-column: span 2; display: flex; flex-direction: column; justify-content: center; }
        .progress-bg { width: 100%; height: 12px; background: #e0e0e0; border-radius: 10px; margin-top: 15px; overflow: hidden; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1); }
        .progress-fill { height: 100%; background: var(--jj-yellow-main); width: 0%; transition: 1s ease-out; }

        /* CHARTS */
        .charts-section { display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; margin-bottom: 30px; }
        
        /* ALERTAS E LISTAS */
        .list-container { max-height: 300px; overflow-y: auto; margin-top: 15px; }
        .list-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px; border-radius: 15px; background: rgba(255,255,255,0.5); 
            margin-bottom: 8px; font-size: 0.75rem; 
        }
        .badge-alert { background: #ff4444; color: white; padding: 2px 8px; border-radius: 8px; font-weight: 700; font-size: 0.6rem; }
        .badge-vip { background: var(--jj-brown); color: white; padding: 2px 8px; border-radius: 8px; font-size: 0.6rem; }

        .btn-jj {
            padding: 12px 25px; border-radius: 15px; border: none; font-weight: 700; 
            text-transform: uppercase; cursor: pointer; background: var(--jj-yellow-main); 
            box-shadow: 4px 4px 10px rgba(255, 200, 0, 0.3); font-size: 0.7rem;
        }

        @media (max-width: 1024px) {
            .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-section { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <img src="jjvidro.png" style="height: 50px; margin-bottom: 20px;">
            <p style="font-size: 0.7rem; font-weight: 700; letter-spacing: 2px; margin-bottom: 20px;">AUTHENTICATION REQUIRED</p>
            <button class="btn-jj" onclick="login()">Acessar como Pablo</button>
        </div>
    </div>

    <div id="dash-content">
        <header class="header">
            <img src="jjvidro.png" class="logo-img">
            <div style="text-align: right">
                <span id="user-info" style="font-size: 0.7rem; font-weight: 700; margin-right: 15px;"></span>
                <button onclick="logout()" style="background:none; border:none; cursor:pointer; font-weight:700; color:var(--jj-brown); font-size:0.6rem">LOGOUT</button>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="card goal-container">
                <div style="display:flex; justify-content:space-between">
                    <span class="stat-label">Meta Mensal (R$ 15.000)</span>
                    <span class="stat-label" id="goal-percent">0%</span>
                </div>
                <div class="progress-bg"><div id="goal-bar" class="progress-fill"></div></div>
            </div>
            <div class="card">
                <span class="stat-label">Receita Acumulada</span>
                <div class="stat-val" id="total-revenue">R$ 0,00</div>
            </div>
            <div class="card">
                <span class="stat-label">Ticket Médio</span>
                <div class="stat-val" id="avg-ticket">R$ 0,00</div>
            </div>
        </div>

        <div class="charts-section">
            <div class="card">
                <span class="stat-label">Vendas por Categoria e Cor</span>
                <canvas id="mainChart" style="margin-top:20px"></canvas>
            </div>
            <div class="card">
                <span class="stat-label">🚨 Alertas de Estoque Baixo</span>
                <div class="list-container" id="stock-alerts">
                    </div>
            </div>
        </div>

        <div class="charts-section" style="grid-template-columns: 1fr 1fr">
            <div class="card">
                <span class="stat-label">🏆 Clientes VIP (Top Compradores)</span>
                <div class="list-container" id="vip-list"></div>
            </div>
            <div class="card">
                <span class="stat-label">Gestão de Pedidos Recentes</span>
                <div class="list-container" id="order-management"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), database = firebase.database();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";
        const META_VALOR = 15000;

        function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function logout() { auth.signOut().then(() => window.location.reload()); }

        auth.onAuthStateChanged(user => {
            if(user && user.email === ADM_EMAIL) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dash-content').style.display = 'block';
                document.getElementById('user-info').innerText = user.displayName.toUpperCase();
                initAnalytics();
            } else if(user) {
                alert("Acesso não autorizado.");
                auth.signOut();
            }
        });

        function initAnalytics() {
            // Monitorar Produtos (Alertas de Estoque)
            database.ref('produtos').on('value', snap => {
                const prods = snap.val() || {};
                const alertDiv = document.getElementById('stock-alerts');
                alertDiv.innerHTML = "";
                
                Object.values(prods).forEach(p => {
                    // Simulação de lógica de estoque baixo baseada na string de stock (ex: P:1, M:0)
                    if(p.variants) {
                        Object.entries(p.variants).forEach(([color, data]) => {
                            if(data.stock && (data.stock.includes(':0') || data.stock.includes(':1'))) {
                                alertDiv.innerHTML += `
                                    <div class="list-item">
                                        <span><b>${p.name}</b> (${color})</span>
                                        <span class="badge-alert">REPOR</span>
                                    </div>
                                `;
                            }
                        });
                    }
                });
            });

            // Monitorar Pedidos (Financeiro e VIPs)
            database.ref('pedidos').on('value', snap => {
                const pedidos = Object.values(snap.val() || {});
                processFinance(pedidos);
                processVIPs(pedidos);
                processRecentOrders(pedidos);
            });
        }

        function processFinance(pedidos) {
            let total = 0;
            pedidos.forEach(p => total += parseFloat(p.total));
            
            document.getElementById('total-revenue').innerText = `R$ ${total.toLocaleString('pt-BR')}`;
            document.getElementById('avg-ticket').innerText = `R$ ${(total/pedidos.length || 0).toFixed(2)}`;
            
            const percent = Math.min((total / META_VALOR) * 100, 100);
            document.getElementById('goal-bar').style.width = percent + '%';
            document.getElementById('goal-percent').innerText = Math.floor(percent) + '%';
        }

        function processVIPs(pedidos) {
            const clients = {};
            pedidos.forEach(p => clients[p.cliente] = (clients[p.cliente] || 0) + parseFloat(p.total));
            
            const sorted = Object.entries(clients).sort((a,b) => b[1] - a[1]).slice(0, 5);
            const vipDiv = document.getElementById('vip-list');
            vipDiv.innerHTML = sorted.map(c => `
                <div class="list-item">
                    <span>${c[0]}</span>
                    <span class="badge-vip">R$ ${c[1].toFixed(2)}</span>
                </div>
            `).join('');
        }

        function processRecentOrders(pedidos) {
            const div = document.getElementById('order-management');
            div.innerHTML = pedidos.reverse().slice(0, 10).map(p => `
                <div class="list-item">
                    <span><b>${p.token}</b> - ${p.cliente}</span>
                    <button onclick="deleteOrder('${p.token}')" style="background:none; border:none; cursor:pointer">🗑️</button>
                </div>
            `).join('');
        }

        function deleteOrder(token) { if(confirm("Remover permanentemente?")) database.ref('pedidos/'+token).remove(); }

        // Gráfico de Exemplo
        const ctx = document.getElementById('mainChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai'],
                datasets: [{
                    label: 'Crescimento de Vendas',
                    data: [12, 19, 15, 25, 32],
                    borderColor: '#FFC800',
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(255, 200, 0, 0.1)'
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: { y: { display: false }, x: { grid: { display: false } } }
            }
        });
    </script>
</body>
</html>
