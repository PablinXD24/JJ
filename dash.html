<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Executive Global Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.35);
            --shadow-light: rgba(255, 255, 255, 0.85);
            --font-sans: 'Montserrat', sans-serif;
            --success: #2ecc71;
            --warning: #f1c40f;
            --danger: #e74c3c;
            --info: #3498db;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); padding-bottom: 50px; }

        #login-screen { position: fixed; inset: 0; background: rgba(248, 249, 250, 0.9); z-index: 10000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .login-card { background: var(--jj-bg); padding: 50px; border-radius: 50px; box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light); text-align: center; }

        #dash-content { display: block; padding: 30px 5%; opacity: 1; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }

        .card-jj { 
            background: rgba(248, 249, 250, 0.8); backdrop-filter: blur(10px);
            padding: 25px; border-radius: 35px; 
            box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
            margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.3);
        }

        .kpi-card { padding: 20px; text-align: center; }
        .kpi-value { font-size: 1.2rem; font-weight: 700; color: var(--jj-brown); display: block; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .kpi-label { font-size: 0.55rem; font-weight: 800; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }

        .section-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--jj-brown); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ''; width: 4px; height: 15px; background: var(--jj-yellow-main); border-radius: 2px; }

        .bar-bg { height: 12px; background: #e0e5ec; border-radius: 20px; box-shadow: inset 3px 3px 6px var(--shadow-dark); overflow: hidden; margin: 15px 0; }
        .bar-fill { height: 100%; width: 0%; background: var(--jj-brown); transition: 1.5s ease-in-out, background-color 0.5s ease; }

        .edit-field {
            width: 100%; border: none; background: transparent; padding: 6px; font-family: inherit; font-size: 0.75rem;
            border-bottom: 1px solid transparent; transition: 0.3s; outline: none;
        }
        .edit-field:focus { border-bottom: 1px solid var(--jj-yellow-main); }

        .status-select {
            padding: 8px; border-radius: 10px; border: none; font-size: 0.6rem; font-weight: 800; text-transform: uppercase; cursor: pointer; width: 100%;
        }
        .st-orcamento { background: #eee; color: #666; }
        .st-producao { background: var(--info); color: white; }
        .st-finalizado { background: var(--success); color: white; }

        .kanban-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: start; }
        .kanban-column { background: rgba(0,0,0,0.02); border-radius: 25px; padding: 15px; min-height: 400px; box-shadow: inset 4px 4px 10px var(--shadow-dark); transition: background 0.3s; }
        .kanban-column.drag-over { background: rgba(255, 200, 0, 0.05); border: 2px dashed var(--jj-yellow-main); }
        .col-header { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; color: var(--jj-brown); margin-bottom: 15px; text-align: center; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .col-dot { width: 8px; height: 8px; border-radius: 50%; }

        .pedido-card {
            background: #f0f2f5;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            border: 1px solid rgba(255,255,255,0.4);
            cursor: grab;
            transition: 0.2s;
            position: relative;
        }
        .pedido-card:active { cursor: grabbing; }
        .pedido-card.dragging { opacity: 0.5; transform: scale(0.95); }
        .pedido-card:hover { transform: scale(1.02); }
        .pedido-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .token-tag { font-family: monospace; font-size: 0.55rem; background: rgba(0,0,0,0.05); padding: 2px 5px; border-radius: 4px; }
        
        .client-name { font-weight: 700; font-size: 0.85rem; color: var(--jj-brown); display: block; margin-bottom: 5px; }
        
        .card-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .val-badge { font-weight: 700; color: var(--jj-brown); background: var(--jj-yellow-main); padding: 4px 8px; border-radius: 8px; font-size: 0.7rem; }
        .pgto-tag { font-size: 0.55rem; font-weight: 800; color: var(--success); text-transform: uppercase; }

        .lead-time { font-size: 0.5rem; font-weight: 700; color: #888; background: #fff; padding: 2px 6px; border-radius: 10px; box-shadow: 2px 2px 5px var(--shadow-dark); }
        .material-preview { font-size: 0.55rem; font-weight: 600; color: var(--jj-brown); opacity: 0.7; display: block; margin-top: 2px; font-style: italic; }
        .stock-critical { border: 2px solid var(--jj-yellow-main) !important; box-shadow: 0 0 15px rgba(255, 200, 0, 0.4) !important; animation: pulse-border 2s infinite; }
        @keyframes pulse-border { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        #modal-view {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 20000;
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px);
        }
        .modal-content { 
            background: var(--jj-bg); padding: 30px; border-radius: 40px; 
            max-width: 90%; width: 450px; max-height: 90%; overflow: auto; position: relative;
            box-shadow: 20px 20px 60px rgba(0,0,0,0.5);
        }
        .close-modal { position: absolute; top: 15px; right: 20px; cursor: pointer; font-weight: 900; font-size: 1.2rem; color: var(--jj-brown); }

        @media (max-width: 900px) { .kanban-container { grid-template-columns: 1fr; } }

        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .stock-card { background: #f0f2f5; border-radius: 25px; padding: 20px; box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light); border: 2px solid transparent; }
        .stock-item-name { font-size: 0.7rem; font-weight: 800; color: var(--jj-brown); text-transform: uppercase; margin-bottom: 10px; border-bottom: 2px solid var(--jj-yellow-main); padding-bottom: 5px; }
        .variant-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .variant-label { font-size: 0.65rem; font-weight: 600; color: #555; }
        .variant-input-group { display: flex; align-items: center; gap: 10px; width: 50%; }

        .attachment-area { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
        .btn-attach { background: var(--jj-yellow-main); border: none; border-radius: 5px; padding: 3px 8px; cursor: pointer; font-size: 0.55rem; font-weight: 800; }
        .file-wrapper { position: relative; }
        .file-icon { font-size: 1.1rem; cursor: pointer; }
        .del-file { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; border-radius: 50%; width: 12px; height: 12px; font-size: 8px; line-height: 12px; text-align: center; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <img src="jjvidro.png" style="height: 50px; margin-bottom: 25px;">
            <p style="font-size: 0.7rem; margin-bottom: 20px; font-weight: 600;">ACESSO RESTRITO AO ADMINISTRADOR</p>
            <button class="btn-jj" onclick="login()">LOGAR COMO PABLO</button>
        </div>
    </div>

    <div id="modal-view" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="document.getElementById('modal-view').style.display='none'">✕</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <div id="dash-content">
        <header class="header">
            <img src="jjvidro.png" style="height: 40px;">
            <div style="text-align: right">
                <p id="adm-user" style="font-size: 0.8rem; font-weight: 700; color: var(--jj-brown);">Visitante</p>
                <p style="font-size: 0.5rem; letter-spacing: 1px;">MODO DE VISUALIZAÇÃO</p>
            </div>
        </header>

        <div class="kpi-grid">
            <div class="card-jj kpi-card"><span class="kpi-label">Faturamento Total</span><span id="kpi-total" class="kpi-value">R$ 0,00</span></div>
            <div class="card-jj kpi-card"><span class="kpi-label">Ticket Médio</span><span id="kpi-ticket" class="kpi-value">R$ 0,00</span></div>
            <div class="card-jj kpi-card"><span class="kpi-label">Em Produção</span><span id="kpi-prod" class="kpi-value">0</span></div>
            <div class="card-jj kpi-card"><span class="kpi-label">Melhor Cliente</span><span id="kpi-top-client" class="kpi-value">---</span></div>
        </div>

        <div class="card-jj">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 class="section-title" style="margin:0">Meta de Expansão</h3>
                <div style="text-align: right;">
                    <span id="txt-meta-restante" style="font-size: 0.6rem; font-weight: 800; color: var(--jj-brown); margin-right: 15px;"></span>
                    <input type="number" id="meta-val" style="background:transparent; border:none; border-bottom:1px solid var(--jj-yellow-main); width:80px; text-align:right; font-weight:700;" onchange="salvarMeta(this.value)">
                </div>
            </div>
            <div class="bar-bg"><div id="meta-bar" class="bar-fill"></div></div>
            <p id="txt-status-meta" style="font-size: 0.65rem; font-weight: 700; text-align: right;"></p>
        </div>

        <div class="card-jj">
            <div style="display: flex; justify-content: space-between; margin-bottom: 25px; align-items: center;">
                <h3 class="section-title" style="margin:0">Controle de Pedidos & Fluxo</h3>
                <input type="text" id="pedido-search" placeholder="🔍 Buscar cliente ou token..." oninput="filtrarPedidos()" style="border:none; background:rgba(0,0,0,0.05); padding:8px 15px; border-radius:12px; font-size:0.7rem; width:200px;">
            </div>
            
            <div class="kanban-container">
                <div class="kanban-column" ondragover="event.preventDefault(); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="dropCard(event, 'orcamento')">
                    <div class="col-header"><div class="col-dot" style="background:#666"></div> Orçamento</div>
                    <div id="col-orcamento"></div>
                </div>
                <div class="kanban-column" ondragover="event.preventDefault(); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="dropCard(event, 'producao')">
                    <div class="col-header"><div class="col-dot" style="background:var(--info)"></div> Produção</div>
                    <div id="col-producao"></div>
                </div>
                <div class="kanban-column" ondragover="event.preventDefault(); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="dropCard(event, 'finalizado')">
                    <div class="col-header"><div class="col-dot" style="background:var(--success)"></div> Finalizado</div>
                    <div id="col-finalizado"></div>
                </div>
            </div>
        </div>

        <div class="card-jj">
            <h3 class="section-title">Estoque Crítico de Insumos</h3>
            <div id="grid-estoque" class="stock-grid"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), database = firebase.database();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";
        let metaGlobal = 15000, allPedidos = {}, debounceTimer;

        function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }

        auth.onAuthStateChanged(user => {
            if(user && user.email === ADM_EMAIL) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('adm-user').innerText = user.displayName;
            }
        });

        iniciarEscutas();

        function iniciarEscutas() {
            database.ref('configuracoes/meta').on('value', snap => {
                metaGlobal = parseFloat(snap.val()) || 15000;
                document.getElementById('meta-val').value = metaGlobal;
                recalcularGestao();
            });
            database.ref('pedidos').on('value', snap => {
                allPedidos = snap.val() || {};
                renderPedidos(Object.values(allPedidos));
                recalcularGestao();
            });
            database.ref('produtos').on('value', snap => renderProdutos(snap.val() || {}));
        }

        function renderPedidos(pedidosArray) {
            const cols = {
                orcamento: document.getElementById('col-orcamento'),
                producao: document.getElementById('col-producao'),
                finalizado: document.getElementById('col-finalizado')
            };
            
            // Limpeza absoluta antes de renderizar
            Object.values(cols).forEach(c => { if(c) c.innerHTML = ""; });

            // Filtra nulos ou indefinidos que causam fantasmas
            const validos = pedidosArray.filter(p => p && p.token);

            [...validos].reverse().forEach(p => {
                const tk = p.token;
                const st = p.status || 'orcamento';
                const pagamento = p.pagamento || 'A DEFINIR';
                const valor = parseFloat(p.total || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
                
                let leadTimeHTML = '';
                if(st === 'producao' && p.timestamp) {
                    const dias = Math.floor((Date.now() - p.timestamp) / (1000 * 60 * 60 * 24));
                    leadTimeHTML = `<span class="lead-time">🕒 ${dias}d</span>`;
                }

                const materialInfo = p.itens_resumo ? p.itens_resumo.split('\n')[0].substring(0, 30) + '...' : 'Material não especificado';

                const cardHTML = `
                <div class="pedido-card" draggable="true" ondragstart="dragCard(event, '${tk}')" onclick="verDetalhes('${tk}')">
                    <div class="pedido-header">
                        <span class="token-tag">#${tk}</span>
                        <div style="display:flex; gap:5px; align-items:center;">
                            ${leadTimeHTML}
                            <button onclick="event.stopPropagation(); remover('pedidos/${tk}')" style="border:none; background:none; cursor:pointer; opacity:0.3">🗑️</button>
                        </div>
                    </div>
                    <span class="client-name">${p.cliente || 'Sem Nome'}</span>
                    <span class="material-preview">${materialInfo}</span>
                    <div class="card-meta">
                        <span class="val-badge">R$ ${valor}</span>
                        <span class="pgto-tag">💳 ${pagamento}</span>
                    </div>
                    <div style="margin-top:12px" onclick="event.stopPropagation()">
                        <select class="status-select ${getStatusClass(st)}" onchange="updateDB('pedidos/${tk}', 'status', this)">
                            <option value="orcamento" ${st==='orcamento'?'selected':''}>Orçamento</option>
                            <option value="producao" ${st==='producao'?'selected':''}>Produção</option>
                            <option value="finalizado" ${st==='finalizado'?'selected':''}>Finalizado</option>
                        </select>
                    </div>
                </div>`;

                if(cols[st]) cols[st].innerHTML += cardHTML;
                else cols.orcamento.innerHTML += cardHTML;
            });
        }

        function dragCard(ev, token) {
            ev.dataTransfer.setData("token", token);
            ev.currentTarget.classList.add('dragging');
        }

        function dropCard(ev, newStatus) {
            ev.preventDefault();
            const col = ev.currentTarget;
            col.classList.remove('drag-over');
            const token = ev.dataTransfer.getData("token");
            const mockElement = { value: newStatus };
            updateDB(`pedidos/${token}`, 'status', mockElement);
        }

        function verDetalhes(token) {
            const p = allPedidos[token];
            if(!p) return;
            const comps = p.comprovantes || {};
            const modal = document.getElementById('modal-view');
            const body = document.getElementById('modal-body');
            
            body.innerHTML = `
                <h2 style="font-size: 1rem; color: var(--jj-brown); border-bottom: 2px solid var(--jj-yellow-main); padding-bottom: 10px; margin-bottom: 20px;">DETALHES DO PEDIDO #${token}</h2>
                <div style="background: rgba(0,0,0,0.03); padding: 15px; border-radius: 20px; margin-bottom: 20px;">
                    <p style="font-size: 0.6rem; font-weight: 800; color: #888; text-transform: uppercase;">Itens Descriminados:</p>
                    <div style="font-size: 0.8rem; color: #444; margin-top: 10px; line-height: 1.5; white-space: pre-line;">${p.itens_resumo || 'Nenhum item detalhado.'}</div>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <p style="font-size: 0.7rem; font-weight: 700;">VALOR TOTAL: <span style="color: var(--jj-brown)">R$ ${parseFloat(p.total || 0).toLocaleString('pt-BR', {minimumFractionDigits:2})}</span></p>
                    <p style="font-size: 0.7rem; font-weight: 700;">PAGAMENTO: <span style="color: var(--success)">${p.pagamento}</span></p>
                </div>
                <div class="attachment-area">
                    <p style="width: 100%; font-size: 0.6rem; font-weight: 800; color: #888;">COMPROVANTES:</p>
                    <button class="btn-attach" onclick="document.getElementById('up-${token}').click()">+ ADICIONAR</button>
                    <input type="file" id="up-${token}" style="display:none" onchange="uploadComprovante('${token}', this)">
                    ${Object.entries(comps).map(([id, file]) => `
                        <div class="file-wrapper">
                            <span class="file-icon" onclick="visualizarArquivo('${file.base64}', '${file.type}')">📄</span>
                            <span class="del-file" onclick="removerComprovante('${token}', '${id}')">✕</span>
                        </div>
                    `).join('')}
                </div>
            `;
            modal.style.display = 'flex';
        }

        function getStatusClass(st) {
            if(st === 'producao') return 'st-producao';
            if(st === 'finalizado') return 'st-finalizado';
            return 'st-orcamento';
        }

        function recalcularGestao() {
            const arr = Object.values(allPedidos).filter(p => p && p.token);
            const finalizados = arr.filter(p => p.status === 'finalizado');
            
            const totalFinalizado = finalizados.reduce((acc, p) => acc + (parseFloat(p.total) || 0), 0);
            const ticket = finalizados.length > 0 ? (totalFinalizado / finalizados.length) : 0;
            const perc = metaGlobal > 0 ? Math.floor((totalFinalizado / metaGlobal) * 100) : 0;
            const faltaMeta = Math.max(0, metaGlobal - totalFinalizado);

            const faturamentoPorCliente = {};
            finalizados.forEach(p => {
                const nome = p.cliente || 'Sem Nome';
                const valor = parseFloat(p.total) || 0;
                faturamentoPorCliente[nome] = (faturamentoPorCliente[nome] || 0) + valor;
            });

            let melhorCliente = "---";
            let maiorValor = 0;
            Object.entries(faturamentoPorCliente).forEach(([nome, valor]) => {
                if(valor > maiorValor) {
                    maiorValor = valor;
                    melhorCliente = nome;
                }
            });

            document.getElementById('kpi-total').innerText = `R$ ${totalFinalizado.toLocaleString('pt-BR')}`;
            document.getElementById('kpi-ticket').innerText = `R$ ${ticket.toLocaleString('pt-BR', {maximumFractionDigits:0})}`;
            document.getElementById('kpi-prod').innerText = arr.filter(p => p.status === 'producao').length;
            document.getElementById('kpi-top-client').innerText = melhorCliente;
            
            const bar = document.getElementById('meta-bar');
            if(bar) {
                bar.style.width = Math.min(perc, 100) + "%";
                if (perc < 50) bar.style.backgroundColor = 'var(--danger)';
                else if (perc < 100) bar.style.backgroundColor = 'var(--warning)';
                else bar.style.backgroundColor = 'var(--success)';
            }

            document.getElementById('txt-status-meta').innerText = `${perc}% CONCLUÍDO`;
            document.getElementById('txt-meta-restante').innerText = `FALTAM R$ ${faltaMeta.toLocaleString('pt-BR')}`;
        }

        function uploadComprovante(token, input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const fileData = { name: file.name, type: file.type, base64: e.target.result };
                database.ref(`pedidos/${token}/comprovantes`).push(fileData).then(() => { 
                    input.value = ''; 
                    verDetalhes(token);
                });
            };
            reader.readAsDataURL(file);
        }

        function visualizarArquivo(base64, type) {
            if (type.includes('image')) {
                const w = window.open("");
                w.document.write(`<img src="${base64}" style="max-width:100%">`);
            } else {
                const link = document.createElement('a');
                link.href = base64;
                link.download = "comprovante";
                link.click();
            }
        }

        function removerComprovante(token, fileID) {
            if(confirm("Remover comprovante?")) {
                database.ref(`pedidos/${token}/comprovantes/${fileID}`).remove().then(() => verDetalhes(token));
            }
        }

        function updateDB(path, key, element, isNum = false) {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                let val = isNum ? (parseFloat(element.value) || 0) : element.value;
                let updateData = { [key]: val };
                if(key === 'status' && val === 'producao') updateData.timestamp = Date.now();
                
                database.ref(path).update(updateData).catch(() => alert("Erro ao atualizar."));
            }, 600);
        }

        function renderProdutos(data) {
            let html = "";
            Object.entries(data).forEach(([id, p]) => {
                let variantsHTML = "";
                let hasCritical = false;
                if (p.variants) {
                    Object.entries(p.variants).forEach(([color, details]) => {
                        const stockVal = details.stock || 0;
                        if(stockVal <= 0) hasCritical = true;
                        variantsHTML += `<div class="variant-row"><span class="variant-label">${color}</span><div class="variant-input-group"><input class="edit-field" style="${stockVal<=0?'color:var(--danger);font-weight:800':''}" value="${stockVal}" oninput="updateDB('produtos/${id}/variants/${color}', 'stock', this)"></div></div>`;
                    });
                }
                html += `<div class="stock-card ${hasCritical?'stock-critical':''}"><div class="stock-item-name">${p.name}</div>${variantsHTML}</div>`;
            });
            document.getElementById('grid-estoque').innerHTML = html;
        }

        function filtrarPedidos() {
            const t = document.getElementById('pedido-search').value.toLowerCase();
            renderPedidos(Object.values(allPedidos).filter(p => p && ((p.cliente || '').toLowerCase().includes(t) || (p.token || '').toLowerCase().includes(t))));
        }

        function salvarMeta(v) { database.ref('configuracoes/meta').set(parseFloat(v) || 0); }
        
        function remover(path) { 
            if(confirm("Remover permanentemente?")) {
                database.ref(path).set(null).then(() => {
                    // Limpa do objeto local imediatamente para forçar a saída da tela
                    const parts = path.split('/');
                    if(parts[0] === 'pedidos') delete allPedidos[parts[1]];
                    renderPedidos(Object.values(allPedidos));
                });
            } 
        }
    </script>
</body>
</html>
