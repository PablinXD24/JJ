<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Art Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); overflow-x: hidden; cursor: none; display: flex; flex-direction: column; min-height: 100vh; }

        .cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--jj-yellow-main); border-radius: 50%; z-index: 10000; pointer-events: none; }
        .cursor-outline { position: fixed; width: 40px; height: 40px; border: 2px solid var(--jj-yellow-main); border-radius: 50%; z-index: 9999; pointer-events: none; transition: 0.1s; }

        .main-nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background: rgba(248, 249, 250, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .logo-img { height: 50px; width: auto; }
        
        .category-nav { display: flex; gap: 15px; overflow-x: auto; padding: 15px 5%; scrollbar-width: none; background: var(--jj-bg); position: sticky; top: 80px; z-index: 90; }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-filter-btn { padding: 8px 20px; border-radius: 15px; border: none; background: var(--jj-bg); box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); font-size: 0.7rem; font-weight: 700; color: var(--jj-brown); cursor: pointer; white-space: nowrap; text-transform: uppercase; transition: 0.3s; }
        .cat-filter-btn.active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); color: var(--jj-yellow-main); }

        .content-wrapper { padding: 20px 0 60px 0; flex: 1; }
        .category-title { margin-left: 5%; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px; color: var(--jj-brown); position: relative; }
        .category-title::after { content: ''; position: absolute; left: 0; bottom: -8px; width: 40px; height: 3px; background: var(--jj-yellow-main); border-radius: 2px; }
        
        .carousel-container { display: flex; gap: 30px; overflow-x: auto; padding: 20px 5% 45px 5%; scrollbar-width: none; }
        .carousel-container::-webkit-scrollbar { display: none; }

        .product-card {
            flex: 0 0 300px; background: var(--jj-bg); padding: 25px; padding-bottom: 85px; border-radius: 45px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            transition: 0.4s; cursor: pointer; position: relative; min-height: 560px;
        }
        
        .img-sculpt-frame {
            background: var(--jj-bg); height: 260px; border-radius: 35px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
            position: relative; overflow: hidden; margin-bottom: 25px;
        }
        .img-sculpt-frame img { max-width: 85%; max-height: 85%; object-fit: contain; z-index: 2; transition: 0.5s; }

        .card-btn-fix {
            position: absolute; bottom: 25px; left: 25px; right: 25px;
            background: var(--jj-yellow-main); color: #1a1a1a; border: none; padding: 16px; border-radius: 22px;
            font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: 0.3s;
            box-shadow: 6px 6px 15px rgba(255, 200, 0, 0.35); text-transform: uppercase;
        }

        .modal { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(12px); }
        .modal-content { background: var(--jj-bg); width: 100%; max-width: 900px; border-radius: 50px; position: relative; z-index: 2100; padding: 40px; max-height: 90vh; overflow-y: auto; box-shadow: 25px 25px 50px rgba(0,0,0,0.2); transition: 0.4s; transform: translateY(40px); opacity: 0; }
        .modal.active .modal-content { transform: translateY(0); opacity: 1; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .close-btn { position: absolute; top: 25px; right: 25px; background: none; border: none; font-size: 2.2rem; cursor: pointer; color: var(--jj-brown); z-index: 10; }

        .float-btn { position: fixed; width: 65px; height: 65px; border-radius: 50%; background: var(--jj-bg); z-index: 1500; box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light); border: none; cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 24px; transition: 0.3s; }
        
        #cart-btn-floating { bottom: 30px; left: 30px; }
        
        #admin-btn { bottom: 30px; right: 30px; background: var(--jj-yellow-main); }
        #dash-btn-floating { bottom: 105px; right: 30px; background: var(--jj-brown); color: white; font-size: 20px; }
        #scan-btn-floating { bottom: 180px; right: 30px; color: var(--jj-brown); }

        #cart-badge { position: absolute; top: 0; right: 0; background: var(--jj-yellow-main); font-size: 10px; font-weight: 700; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        .user-input, .edit-field { width: 100%; background: var(--jj-bg); border: none; padding: 12px; border-radius: 15px; box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); margin-bottom: 12px; outline: none; font-size: 0.8rem; font-family: inherit; }
        
        .scan-choice-btn { width: 100%; padding: 20px; border-radius: 20px; border: none; margin-bottom: 15px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .btn-edit { background: var(--jj-brown); color: white; }
        .btn-quick { background: var(--jj-yellow-main); color: var(--jj-text); }

        .cashier-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--jj-bg); padding: 15px; border-radius: 20px; box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); text-align: center; }
        .stat-val { font-size: 1.2rem; font-weight: 700; color: var(--jj-brown); }
        .stat-label { font-size: 0.6rem; opacity: 0.6; text-transform: uppercase; }

        .color-selector { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .color-dot-btn { width: 35px; height: 35px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; box-shadow: 3px 3px 6px var(--shadow-dark); }
        .color-dot-btn.selected { border-color: var(--jj-yellow-main); transform: scale(1.1); box-shadow: inset 2px 2px 4px rgba(0,0,0,0.2); }
        
        .size-dot-btn { background: #eee; color: var(--jj-brown); border: 1px solid #ddd; }
        .size-dot-btn.size-selected { border-color: var(--jj-yellow-main) !important; background: var(--jj-yellow-main) !important; color: white !important; }
        .size-dot-btn.out-of-stock { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }

        .variant-box { background:rgba(0,0,0,0.03); padding:15px; border-radius:20px; margin-bottom:10px; }
        .color-picker-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .admin-color-input { border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; background: none; }

        footer {
            position: relative; background-image: url('jjvidro2.png'); background-size: cover; background-position: center;
            padding: 80px 5% 40px 5%; border-radius: 60px 60px 0 0; overflow: hidden; color: #fff; text-align: center;
        }
        footer::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); z-index: 1; }
        .footer-content { position: relative; z-index: 2; }
        .footer-copy { font-size: 0.6rem; color: rgba(255,255,255,0.6); letter-spacing: 2px; text-transform: uppercase; }

        .order-detail-card { background: white; padding: 15px; border-radius: 15px; margin-bottom: 10px; font-size: 0.7rem; box-shadow: 4px 4px 10px rgba(0,0,0,0.05); }

        @media (max-width: 768px) {
            .modal { align-items: flex-end; padding: 0; }
            .modal-content { border-radius: 40px 40px 0 0; padding: 50px 20px 30px 20px; transform: translateY(100%); }
            .modal-grid { grid-template-columns: 1fr; gap: 20px; }
            .cursor-dot, .cursor-outline { display: none; }
            body { cursor: auto; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="main-nav">
        <img src="jjvidro.png" alt="Logo J&J" class="logo-img">
        <div id="auth-ui"></div>
    </nav>

    <div class="category-nav" id="cat-nav-list">
        <button class="cat-filter-btn active" onclick="filterCat('all')">Todos</button>
    </div>

    <main class="content-wrapper" id="main-content"></main>

    <footer>
        <div class="footer-content">
            <img src="jjvidro.png" alt="Logo J&J" class="footer-logo" style="height:60px; margin-bottom:20px; filter: brightness(0) invert(1);">
            <p class="footer-copy">© 2025 J&J ART COLLECTION. DESIGNED FOR EXCLUSIVITY.</p>
        </div>
    </footer>

    <button id="cart-btn-floating" class="float-btn" onclick="openCartModal()">🛒 <div id="cart-badge">0</div></button>
    
    <button id="scan-btn-floating" class="float-btn" onclick="openScanner()">📷</button>
    <button id="dash-btn-floating" class="float-btn" onclick="window.location.href='dash.html'">📊</button>
    <button id="admin-btn" class="float-btn" onclick="openAdmin()">+</button>

    <div id="details-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <div id="details-body" class="modal-grid"></div>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content" style="max-width: 600px;">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <div style="display:flex; gap:10px; margin-bottom:25px; overflow-x: auto; padding-bottom:10px;">
                <button class="cat-filter-btn active" id="tab-novo" onclick="switchAdminTab('novo')">Novo Item</button>
                <button class="cat-filter-btn" id="tab-caixa" onclick="switchAdminTab('caixa')">Caixa</button>
                <button class="cat-filter-btn" id="tab-dash" onclick="switchAdminTab('dash')">Pedidos</button>
            </div>
            
            <div id="admin-create-section">
                <input type="text" id="p-category" class="edit-field" placeholder="Categoria">
                <input type="text" id="p-name" class="edit-field" placeholder="Nome do Item">
                <input type="text" id="p-price" class="edit-field" placeholder="Preço (00.00)">
                <input type="text" id="p-colors" class="edit-field" placeholder="Cores (Ex: Ouro, Transparente)">
                <textarea id="p-desc" class="edit-field" placeholder="Descrição da Obra"></textarea>
                <button class="card-btn-fix" onclick="saveToRTDB()" style="position:static; width:100%">CADASTRAR ITEM</button>
            </div>

            <div id="admin-caixa-section" style="display:none">
                <div class="cashier-stats">
                    <div class="stat-card"><div class="stat-label">Vendas</div><div class="stat-val" id="stat-count">0</div></div>
                    <div class="stat-card"><div class="stat-label">Total Bruto</div><div class="stat-val" id="stat-total">R$ 0,00</div></div>
                </div>
                <h4 style="font-size: 0.7rem; margin-bottom: 15px; color: var(--jj-brown);">HISTÓRICO DE VENDAS</h4>
                <div id="cashier-history" style="max-height: 350px; overflow-y: auto;"></div>
            </div>

            <div id="admin-dashboard-section" style="display:none">
                <input type="text" id="search-token" class="edit-field" placeholder="Digite o Token (Ex: jj1234)">
                <button class="card-btn-fix" onclick="searchOrderByToken()" style="position:static; width:100%">LOCALIZAR PEDIDO</button>
                <div id="token-result-area" style="margin-top:20px"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), database = firebase.database();
        const provider = new firebase.auth.GoogleAuthProvider();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com", WPP_NUM = "5511998937643";
        
        let cart = JSON.parse(localStorage.getItem('jj_cart')) || [];
        let currentProduct = null, html5QrCode = null;
        let selectedSizeData = { size: "Padrão", max: 999 };

        window.onload = () => { updateCartBadge(); listenToProducts(); updateCashierStats(); };

        auth.onAuthStateChanged(user => {
            const ui = document.getElementById('auth-ui');
            const btnAdmin = document.getElementById('admin-btn');
            const btnDash = document.getElementById('dash-btn-floating');
            const btnScan = document.getElementById('scan-btn-floating');
            if(user) {
                ui.innerHTML = `<span style="font-size:0.6rem; font-weight:700">${user.displayName.split(' ')[0]}</span> <button class="cat-filter-btn" onclick="auth.signOut()" style="padding:4px 10px; font-size:0.5rem; margin-left:5px">Sair</button>`;
                if(user.email === ADM_EMAIL) { 
                    btnAdmin.style.display = 'flex'; 
                    btnDash.style.display = 'flex';
                    btnScan.style.display = 'flex'; 
                }
            } else {
                ui.innerHTML = `<button class="cat-filter-btn" onclick="auth.signInWithPopup(provider)">ENTRAR</button>`;
                btnAdmin.style.display = 'none'; 
                btnDash.style.display = 'none';
                btnScan.style.display = 'none';
            }
        });

        function saveCart() { localStorage.setItem('jj_cart', JSON.stringify(cart)); updateCartBadge(); }
        function updateCartBadge() { 
            document.getElementById('cart-badge').innerText = cart.length; 
            document.getElementById('cart-btn-floating').style.display = cart.length > 0 ? 'flex' : 'none'; 
        }

        function openScanner() {
            if(auth.currentUser?.email !== ADM_EMAIL) return;
            const body = document.getElementById('details-body');
            body.innerHTML = `<div style="grid-column: 1/-1; text-align:center"><h3>SCANNER ADM</h3><div id="reader" style="margin:20px 0; border-radius:30px; overflow:hidden"></div></div>`;
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (txt) => {
                stopScanner();
                database.ref('produtos').once('value', snap => {
                    const products = snap.val();
                    let p = null;
                    for(let k in products) { if(k === txt || products[k].barcode === txt) { p = products[k]; break; } }
                    if(p) showScanChoices(p); else { alert("Não encontrado."); closeModals(); }
                });
            });
        }

        function showScanChoices(p) {
            const body = document.getElementById('details-body');
            body.innerHTML = `<div style="grid-column: 1/-1; text-align:center"><h2 style="margin-bottom:10px">${p.name}</h2><p style="margin-bottom:30px; opacity:0.6">Ação Administrativa</p><button class="scan-choice-btn btn-edit" onclick='openDetails(${JSON.stringify(p)})'>EDITAR PRODUTO</button><button class="scan-choice-btn btn-quick" onclick='quickAdd("${p.name}", "${p.price}", "${p.colors}")'>VENDA DIRETA (CAIXA)</button></div>`;
        }

        function quickAdd(name, price, colors) {
            const firstColor = colors.split(',')[0].trim();
            cart.push({ id: currentProduct?.id || 'manual', name, price: parseFloat(price), color: firstColor, size: "Padrão", qty: 1 });
            saveCart(); closeModals(); openCartModal();
        }

        function stopScanner() { if(html5QrCode) html5QrCode.stop().then(()=>html5QrCode=null); }

        function listenToProducts() {
            database.ref('produtos').on('value', snap => {
                const data = snap.val();
                const main = document.getElementById('main-content');
                const catNav = document.getElementById('cat-nav-list');
                main.innerHTML = "";
                catNav.innerHTML = `<button class="cat-filter-btn active" onclick="filterCat('all')">Todos</button>`;
                if(data) {
                    const products = Object.values(data);
                    const cats = [...new Set(products.map(p => p.category))];
                    cats.forEach(cat => {
                        catNav.innerHTML += `<button class="cat-filter-btn" onclick="filterCat('${cat}')">${cat}</button>`;
                        const section = document.createElement('div');
                        section.className = `cat-group cat-${cat.replace(/\s+/g, '-')}`;
                        section.innerHTML = `<h2 class="category-title">${cat}</h2><div class="carousel-container" id="cat-container-${cat.replace(/\s+/g, '-')}"></div>`;
                        main.appendChild(section);
                        products.filter(p => p.category === cat).forEach(p => {
                            const firstColor = p.colors ? p.colors.split(',')[0].trim() : "";
                            const img = (p.variants && p.variants[firstColor]) ? p.variants[firstColor].img : "jjvidro2.png";
                            const card = document.createElement('div');
                            card.className = 'product-card';
                            card.onclick = () => openDetails(p);
                            card.innerHTML = `${auth.currentUser?.email === ADM_EMAIL ? `<button onclick="event.stopPropagation(); deleteProduct('${p.id}')" style="position:absolute; top:20px; right:20px; border:none; background:none; font-size:1.5rem; color:var(--jj-brown); z-index:20">&times;</button>` : ''}<div class="img-sculpt-frame"><img src="${img}"></div><h3>${p.name}</h3><div style="font-weight:700">R$ ${p.price}</div><button class="card-btn-fix">VER PEÇA</button>`;
                            document.getElementById(`cat-container-${cat.replace(/\s+/g, '-')}`).appendChild(card);
                        });
                    });
                }
            });
        }

        function updateCashierStats() {
            database.ref('pedidos').on('value', snap => {
                const pedidos = snap.val();
                let total = 0, count = 0;
                let html = "";
                if(pedidos) {
                    Object.values(pedidos).reverse().forEach(p => {
                        count++;
                        total += parseFloat(p.total);
                        html += `<div class="order-detail-card">
                            <div style="display:flex; justify-content:space-between; margin-bottom:5px"><b>${p.token}</b> <span>${p.data.split(',')[0]}</span></div>
                            <div style="color:var(--jj-brown); font-weight:700">${p.cliente}</div>
                            <div style="margin:5px 0; opacity:0.8; font-size:0.6rem">${p.itens_resumo}</div>
                            <div style="display:flex; justify-content:space-between; border-top:1px solid #eee; padding-top:5px">
                                <span>${p.pagamento}</span>
                                <b>R$ ${p.total}</b>
                            </div>
                        </div>`;
                    });
                }
                const stCount = document.getElementById('stat-count');
                const stTotal = document.getElementById('stat-total');
                const stHist = document.getElementById('cashier-history');
                if(stCount) stCount.innerText = count;
                if(stTotal) stTotal.innerText = `R$ ${total.toFixed(2)}`;
                if(stHist) stHist.innerHTML = html || "Sem vendas.";
            });
        }

        function openDetails(p) {
            currentProduct = p;
            selectedSizeData = { size: null, max: 0 };
            const body = document.getElementById('details-body');
            const colors = p.colors ? p.colors.split(',').map(c => c.trim()) : [];
            let selectedCol = colors[0] || "";

            if(auth.currentUser?.email === ADM_EMAIL) {
                let variantEditor = colors.map(c => {
                    const v = (p.variants && p.variants[c]) ? p.variants[c] : { img: "", stock: "", hex: "" };
                    return `
                    <div class="variant-box">
                        <div class="color-picker-wrapper">
                            <label style="font-size:0.6rem; font-weight:700">COR: ${c.toUpperCase()}</label>
                            <input type="color" class="admin-color-input v-hex" data-color="${c}" value="${v.hex || getDotColor(null, c)}">
                            <span style="font-size:0.6rem; opacity:0.5">Definir tom exato</span>
                        </div>
                        <input type="file" onchange="uploadImg('${p.id}', '${c}', this)" style="display:block; margin:10px 0; font-size:0.7rem">
                        <input type="text" class="edit-field v-stock" data-color="${c}" value="${v.stock || ''}" placeholder="Estoque (Ex: P:2, M:5)">
                    </div>`;
                }).join('');
                
                body.innerHTML = `<div style="grid-column: 1/-1"><h3 style="margin-bottom:20px">EDITOR DE PEÇA</h3><div style="background:white; padding:20px; border-radius:30px; text-align:center; margin-bottom:20px; display:flex; flex-direction:column; align-items:center;"><div id="qrcode-container"></div><p style="font-size:0.5rem; margin-top:10px; opacity:0.6; font-family:monospace">${p.id}</p></div><input type="text" id="e-cat" class="edit-field" value="${p.category}"><input type="text" id="e-name" class="edit-field" value="${p.name}"><input type="text" id="e-price" class="edit-field" value="${p.price}"><input type="text" id="e-colors" class="edit-field" value="${p.colors}"><textarea id="e-desc" class="edit-field" style="height:80px">${p.desc || ''}</textarea>${variantEditor}<button class="card-btn-fix" style="position:static; width:100%" onclick="updateProductAll('${p.id}')">SALVAR ALTERAÇÕES</button></div>`;
                
                setTimeout(() => {
                    new QRCode(document.getElementById("qrcode-container"), {
                        text: p.id,
                        width: 128,
                        height: 128,
                        colorDark : "#834A29",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                }, 100);
            } else {
                renderUserView(p, selectedCol);
            }
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
        }

        // Reconhecimento Automático e Dicionário de Cores Predefinidas
        function getDotColor(product, colorName) {
            // Se houver uma cor hex específica salva no produto (escolhida pelo ADM), ela tem prioridade
            if (product && product.variants && product.variants[colorName] && product.variants[colorName].hex) {
                return product.variants[colorName].hex;
            }

            // Dicionário de cores padrão para reconhecimento automático
            const colorMap = {
                "branco": "#ffffff",
                "preto": "#000000",
                "vermelho": "#ff0000",
                "azul": "#0000ff",
                "verde": "#008000",
                "amarelo": "#ffff00",
                "ouro": "#ffd700",
                "dourado": "#ffd700",
                "prata": "#c0c0c0",
                "prateado": "#c0c0c0",
                "rosa": "#ffc0cb",
                "roxo": "#800080",
                "laranja": "#ffa500",
                "marrom": "#8b4513",
                "transparente": "rgba(255,255,255,0.3)",
                "cristal": "#f0f8ff",
                "ambar": "#ffbf00",
                "fumê": "#555555",
                "cinza": "#808080"
            };

            const nameLow = colorName.toLowerCase().trim();
            return colorMap[nameLow] || colorName; // Retorna o hex do mapa ou o próprio nome (se for um nome válido em inglês)
        }

        function renderUserView(p, color) {
            const body = document.getElementById('details-body');
            const v = (p.variants && p.variants[color]) ? p.variants[color] : { img: "jjvidro2.png", stock: "" };
            const stockArr = v.stock ? v.stock.split(',').map(s => s.trim()) : [];
            
            const colorDots = p.colors.split(',').map(c => {
                const cTrim = c.trim();
                const bgColor = getDotColor(p, cTrim);
                return `<div class="color-dot-btn ${cTrim === color ? 'selected' : ''}" style="background:${bgColor}" onclick="renderUserView(currentProduct, '${cTrim}')"></div>`;
            }).join('');
            
            const sizeDots = stockArr.map(s => {
                const [tam, qtd] = s.split(':');
                const isOut = parseInt(qtd) <= 0;
                return `<div class="color-dot-btn size-dot-btn ${isOut ? 'out-of-stock' : ''} ${selectedSizeData.size === tam ? 'size-selected' : ''}" 
                             onclick="${isOut ? '' : `selectSize(this, '${tam}', ${qtd})`}" 
                             data-size="${tam}" data-max="${qtd}">
                             ${tam}
                        </div>`;
            }).join('') || `<div class="color-dot-btn size-dot-btn size-selected" onclick="selectSize(this, 'Padrão', 999)">P</div>`;

            body.innerHTML = `<div class="img-sculpt-frame"><img src="${v.img}"></div><div><h2>${p.name}</h2><p style="font-size:0.75rem; margin:15px 0; opacity:0.8; line-height:1.4">${p.desc || ''}</p><div style="background:rgba(0,0,0,0.03); padding:20px; border-radius:25px; margin-bottom:20px"><div class="color-selector">${colorDots}</div><div class="color-selector" id="size-selector-area">${sizeDots}</div><input type="number" id="u-qty" class="user-input" value="1" min="1" placeholder="Quantidade"></div><div style="font-size:1.5rem; font-weight:800; margin-bottom:15px">R$ ${p.price}</div><button class="card-btn-fix" style="position:static; width:100%" onclick="addToCart('${p.name}', '${p.price}', '${color}')">ADICIONAR À LISTA</button></div>`;
        }

        function selectSize(el, size, max) {
            document.querySelectorAll('#size-selector-area .color-dot-btn').forEach(b => b.classList.remove('size-selected'));
            el.classList.add('size-selected');
            selectedSizeData = { size, max };
        }

        function updateProductAll(id) {
            const upd = { category: document.getElementById('e-cat').value, name: document.getElementById('e-name').value, price: document.getElementById('e-price').value, colors: document.getElementById('e-colors').value, desc: document.getElementById('e-desc').value };
            document.querySelectorAll('.v-stock').forEach(i => database.ref(`produtos/${id}/variants/${i.dataset.color}/stock`).set(i.value));
            document.querySelectorAll('.v-hex').forEach(i => database.ref(`produtos/${id}/variants/${i.dataset.color}/hex`).set(i.value));
            database.ref('produtos/'+id).update(upd).then(() => { alert("Salvo!"); closeModals(); });
        }

        function uploadImg(pid, color, input) {
            if(input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => database.ref(`produtos/${pid}/variants/${color}/img`).set(e.target.result);
                reader.readAsDataURL(input.files[0]);
            }
        }

        function addToCart(name, price, color) {
            const qtyInput = document.getElementById('u-qty');
            const qty = parseInt(qtyInput.value);
            if (!selectedSizeData.size) return alert("Por favor, selecione um tamanho.");
            if (qty > selectedSizeData.max) return alert(`Desculpe, temos apenas ${selectedSizeData.max} unidades deste tamanho.`);
            cart.push({ id: currentProduct.id, name, price: parseFloat(price), color, size: selectedSizeData.size, qty });
            saveCart(); closeModals();
        }

        function openCartModal() {
            const body = document.getElementById('details-body');
            let total = 0;
            let list = cart.map((i, idx) => { total += (i.price * i.qty); return `<div style="padding:15px; background:white; border-radius:15px; margin-bottom:10px; font-size:0.7rem; position:relative; box-shadow:4px 4px 10px rgba(0,0,0,0.05)"><b>${i.name}</b><br>${i.qty}x ${i.color} (${i.size}) - R$ ${(i.price*i.qty).toFixed(2)}<button onclick="cart.splice(${idx},1); saveCart(); openCartModal();" style="position:absolute; right:15px; top:15px; border:none; background:none; cursor:pointer">×</button></div>` }).join('');
            body.innerHTML = `<div style="grid-column: 1/-1"><h2>RESUMO DO PEDIDO</h2><div style="margin:20px 0">${list}</div><div style="background:var(--jj-yellow-main); padding:15px; border-radius:15px; font-weight:700; text-align:right">TOTAL: R$ ${total.toFixed(2)}</div>
            <div style="margin-top:20px">
                <input type="text" id="u-final-name" class="user-input" placeholder="Nome Completo do Cliente">
                <select id="u-final-pay" class="user-input">
                    <option value="" disabled selected>Forma de Pagamento</option>
                    <option value="PIX">PIX</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
                <button class="card-btn-fix" style="position:static; width:100%" onclick="finishOrder(${total})">FINALIZAR PEDIDO</button>
            </div></div>`;
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
        }

        async function finishOrder(total) {
            const user = document.getElementById('u-final-name').value;
            const pay = document.getElementById('u-final-pay').value;
            if(!user || !pay) return alert("Preencha todos os campos.");
            const token = "jj" + Math.floor(1000 + Math.random()*9000);
            let itensResumo = "";
            let msg = `✨ *J&J ART COLLECTION* ✨\n\n🔖 *Pedido:* ${token}\n👤 *Cliente:* ${user}\n💳 *Pagamento:* ${pay}\n\n---------------------------\n`;
            for (const item of cart) {
                if(item.id && item.id !== 'manual') {
                    const snap = await database.ref(`produtos/${item.id}/variants/${item.color}/stock`).once('value');
                    let stockStr = snap.val();
                    if(stockStr) {
                        let parts = stockStr.split(',').map(s => s.trim());
                        let updatedParts = parts.map(p => {
                            let [tam, qtd] = p.split(':');
                            if(tam === item.size) {
                                let novaQtd = Math.max(0, parseInt(qtd) - item.qty);
                                return `${tam}:${novaQtd}`;
                            }
                            return p;
                        });
                        await database.ref(`produtos/${item.id}/variants/${item.color}/stock`).set(updatedParts.join(', '));
                    }
                }
                msg += `🔸 ${item.qty}x ${item.name}\n   (${item.color} / ${item.size}) - R$ ${item.price}\n`;
                itensResumo += `${item.qty}x ${item.name} (${item.color}); `;
            }
            msg += `---------------------------\n💰 *VALOR TOTAL: R$ ${total.toFixed(2)}*\n\n_Obrigado por escolher a J&J Art!_`;
            database.ref('pedidos/'+token).set({ token, cliente: user, total: total.toFixed(2), pagamento: pay, itens_resumo: itensResumo, data: new Date().toLocaleString() }).then(() => {
                cart = []; saveCart(); window.open(`https://wa.me/${WPP_NUM}?text=${encodeURIComponent(msg)}`); closeModals();
            });
        }

        function saveToRTDB() {
            const n = document.getElementById('p-name').value;
            if(!n) return;
            const ref = database.ref('produtos').push();
            ref.set({ id: ref.key, barcode: ref.key, category: document.getElementById('p-category').value, name: n, price: document.getElementById('p-price').value, colors: document.getElementById('p-colors').value, desc: document.getElementById('p-desc').value })
            .then(() => { closeModals(); alert("Item cadastrado!"); });
        }

        function searchOrderByToken() {
            const t = document.getElementById('search-token').value.trim();
            database.ref('pedidos/'+t).once('value', snap => {
                const p = snap.val();
                const res = document.getElementById('token-result-area');
                if(res) res.innerHTML = p ? `<div class="order-detail-card"><b>Status:</b> Localizado<br><b>Cliente:</b> ${p.cliente}<br><b>Itens:</b> ${p.itens_resumo}<br><b>Pagamento:</b> ${p.pagamento}<br><b>Total:</b> R$ ${p.total}<br><b>Data:</b> ${p.data}</div>` : 'Token não encontrado.';
            });
        }

        function switchAdminTab(t) {
            document.getElementById('admin-create-section').style.display = t === 'novo' ? 'block' : 'none';
            document.getElementById('admin-caixa-section').style.display = t === 'caixa' ? 'block' : 'none';
            document.getElementById('admin-dashboard-section').style.display = t === 'dash' ? 'block' : 'none';
            document.getElementById('tab-novo').classList.toggle('active', t==='novo');
            document.getElementById('tab-caixa').classList.toggle('active', t==='caixa');
            document.getElementById('tab-dash').classList.toggle('active', t==='dash');
        }

        function filterCat(c) {
            document.querySelectorAll('.cat-filter-btn').forEach(b => b.classList.remove('active'));
            if(event) event.target.classList.add('active');
            document.querySelectorAll('.cat-group').forEach(g => g.style.display = (c==='all' || g.classList.contains('cat-'+c.replace(/\s+/g, '-'))) ? 'block' : 'none');
        }

        function closeModals() { stopScanner(); document.querySelectorAll('.modal').forEach(m => { m.classList.remove('active'); setTimeout(()=>m.style.display='none', 400); }); }
        function deleteProduct(id) { if(confirm("Remover este item?")) database.ref('produtos/'+id).remove(); }
        function openAdmin() { document.getElementById('admin-modal').style.display='flex'; setTimeout(()=>document.getElementById('admin-modal').classList.add('active'), 10); }

        if(window.innerWidth > 768) {
            const dot = document.querySelector('.cursor-dot'), out = document.querySelector('.cursor-outline');
            window.onmousemove = (e) => { dot.style.left = e.clientX+'px'; dot.style.top = e.clientY+'px'; out.style.left = (e.clientX-16)+'px'; out.style.top = (e.clientY-16)+'px'; };
        }
    </script>
</body>
</html>
