<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Executive Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-gold: #D4AF37;
            --jj-gold-light: #FFD700;
            --jj-dark-bg: #121212;
            --jj-card-bg: #1e1e1e;
            --jj-text-main: #e0e0e0;
            --jj-text-muted: #888888;
            --shadow-dark: rgba(0, 0, 0, 0.5);
            --shadow-light: rgba(255, 255, 255, 0.03);
            --font-main: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--jj-dark-bg); font-family: var(--font-main); color: var(--jj-text-main); padding-bottom: 50px; }

        /* Login Profissional */
        #login-screen { position: fixed; inset: 0; background: var(--jj-dark-bg); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--jj-card-bg); padding: 60px; border-radius: 40px; box-shadow: 20px 20px 60px var(--shadow-dark); text-align: center; border: 1px solid var(--shadow-light); }

        #dash-content { display: none; padding: 40px 5%; max-width: 1400px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 50px; border-bottom: 1px solid var(--shadow-light); padding-bottom: 20px; }
        .logo-img { height: 40px; filter: brightness(1.2); }

        /* Containers Neumórficos Dark Premium */
        .card-jj { 
            background: var(--jj-card-bg); padding: 35px; border-radius: 30px; 
            box-shadow: 10px 10px 20px var(--shadow-dark), -5px -5px 15px var(--shadow-light);
            margin-bottom: 35px; position: relative; border: 1px solid rgba(255,255,255,0.02);
        }

        .section-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; color: var(--jj-gold); margin-bottom: 25px; display: flex; align-items: center; gap: 12px; }
        .section-title::before { content: ''; width: 3px; height: 15px; background: var(--jj-gold); border-radius: 10px; }

        /* Progress Bar High-End */
        .bar-bg { height: 12px; background: #0a0a0a; border-radius: 20px; box-shadow: inset 2px 2px 5px #000; overflow: hidden; margin: 25px 0; }
        .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #834A29, var(--jj-gold)); transition: 2s cubic-bezier(0.22, 1, 0.36, 1); box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }

        /* Inputs Executivos */
        .edit-field {
            width: 100%; border: none; background: rgba(0,0,0,0.2); padding: 10px; font-family: inherit; font-size: 0.85rem; color: #fff;
            border-radius: 8px; border: 1px solid transparent; outline: none; transition: 0.3s;
        }
        .edit-field:focus { border-color: var(--jj-gold); background: rgba(212, 175, 55, 0.05); }

        .meta-input {
            background: transparent; border: none; font-size: 1.8rem; font-weight: 700; color: var(--jj-gold); width: 180px; text-align: right; outline: none;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3); transition: 0.3s;
        }
        .meta-input:focus { border-bottom-color: var(--jj-gold); color: #fff; }

        /* Tabela Profissional */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; font-size: 0.6rem; color: var(--jj-text-muted); text-transform: uppercase; letter-spacing: 2px; }
        td { padding: 15px; border-top: 1px solid rgba(255,255,255,0.03); }

        .btn-jj { padding: 15px 35px; border-radius: 12px; border: none; background: var(--jj-gold); color: #000; font-weight: 700; cursor: pointer; transition: 0.4s; letter-spacing: 1px; }
        .btn-jj:hover { background: var(--jj-gold-light); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }

        #notification-toast {
            position: fixed; bottom: 30px; right: 30px; z-index: 11000;
            background: #1e1e1e; color: #fff; padding: 20px 35px; border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8); border-left: 5px solid var(--jj-gold);
            display: none; animation: slideIn 0.5s ease;
        }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <img src="jjvidro.png" style="height: 60px; margin-bottom: 30px;">
            <p style="font-size: 0.6rem; font-weight: 700; letter-spacing: 4px; margin-bottom: 30px; color: var(--jj-gold);">EXECUTIVE PANEL</p>
            <button class="btn-jj" onclick="login()">ACESSAR DASHBOARD</button>
        </div>
    </div>

    <div id="dash-content">
        <header class="header">
            <img src="jjvidro.png" class="logo-img">
            <div style="text-align: right">
                <p id="adm-user" style="font-size: 0.9rem; font-weight: 700; color: var(--jj-gold);"></p>
                <p style="font-size: 0.55rem; color: var(--jj-text-muted); font-weight: 700; letter-spacing: 1px;">SISTEMA DE INTELIGÊNCIA J&J</p>
            </div>
        </header>

        <div class="card-jj">
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <h3 class="section-title">Performance Mensal</h3>
                    <p style="font-size: 0.7rem; color: var(--jj-text-muted);">Análise em tempo real baseada na meta definida.</p>
                </div>
                <div style="text-align: right;">
                    <span style="font-size: 0.6rem; color: var(--jj-text-muted); font-weight: 700; display: block; margin-bottom: 5px;">META CORPORATIVA</span>
                    <span style="color: var(--jj-gold); font-weight: 700; margin-right: 5px;">R$</span>
                    <input type="number" id="meta-val" class="meta-input" onchange="salvarMeta(this.value)">
                </div>
            </div>
            <div class="bar-bg"><div id="meta-bar" class="bar-fill"></div></div>
            <div style="display: flex; justify-content: space-between;">
                <span id="txt-faturamento" style="font-size: 1rem; font-weight: 600; color: #fff;">Calculando...</span>
                <span id="txt-porcentagem" style="font-size: 1rem; font-weight: 700; color: var(--jj-gold);">0%</span>
            </div>
        </div>

        <div class="card-jj">
            <h3 class="section-title">Controle de Fluxo & CRM</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Token Id</th>
                            <th>Cliente</th>
                            <th>Valor (R$)</th>
                            <th>Status Pagto</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-pedidos"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="notification-toast">
        <p id="notif-msg" style="font-size: 0.85rem; font-weight: 600;"></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), database = firebase.database();
        const provider = new firebase.auth.GoogleAuthProvider();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";
        
        // A SOLUÇÃO DA META: Começamos com null para saber se o dado já veio do banco
        let metaGlobal = null;

        function login() { auth.signInWithPopup(provider); }

        auth.onAuthStateChanged(user => {
            if(user && user.email === ADM_EMAIL) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dash-content').style.display = 'block';
                document.getElementById('adm-user').innerText = user.displayName.toUpperCase();
                iniciarDashboard();
            }
        });

        function iniciarDashboard() {
            // Escutar Meta do Banco de Dados
            database.ref('configuracoes/meta').on('value', snap => {
                const firebaseMeta = snap.val();
                // Se existir no banco, usa ela. Senão, define 15000 como backup inicial.
                metaGlobal = firebaseMeta || 15000;
                document.getElementById('meta-val').value = metaGlobal;
                
                // Forçar recálculo dos pedidos com a nova meta recebida
                database.ref('pedidos').once('value', snapPedidos => {
                    calcularMeta(snapPedidos.val() || {});
                });
            });

            // Escutar Pedidos em tempo real
            database.ref('pedidos').on('value', snap => {
                renderPedidos(snap.val() || {});
                calcularMeta(snap.val() || {});
            });
        }

        function renderPedidos(data) {
            const html = Object.values(data).reverse().map(p => `
                <tr>
                    <td style="font-family: monospace; font-size: 0.7rem; color: var(--jj-text-muted)">${p.token}</td>
                    <td><input class="edit-field" value="${p.cliente || ''}" onchange="update('pedidos/${p.token}', 'cliente', this.value)"></td>
                    <td><input class="edit-field" value="${p.total || 0}" onchange="update('pedidos/${p.token}', 'total', this.value)"></td>
                    <td><input class="edit-field" value="${p.pagamento || ''}" onchange="update('pedidos/${p.token}', 'pagamento', this.value)"></td>
                    <td><button onclick="remover('pedidos/${p.token}')" style="filter: grayscale(1); opacity: 0.5; cursor: pointer; background:none; border:none; font-size:1.2rem;">🗑️</button></td>
                </tr>
            `).join('');
            document.getElementById('lista-pedidos').innerHTML = html;
        }

        function calcularMeta(pedidos) {
            if (metaGlobal === null) return; // Aguarda a meta carregar

            const total = Object.values(pedidos).reduce((acc, p) => acc + parseFloat(p.total || 0), 0);
            const perc = Math.floor((total / metaGlobal) * 100);
            
            document.getElementById('meta-bar').style.width = Math.min(perc, 100) + "%";
            document.getElementById('txt-faturamento').innerText = "Faturamento: R$ " + total.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            document.getElementById('txt-porcentagem').innerText = perc + "%";
        }

        function salvarMeta(v) {
            const valorNumerico = parseFloat(v);
            if(!isNaN(valorNumerico)) {
                database.ref('configuracoes/meta').set(valorNumerico)
                .then(() => mostrarNotificacao("Estratégia de meta atualizada."));
            }
        }

        function update(path, key, val) { 
            database.ref(path).update({ [key]: val }); 
        }

        function remover(path) { 
            if(confirm("Confirmar exclusão permanente?")) database.ref(path).remove(); 
        }

        function mostrarNotificacao(msg) {
            const toast = document.getElementById('notification-toast');
            document.getElementById('notif-msg').innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }
    </script>
</body>
</html>
