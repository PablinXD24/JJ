<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J&J | Portal Executivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: #000;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Fundo de Cortina Preta de Cetim */
        .curtain-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                #000 0%, #111 10%, #000 20%, #111 30%, #000 40%, 
                #111 50%, #000 60%, #111 70%, #000 80%, #111 90%, #000 100%);
            background-size: 100px 100%;
            z-index: -2;
        }

        /* Chão de Carpete Vermelho */
        .carpet-floor {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 15vh;
            background: radial-gradient(ellipse at top, #a00 0%, #600 100%);
            box-shadow: 0 -10px 50px rgba(0,0,0,0.8);
            z-index: -1;
        }

        /* Menu de Navegação */
        nav {
            position: relative;
            z-index: 10;
            padding: 20px;
            display: flex;
            gap: 15px;
        }

        nav button {
            padding: 10px 20px;
            cursor: pointer;
            background: #FFC800;
            border: 2px solid #834A29;
            color: #834A29;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            transition: 0.3s;
        }

        nav button:hover {
            transform: scale(1.05);
            background: #fff;
        }

        /* Container do iFrame (O Palco) */
        #content-frame {
            width: 95%;
            height: 75vh;
            border: 5px solid #222;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="curtain-bg"></div>
    <div class="carpet-floor"></div>

    <audio id="bg-music" loop autoplay>
        <source src="https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Harry+Potter+Theme&filename=mt/MTI0NjEzMjc1MTI0NjE1_5mFp_2b_2fO7EEY.mp3" type="audio/mpeg">
    </audio>

    <nav>
        <button onclick="changePage('index (23).html')">Home / Art</button>
        <button onclick="changePage('dash (2).html')">Dashboard</button>
        <button onclick="changePage('caixa (5).html')">Caixa PDV</button>
    </nav>

    <div id="content-frame">
        <iframe src="index (23).html" name="main_stage" id="main_stage"></iframe>
    </div>

    <script>
        function changePage(page) {
            document.getElementById('main_stage').src = page;
        }

        // Tentar dar play na música após interação inicial (exigência do Chrome)
        window.onclick = function() {
            document.getElementById('bg-music').play();
        }
    </script>
</body>
</html>
