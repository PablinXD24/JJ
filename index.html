<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Moda e Presentes</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow-light: #FFF4AC;
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); overflow-x: hidden; cursor: none; }

        .cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--jj-yellow-main); border-radius: 50%; z-index: 10000; pointer-events: none; }
        .cursor-outline { position: fixed; width: 40px; height: 40px; border: 2px solid var(--jj-yellow-main); border-radius: 50%; z-index: 9999; pointer-events: none; transition: 0.1s; }

        .main-nav { padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background: rgba(248, 249, 250, 0.95); backdrop-filter: blur(10px); }
        .logo-img { height: 55px; width: auto; }

        .category-section { margin-bottom: 40px; }
        .category-title { margin-left: 5%; font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; color: var(--jj-brown); }
        
        .carousel-container { display: flex; gap: 20px; overflow-x: auto; padding: 10px 5% 30px 5%; scrollbar-width: none; }
        .carousel-container::-webkit-scrollbar { display: none; }

        /* Card Atualizado */
        .product-card {
            flex: 0 0 280px; background: var(--jj-bg); padding: 20px; padding-bottom: 80px; border-radius: 40px;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
            transition: 0.3s; cursor: pointer; position: relative;
        }
        .img-sculpt-frame {
            background: #fff; height: 240px; border-radius: 30px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 5px 5px 10px var(--shadow-dark); margin-bottom: 15px;
        }
        .img-sculpt-frame img { max-width: 80%; max-height: 80%; object-fit: contain; }

        .size-selector-mini { display: flex; gap: 5px; margin: 10px 0; flex-wrap: wrap; }
        .size-tag { font-size: 0.65rem; padding: 4px 8px; border-radius: 8px; background: #eee; font-weight: 600; }

        .product-card h3 { font-size: 0.85rem; text-transform: uppercase; color: var(--jj-brown); }
        .product-card .price { font-weight: 700; color: var(--jj-yellow-main); font-size: 1.1rem; margin-top: 5px; }

        .card-btn-fix {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            background: var(--jj-yellow-main); color: #000; border: none; padding: 12px; border-radius: 15px;
            font-weight: 700; font-size: 0.75rem; text-transform: uppercase;
        }

        /* MODAL MOBILE CORRIGIDO */
        .modal { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
        
        .modal-content { 
            background: #fff; width: 100%; max-width: 800px; position: relative; z-index: 2100; 
            padding: 30px; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
        }

        @media (min-width: 769px) {
            .modal-content { border-radius: 40px; max-height: 90vh; }
            .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        }

        @media (max-width: 768px) {
            .modal { align-items: flex-end; }
            .modal-content { 
                border-radius: 30px 30px 0 0; 
                max-height: 95vh; 
                padding: 40px 20px 20px 20px;
                animation: slideUpMobile 0.4s ease;
            }
            .cursor-dot, .cursor-outline { display: none; }
            body { cursor: auto; }
            .img-sculpt-frame { height: 200px; }
        }

        @keyframes slideUpMobile { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Inputs de Grade Admin */
        .size-grid-input { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .edit-field { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 10px; font-family: inherit; }

        .btn-size-opt { border: 2px solid #eee; padding: 10px; border-radius: 10px; background: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-size-opt.selected { border-color: var(--jj-yellow-main); background: var(--jj-yellow-light); }
        
        #admin-btn { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--jj-yellow-main); border: none; font-size: 30px; z-index: 1500; display: none;}
    </style>
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="main-nav">
        <img src="j&j vidro.png" alt="J&J" class="logo-img">
        <div id="auth-ui"></div>
    </nav>

    <main class="content-wrapper" id="main-content"></main>

    <div id="details-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content">
            <button class="close-btn" onclick="closeModals()" style="position:absolute; top:15px; right:20px; font-size:2rem; background:none; border:none;">&times;</button>
            <div id="details-body"></div>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content" style="max-width: 450px;">
            <h2 style="margin-bottom:20px; color:var(--jj-brown)">Novo Produto</h2>
            <input type="text" id="p-cat" class="edit-field" placeholder="Categoria">
            <input type="text" id="p-name" class="edit-field" placeholder="Nome">
            <input type="text" id="p-price" class="edit-field" placeholder="Preço (Ex: R$ 120,00)">
            <textarea id="p-desc" class="edit-field" placeholder="Descrição"></textarea>
            
            <p style="font-size:0.7rem; font-weight:700; margin-bottom:5px">GRADE DE TAMANHOS (Tamanho:Qtd, Tamanho:Qtd)</p>
            <input type="text" id="p-sizes" class="edit-field" placeholder="Ex: P:5, M:10, G:2">
            
            <input type="file" id="p-file" class="edit-field" accept="image/*" onchange="handleFile(this)">
            <button class="card-btn-fix" onclick="saveProduct()" style="position:static; width:100%; margin-top:10px">SALVAR PRODUTO</button>
        </div>
    </div>

    <button id="admin-btn" onclick="openAdmin()">+</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const ADM = "pablo11ssousa2@gmail.com";
        let imgData = "";

        function handleFile(input) {
            const reader = new FileReader();
            reader.onload = (e) => imgData = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }

        function saveProduct() {
            const sizesStr = document.getElementById('p-sizes').value;
            const sizeMap = {};
            sizesStr.split(',').forEach(pair => {
                const [s, q] = pair.split(':');
                if(s) sizeMap[s.trim().toUpperCase()] = parseInt(q) || 0;
            });

            const ref = db.ref('produtos').push();
            ref.set({
                id: ref.key,
                category: document.getElementById('p-cat').value || "Geral",
                name: document.getElementById('p-name').value,
                price: document.getElementById('p-price').value,
                desc: document.getElementById('p-desc').value,
                sizes: sizeMap,
                img: imgData
            }).then(() => { location.reload(); });
        }

        auth.onAuthStateChanged(user => {
            const ui = document.getElementById('auth-ui');
            if(user) {
                ui.innerHTML = `<button onclick="auth.signOut()" class="jj-btn-ghost" style="border:none; background:none; font-weight:700; color:var(--jj-brown)">SAIR</button>`;
                if(user.email === ADM) document.getElementById('admin-btn').style.display = 'block';
            } else {
                ui.innerHTML = `<button onclick="auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())" class="jj-btn-ghost" style="border:none; background:none; font-weight:700; color:var(--jj-brown)">ENTRAR</button>`;
            }
            loadProducts();
        });

        function loadProducts() {
            db.ref('produtos').on('value', snap => {
                const container = document.getElementById('main-content');
                container.innerHTML = "";
                const data = snap.val();
                if(!data) return;

                const cats = [...new Set(Object.values(data).map(p => p.category))];
                cats.forEach(c => {
                    const sec = document.createElement('div');
                    sec.className = 'category-section';
                    sec.innerHTML = `<h2 class="category-title">${c}</h2><div class="carousel-container" id="sec-${c}"></div>`;
                    container.appendChild(sec);

                    Object.values(data).filter(p => p.category === c).forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.onclick = () => showDetails(p);
                        
                        let sizeHtml = '<div class="size-selector-mini">';
                        Object.keys(p.sizes || {}).forEach(s => {
                            sizeHtml += `<span class="size-tag">${s}</span>`;
                        });
                        sizeHtml += '</div>';

                        card.innerHTML = `
                            <div class="img-sculpt-frame"><img src="${p.img}"></div>
                            <h3>${p.name}</h3>
                            ${sizeHtml}
                            <p class="price">${p.price}</p>
                            <button class="card-btn-fix">DETALHES</button>
                        `;
                        document.getElementById(`sec-${c}`).appendChild(card);
                    });
                });
            });
        }

        function showDetails(p) {
            const body = document.getElementById('details-body');
            let sizeBtns = '';
            Object.entries(p.sizes || {}).forEach(([s, q]) => {
                sizeBtns += `<button class="btn-size-opt" onclick="selectSize(this, '${s}', ${q})">${s}</button>`;
            });

            body.innerHTML = `
                <div class="modal-grid">
                    <div class="img-sculpt-frame" style="height:300px"><img src="${p.img}"></div>
                    <div>
                        <h2 style="color:var(--jj-brown); text-transform:uppercase; margin-bottom:10px">${p.name}</h2>
                        <p style="font-size:0.9rem; color:#666; margin-bottom:20px">${p.desc || ''}</p>
                        <p style="font-weight:700; font-size:1.5rem; color:var(--jj-yellow-main); margin-bottom:20px">${p.price}</p>
                        
                        <p style="font-weight:700; font-size:0.7rem; margin-bottom:10px">ESCOLHA O TAMANHO:</p>
                        <div style="display:flex; gap:10px; margin-bottom:20px">${sizeBtns}</div>
                        
                        <div id="stock-info" style="margin-bottom:20px; font-weight:700; font-size:0.8rem; color:var(--jj-brown)"></div>
                        
                        <button class="card-btn-fix" style="position:static; width:100%" onclick="buy('${p.name}')">INTERESSE NO WHATSAPP</button>
                    </div>
                </div>
            `;
            const modal = document.getElementById('details-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function selectSize(btn, size, qty) {
            document.querySelectorAll('.btn-size-opt').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            const info = document.getElementById('stock-info');
            info.innerHTML = qty > 0 ? `DISPONÍVEL: ${qty} PEÇAS NO TAMANHO ${size}` : `TAMANHO ${size} ESGOTADO`;
            info.style.color = qty > 0 ? '#2d6a4f' : '#e63946';
        }

        function buy(name) {
            const sel = document.querySelector('.btn-size-opt.selected');
            const sizeTxt = sel ? ` no tamanho ${sel.innerText}` : '';
            window.open(`https://wa.me/5511999999999?text=Olá, vi o produto ${name}${sizeTxt} no site e gostaria de saber mais!`);
        }

        function openAdmin() { document.getElementById('admin-modal').style.display = 'flex'; setTimeout(() => document.getElementById('admin-modal').classList.add('active'), 10); }
        function closeModals() { document.querySelectorAll('.modal').forEach(m => { m.classList.remove('active'); setTimeout(() => m.style.display='none', 400); }); }

        // Cursor
        if(window.innerWidth > 768) {
            document.addEventListener('mousemove', e => {
                document.querySelector('.cursor-dot').style.left = e.clientX + 'px';
                document.querySelector('.cursor-dot').style.top = e.clientY + 'px';
                document.querySelector('.cursor-outline').style.left = e.clientX + 'px';
                document.querySelector('.cursor-outline').style.top = e.clientY + 'px';
            });
        }
    </script>
</body>
</html>
