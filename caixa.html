<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | PDV CAIXA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.5);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        body { 
            background: var(--jj-bg);
            font-family: var(--font-sans); 
            color: var(--jj-text); 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--jj-bg);
            box-shadow: 5px 5px 15px var(--shadow-dark);
            z-index: 10;
        }

        .pos-container { 
            display: grid; 
            grid-template-columns: 1fr 420px; 
            gap: 25px; 
            padding: 25px; 
            flex: 1; 
            overflow: hidden; 
        }

        .products-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden;
        }

        #search-pos {
            background: var(--jj-bg);
            border: none;
            padding: 18px 25px;
            border-radius: 20px;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
            font-size: 1rem;
            font-family: var(--font-sans);
            font-weight: 500;
        }

        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; 
            overflow-y: auto;
            padding: 10px;
        }

        .pos-item-card {
            background: var(--jj-bg);
            border-radius: 25px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            transition: 0.2s ease;
        }
        .pos-item-card:active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            transform: scale(0.98);
        }
        .pos-item-card h4 { font-size: 0.75rem; color: var(--jj-brown); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .pos-item-card span { font-weight: 800; font-size: 1.1rem; }

        .checkout-sidebar { 
            background: var(--jj-bg); 
            border-radius: 35px; 
            padding: 30px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .cart-list { flex: 1; overflow-y: auto; margin: 20px 0; padding-right: 5px; }
        .cart-item {
            padding: 15px;
            background: var(--jj-bg);
            border-radius: 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
        }

        .total-box {
            background: var(--jj-yellow);
            padding: 25px;
            border-radius: 25px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 6px 6px 12px rgba(0,0,0,0.1);
        }

        .input-caixa {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: none;
            background: var(--jj-bg);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            margin-bottom: 12px;
            font-family: var(--font-sans);
            font-weight: 600;
        }

        .btn-finish {
            width: 100%; padding: 20px; border-radius: 20px; border: none;
            background: var(--jj-brown); color: white; font-weight: 800; 
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
            letter-spacing: 1px;
        }
        .btn-finish:hover { filter: brightness(1.1); transform: translateY(-2px); }

        #variant-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center;
            backdrop-filter: blur(10px);
        }
        .variant-content { 
            background: var(--jj-bg); padding: 40px; border-radius: 35px; width: 450px; 
            text-align: center; box-shadow: 20px 20px 60px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.6);
        }
        
        .variant-option {
            padding: 18px 12px; border-radius: 20px; margin: 8px;
            cursor: pointer; display: inline-block; font-size: 0.85rem; font-weight: 700;
            background: var(--jj-bg);
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            min-width: 110px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
        }

        .variant-option.selected-active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light) !important;
            border: 2px solid var(--jj-yellow) !important;
            color: var(--jj-brown) !important;
            background: #fff !important;
            transform: scale(0.96);
        }

        .qty-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0 30px 0;
        }
        .qty-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: var(--jj-bg);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--jj-brown);
            cursor: pointer;
        }
        .qty-btn:active {
            box-shadow: inset 2px 2px 5px var(--shadow-dark);
        }
        #modal-qty-display {
            font-size: 1.5rem;
            font-weight: 800;
            min-width: 40px;
        }

        .out-of-stock { opacity: 0.3; cursor: not-allowed; pointer-events: none; box-shadow: none !important; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--jj-yellow); border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <img src="jjvidro.png" style="height: 40px;">
        <h2 style="font-size: 0.8rem; letter-spacing: 2px; color: var(--jj-brown); font-weight: 700;">TERMINAL DE VENDAS</h2>
        <button onclick="window.location.href='dash.html'" style="background:var(--jj-bg); border: none; box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); padding: 10px 25px; border-radius: 50px; cursor: pointer; font-weight: 700; color: var(--jj-brown); font-size: 0.7rem; text-transform: uppercase;">Painel</button>
    </header>

    <div class="pos-container">
        <div class="products-section">
            <input type="text" id="search-pos" placeholder="Procurar item..." oninput="filterPOS()">
            <div class="products-grid" id="pos-grid"></div>
        </div>

        <div class="checkout-sidebar">
            <h3 style="font-size: 0.8rem; margin-bottom: 25px; border-left: 5px solid var(--jj-yellow); padding-left: 15px; color: var(--jj-brown); font-weight: 700;">ITENS NO CARRINHO</h3>
            <div class="cart-list" id="pos-cart-list"></div>
            
            <div class="finalizacao">
                <input type="text" id="c-cliente" class="input-caixa" placeholder="Nome do Cliente">
                <select id="c-pagamento" class="input-caixa">
                    <option value="PIX">PIX</option>
                    <option value="DINHEIRO">DINHEIRO</option>
                    <option value="CARTÃO DÉBITO">CARTÃO DÉBITO</option>
                    <option value="CARTÃO CRÉDITO">CARTÃO CRÉDITO</option>
                </select>
                <div class="total-box">
                    <p style="font-size: 0.65rem; font-weight: 700; margin-bottom: 5px; color: var(--jj-brown); opacity: 0.7;">VALOR TOTAL</p>
                    <h2 id="pos-total-display" style="font-size: 2.2rem; font-weight: 800; color: var(--jj-brown);">R$ 0,00</h2>
                </div>
                <button class="btn-finish" onclick="finishPOSOrder()">Finalizar Venda</button>
            </div>
        </div>
    </div>

    <div id="variant-modal">
        <div class="variant-content">
            <h2 id="modal-product-name" style="color: var(--jj-brown); font-size: 1.2rem; margin-bottom: 5px;"></h2>
            <p style="font-size: 0.75rem; margin-bottom: 15px; font-weight: 600; opacity: 0.6;">ESCOLHA A OPÇÃO E QUANTIDADE</p>
            
            <div id="variant-options-container" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-bottom: 15px;"></div>
            
            <div class="qty-selector">
                <button class="qty-btn" onclick="changeModalQty(-1)">-</button>
                <span id="modal-qty-display">1</span>
                <button class="qty-btn" onclick="changeModalQty(1)">+</button>
            </div>

            <button class="btn-finish" onclick="confirmVariantAddition()">Adicionar ao Pedido</button>
            <p onclick="closeVariantModal()" style="margin-top:20px; cursor:pointer; font-size: 0.7rem; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 1px;">Cancelar</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let localCart = [];
        let allProducts = {};
        let selectedProductForModal = null;
        let selectedVariant = null;
        let modalQty = 1;

        database.ref('produtos').on('value', snap => {
            allProducts = snap.val() || {};
            renderPOSGrid(Object.values(allProducts));
        });

        function renderPOSGrid(list) {
            document.getElementById('pos-grid').innerHTML = list.map(p => `
                <div class="pos-item-card" onclick="openVariantModal('${p.id}')">
                    <h4>${p.name}</h4>
                    <span>R$ ${parseFloat(p.price || 0).toFixed(2)}</span>
                </div>
            `).join('');
        }

        function filterPOS() {
            const term = document.getElementById('search-pos').value.toLowerCase();
            const filtered = Object.values(allProducts).filter(p => p.name.toLowerCase().includes(term));
            renderPOSGrid(filtered);
        }

        function openVariantModal(id) {
            selectedProductForModal = allProducts[id];
            selectedVariant = null;
            modalQty = 1;
            document.getElementById('modal-qty-display').innerText = modalQty;
            
            if(!selectedProductForModal) return;

            document.getElementById('modal-product-name').innerText = selectedProductForModal.name;
            const container = document.getElementById('variant-options-container');
            container.innerHTML = "";

            const vars = selectedProductForModal.variants || selectedProductForModal.variantes || {};
            
            Object.keys(vars).forEach(key => {
                const item = vars[key];
                const stock = (item && typeof item === 'object') ? item.stock : item;
                
                const btn = document.createElement('div');
                btn.className = `variant-option ${stock <= 0 ? 'out-of-stock' : ''}`;
                btn.innerHTML = `${key}<br><small style="font-weight:400; opacity:0.7">Qtd: ${stock}</small>`;
                
                btn.onclick = function(e) {
                    e.stopPropagation();
                    const all = container.querySelectorAll('.variant-option');
                    all.forEach(b => b.classList.remove('selected-active'));
                    this.classList.add('selected-active');
                    
                    // IMPORTANTE: Definimos a variante ANTES de qualquer alteração de QTD
                    selectedVariant = key;
                    modalQty = 1;
                    document.getElementById('modal-qty-display').innerText = modalQty;
                    console.log("Variante definida para:", selectedVariant);
                };

                container.appendChild(btn);
            });

            document.getElementById('variant-modal').style.display = 'flex';
        }

        function changeModalQty(val) {
            if(!selectedVariant) {
                alert("Selecione primeiro a cor!");
                return;
            }
            
            const vars = selectedProductForModal.variants || selectedProductForModal.variantes || {};
            const item = vars[selectedVariant];
            
            // Garantindo que capturamos o número do estoque corretamente
            let stock = 0;
            if (item !== null && typeof item === 'object') {
                stock = parseInt(item.stock || 0);
            } else {
                stock = parseInt(item || 0);
            }

            const newVal = modalQty + val;
            
            if(newVal >= 1 && newVal <= stock) {
                modalQty = newVal;
                document.getElementById('modal-qty-display').innerText = modalQty;
            } else if (newVal > stock) {
                alert("Estoque máximo atingido (" + stock + ")");
            }
        }

        function closeVariantModal() { 
            document.getElementById('variant-modal').style.display = 'none'; 
        }

        function confirmVariantAddition() {
            if(!selectedVariant) {
                alert("Por favor, selecione uma opção!");
                return;
            }

            for(let i = 0; i < modalQty; i++) {
                localCart.push({ 
                    id: selectedProductForModal.id, 
                    name: selectedProductForModal.name, 
                    price: parseFloat(selectedProductForModal.price || 0), 
                    variant: selectedVariant 
                });
            }
            
            updatePOSCartUI();
            closeVariantModal();
        }

        function updatePOSCartUI() {
            const list = document.getElementById('pos-cart-list');
            let total = 0;
            
            const grouped = localCart.reduce((acc, item) => {
                const key = `${item.id}-${item.variant}`;
                if(!acc[key]) acc[key] = {...item, qty: 0};
                acc[key].qty++;
                return acc;
            }, {});

            list.innerHTML = Object.values(grouped).map((item) => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                return `
                    <div class="cart-item">
                        <div>
                            <p style="font-size: 0.85rem; font-weight: 700; color: var(--jj-brown);">${item.name}</p>
                            <p style="font-size: 0.65rem; font-weight: 600; opacity: 0.6;">${item.qty}x ${item.variant}</p>
                        </div>
                        <div style="display:flex; align-items:center; gap:12px">
                            <b style="font-size: 0.9rem;">R$ ${itemTotal.toFixed(2)}</b>
                            <span onclick="removeFromCart('${item.id}', '${item.variant}')" style="cursor:pointer; color:#ff4444; font-weight:800; font-size:1.1rem">✕</span>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('pos-total-display').innerText = `R$ ${total.toFixed(2)}`;
        }

        function removeFromCart(id, variant) {
            localCart = localCart.filter(item => !(item.id === id && item.variant === variant));
            updatePOSCartUI();
        }

        async function finishPOSOrder() {
            if(localCart.length === 0) return alert("Carrinho vazio!");
            
            const token = "CAIXA-" + Math.floor(1000 + Math.random()*9000);
            
            try {
                const stockUpdate = localCart.reduce((acc, item) => {
                    const key = `${item.id}|${item.variant}`;
                    acc[key] = (acc[key] || 0) + 1;
                    return acc;
                }, {});

                for(let key in stockUpdate) {
                    const [id, variant] = key.split('|');
                    const prodRef = allProducts[id];
                    const vKey = prodRef.variants ? 'variants' : 'variantes';
                    const path = `produtos/${id}/${vKey}/${variant}`;
                    const qtyToSubtract = stockUpdate[key];
                    
                    const snap = await database.ref(path).once('value');
                    const data = snap.val();

                    if(data && typeof data === 'object' && data.stock !== undefined) {
                        await database.ref(path + '/stock').transaction(c => (c || 0) - qtyToSubtract);
                    } else {
                        await database.ref(path).transaction(c => (c || 0) - qtyToSubtract);
                    }
                }

                const order = {
                    token,
                    cliente: document.getElementById('c-cliente').value || "Cliente Balcão",
                    total: localCart.reduce((a,b)=>a+b.price, 0).toFixed(2),
                    pagamento: document.getElementById('c-pagamento').value,
                    itens_resumo: localCart.map(i => `${i.name} (${i.variant})`).join(', '),
                    data: new Date().toLocaleString(),
                    status: "Concluído",
                    origem: "Caixa Físico"
                };

                await database.ref('pedidos/' + token).set(order);
                alert("VENDA FINALIZADA COM SUCESSO!");
                localCart = [];
                updatePOSCartUI();
                document.getElementById('c-cliente').value = "";
            } catch(e) {
                console.error(e);
                alert("Erro ao processar venda.");
            }
        }
    </script>
</body>
</html>
