<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | PDV CAIXA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.5);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        body { 
            background: var(--jj-bg);
            font-family: var(--font-sans); 
            color: var(--jj-text); 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--jj-bg);
            box-shadow: 5px 5px 15px var(--shadow-dark);
            z-index: 10;
        }

        .pos-container { 
            display: grid; 
            grid-template-columns: 1fr 420px; 
            gap: 25px; 
            padding: 25px; 
            flex: 1; 
            overflow: hidden; 
        }

        .products-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden;
        }

        #search-pos {
            background: var(--jj-bg);
            border: none;
            padding: 18px 25px;
            border-radius: 20px;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
            font-size: 1rem;
            font-family: var(--font-sans);
        }

        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; 
            overflow-y: auto;
            padding: 10px;
        }

        .pos-item-card {
            background: var(--jj-bg);
            border-radius: 25px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            transition: 0.2s ease;
        }
        .pos-item-card:active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            transform: scale(0.98);
        }
        .pos-item-card h4 { font-size: 0.75rem; color: var(--jj-brown); margin-bottom: 8px; text-transform: uppercase; }
        .pos-item-card span { font-weight: 800; font-size: 1.1rem; }

        .checkout-sidebar { 
            background: var(--jj-bg); 
            border-radius: 35px; 
            padding: 30px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .cart-list { flex: 1; overflow-y: auto; margin: 20px 0; padding-right: 5px; }
        .cart-item {
            padding: 15px;
            background: var(--jj-bg);
            border-radius: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
        }

        .total-box {
            background: var(--jj-yellow);
            padding: 25px;
            border-radius: 25px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 6px 6px 12px rgba(0,0,0,0.15);
        }

        .input-caixa {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: none;
            background: var(--jj-bg);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            margin-bottom: 12px;
            font-family: var(--font-sans);
            font-weight: 600;
        }

        .btn-finish {
            width: 100%; padding: 20px; border-radius: 20px; border: none;
            background: var(--jj-brown); color: white; font-weight: 800; 
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
        }
        .btn-finish:hover { filter: brightness(1.2); }

        #variant-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center;
            backdrop-filter: blur(8px);
        }
        .variant-content { 
            background: var(--jj-bg); padding: 40px; border-radius: 35px; width: 400px; 
            text-align: center; box-shadow: 20px 20px 60px var(--shadow-dark);
        }
        
        .variant-option {
            padding: 15px; border-radius: 15px; margin: 8px;
            cursor: pointer; display: inline-block; font-size: 0.85rem; font-weight: 700;
            background: var(--jj-bg);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            min-width: 80px;
            transition: 0.2s;
        }
        .variant-option.selected { 
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            color: var(--jj-brown);
            border: 2px solid var(--jj-yellow);
        }
        .out-of-stock { opacity: 0.3; cursor: not-allowed; box-shadow: none !important; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--jj-yellow); border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <img src="jjvidro.png" style="height: 40px;">
        <h2 style="font-size: 0.8rem; letter-spacing: 2px; color: var(--jj-brown)">TERMINAL DE VENDAS</h2>
        <button onclick="window.location.href='dash.html'" style="background:var(--jj-bg); border: none; box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); padding: 8px 20px; border-radius: 50px; cursor: pointer; font-weight: 600;">PAINEL</button>
    </header>

    <div class="pos-container">
        <div class="products-section">
            <input type="text" id="search-pos" placeholder="Pesquisar produto..." oninput="filterPOS()">
            <div class="products-grid" id="pos-grid"></div>
        </div>

        <div class="checkout-sidebar">
            <h3 style="font-size: 0.9rem; margin-bottom: 20px; border-left: 4px solid var(--jj-yellow); padding-left: 10px;">RESUMO DA VENDA</h3>
            <div class="cart-list" id="pos-cart-list"></div>
            <div class="finalizacao">
                <input type="text" id="c-cliente" class="input-caixa" placeholder="Nome do Cliente">
                <select id="c-pagamento" class="input-caixa">
                    <option value="PIX">PIX</option>
                    <option value="DINHEIRO">DINHEIRO</option>
                    <option value="CARTÃO DÉBITO">CARTÃO DÉBITO</option>
                    <option value="CARTÃO CRÉDITO">CARTÃO CRÉDITO</option>
                </select>
                <div class="total-box">
                    <p style="font-size: 0.7rem; font-weight: 700; margin-bottom: 5px; opacity: 0.8;">TOTAL</p>
                    <h2 id="pos-total-display" style="font-size: 2rem;">R$ 0,00</h2>
                </div>
                <button class="btn-finish" onclick="finishPOSOrder()">FINALIZAR AGORA</button>
            </div>
        </div>
    </div>

    <div id="variant-modal">
        <div class="variant-content">
            <h2 id="modal-product-name" style="margin-bottom: 20px;"></h2>
            <div id="variant-options-container" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 30px;"></div>
            <button class="btn-finish" onclick="confirmVariantAddition()">ADICIONAR</button>
            <p onclick="closeVariantModal()" style="margin-top:20px; cursor:pointer; font-size: 0.8rem; font-weight: 700; color: #666;">CANCELAR</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let localCart = [];
        let allProducts = {};
        let selectedProductForModal = null;
        let selectedVariant = null;

        database.ref('produtos').on('value', snap => {
            allProducts = snap.val() || {};
            renderPOSGrid(Object.values(allProducts));
        });

        function renderPOSGrid(list) {
            document.getElementById('pos-grid').innerHTML = list.map(p => `
                <div class="pos-item-card" onclick="openVariantModal('${p.id}')">
                    <h4>${p.name}</h4>
                    <span>R$ ${parseFloat(p.price || 0).toFixed(2)}</span>
                </div>
            `).join('');
        }

        function filterPOS() {
            const term = document.getElementById('search-pos').value.toLowerCase();
            const filtered = Object.values(allProducts).filter(p => p.name.toLowerCase().includes(term));
            renderPOSGrid(filtered);
        }

        function openVariantModal(id) {
            selectedProductForModal = allProducts[id];
            selectedVariant = null;
            if(!selectedProductForModal) return;

            document.getElementById('modal-product-name').innerText = selectedProductForModal.name;
            const container = document.getElementById('variant-options-container');
            container.innerHTML = "";

            const variants = selectedProductForModal.variants || {};
            
            // Corrige a leitura caso as variantes venham como array ou objeto
            Object.keys(variants).forEach(vKey => {
                const stock = variants[vKey].stock !== undefined ? variants[vKey].stock : variants[vKey];
                const displayLabel = vKey;

                const div = document.createElement('div');
                div.className = `variant-option ${stock <= 0 ? 'out-of-stock' : ''}`;
                div.innerHTML = `${displayLabel}<br><small>Qtd: ${stock}</small>`;
                
                if(stock > 0) {
                    div.onclick = () => {
                        document.querySelectorAll('.variant-option').forEach(el => el.classList.remove('selected'));
                        div.classList.add('selected');
                        selectedVariant = vKey;
                    };
                }
                container.appendChild(div);
            });
            document.getElementById('variant-modal').style.display = 'flex';
        }

        function closeVariantModal() { 
            document.getElementById('variant-modal').style.display = 'none'; 
        }

        function confirmVariantAddition() {
            if(!selectedVariant) {
                alert("Por favor, selecione uma cor/tamanho disponível.");
                return;
            }
            
            const prod = selectedProductForModal;
            const variantData = prod.variants[selectedVariant];
            const currentStock = variantData.stock !== undefined ? variantData.stock : variantData;
            
            const inCart = localCart.filter(i => i.id === prod.id && i.variant === selectedVariant).length;

            if(inCart >= currentStock) {
                alert("Estoque máximo atingido para esta variante!");
                return;
            }

            localCart.push({ 
                id: prod.id, 
                name: prod.name, 
                price: parseFloat(prod.price || 0), 
                variant: selectedVariant 
            });
            
            updatePOSCartUI();
            closeVariantModal();
        }

        function updatePOSCartUI() {
            const list = document.getElementById('pos-cart-list');
            let total = 0;
            list.innerHTML = localCart.map((item, idx) => {
                total += item.price;
                return `
                    <div class="cart-item">
                        <div><b>${item.name}</b><br><small>${item.variant}</small></div>
                        <div style="display:flex; align-items:center; gap:10px">
                            <b>R$ ${item.price.toFixed(2)}</b>
                            <span onclick="localCart.splice(${idx},1); updatePOSCartUI()" style="cursor:pointer; color:red; font-weight:bold;">✕</span>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('pos-total-display').innerText = `R$ ${total.toFixed(2)}`;
        }

        async function finishPOSOrder() {
            if(localCart.length === 0) return alert("Carrinho vazio!");
            const token = "CAIXA-" + Math.floor(1000 + Math.random()*9000);
            
            try {
                for(let item of localCart) {
                    const refPath = `produtos/${item.id}/variants/${item.variant}`;
                    // Verifica se a variante é um objeto com .stock ou apenas o valor do estoque
                    const snapshot = await database.ref(refPath).once('value');
                    const data = snapshot.val();
                    
                    if(data && typeof data === 'object' && data.stock !== undefined) {
                        await database.ref(refPath + '/stock').transaction(current => (current || 0) - 1);
                    } else {
                        await database.ref(refPath).transaction(current => (current || 0) - 1);
                    }
                }

                const order = {
                    token,
                    cliente: document.getElementById('c-cliente').value || "Cliente Balcão",
                    total: localCart.reduce((a,b)=>a+b.price, 0).toFixed(2),
                    pagamento: document.getElementById('c-pagamento').value,
                    itens_resumo: localCart.map(i => `${i.name} (${i.variant})`).join(', '),
                    data: new Date().toLocaleString(),
                    status: "Concluído",
                    origem: "Caixa Físico"
                };

                await database.ref('pedidos/' + token).set(order);
                alert("VENDA FINALIZADA COM SUCESSO!");
                localCart = [];
                updatePOSCartUI();
                document.getElementById('c-cliente').value = "";
            } catch(error) {
                console.error(error);
                alert("Erro ao processar venda.");
            }
        }
    </script>
</body>
</html>
