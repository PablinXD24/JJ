<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | BI Restricted Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); min-height: 100vh; }

        /* Estética do Login */
        #login-screen { 
            position: fixed; inset: 0; background: var(--jj-bg); z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: var(--jj-bg); padding: 50px; border-radius: 50px;
            box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light);
            text-align: center; max-width: 400px; width: 100%;
        }

        /* Estética do Dashboard */
        #dash-content { display: none; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; margin-bottom: 30px; }
        .logo-img { height: 45px; }

        .btn-jj {
            padding: 15px 30px; border-radius: 20px; border: none; font-weight: 700; 
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
            background: var(--jj-yellow-main); color: var(--jj-text);
            box-shadow: 5px 5px 15px rgba(255, 200, 0, 0.3);
        }
        .btn-jj:hover { transform: scale(1.05); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; padding: 0 5%; margin-bottom: 40px; }
        .stat-card {
            background: var(--jj-bg); padding: 25px; border-radius: 35px;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
            text-align: center;
        }
        .stat-val { font-size: 1.6rem; font-weight: 700; color: var(--jj-brown); margin: 5px 0; }
        .stat-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; opacity: 0.5; letter-spacing: 1px; }

        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; padding: 0 5%; margin-bottom: 40px; }
        .chart-card {
            background: var(--jj-bg); padding: 30px; border-radius: 40px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
        }

        .edit-input {
            width: 100%; background: var(--jj-bg); border: none; padding: 10px; border-radius: 10px;
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
            font-family: inherit; font-size: 0.8rem; margin-top: 10px; outline: none;
        }

        .data-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .data-table th { text-align: left; padding: 15px; font-size: 0.7rem; text-transform: uppercase; color: var(--jj-brown); }
        .data-table td { padding: 15px; border-top: 1px solid rgba(0,0,0,0.05); font-size: 0.8rem; }

        @media (max-width: 850px) { .charts-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <img src="jjvidro.png" style="height: 60px; margin-bottom: 30px;">
            <h2 style="font-size: 1rem; margin-bottom: 10px; letter-spacing: 2px;">ÁREA RESTRITA</h2>
            <p style="font-size: 0.7rem; opacity: 0.6; margin-bottom: 30px;">Apenas pablo11ssousa2@gmail.com possui permissão de acesso.</p>
            <button class="btn-jj" onclick="login()">ENTRAR COM GOOGLE</button>
            <p id="error-msg" style="color: #ff4444; font-size: 0.6rem; margin-top: 20px; display: none;">Acesso negado: Usuário não autorizado.</p>
        </div>
    </div>

    <div id="dash-content">
        <header class="header">
            <img src="jjvidro.png" class="logo-img">
            <div style="text-align: right;">
                <p id="adm-name" style="font-weight: 700; font-size: 0.8rem;"></p>
                <button onclick="logout()" style="background: none; border: none; color: var(--jj-brown); font-size: 0.6rem; font-weight: 700; cursor: pointer;">SAIR DO SISTEMA</button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total em Vendas</div>
                <div class="stat-val" id="val-vendas">R$ 0,00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pedidos</div>
                <div class="stat-val" id="val-pedidos">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Produtos</div>
                <div class="stat-val" id="val-itens">0</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h4 class="stat-label" style="margin-bottom: 20px;">Performance de Categorias</h4>
                <canvas id="chartCat"></canvas>
            </div>
            <div class="chart-card">
                <h4 class="stat-label" style="margin-bottom: 20px;">Gestão de Pedidos (Edição Direta)</h4>
                <div style="max-height: 300px; overflow-y: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Token</th>
                                <th>Cliente</th>
                                <th>Total</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="table-orders"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), database = firebase.database();
        const provider = new firebase.auth.GoogleAuthProvider();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";

        // GESTÃO DE ACESSO
        function login() {
            auth.signInWithPopup(provider).then(result => {
                if(result.user.email !== ADM_EMAIL) {
                    document.getElementById('error-msg').style.display = 'block';
                    auth.signOut();
                }
            });
        }

        function logout() { auth.signOut().then(() => window.location.reload()); }

        auth.onAuthStateChanged(user => {
            if(user && user.email === ADM_EMAIL) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dash-content').style.display = 'block';
                document.getElementById('adm-name').innerText = `Olá, ${user.displayName}`;
                loadData();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('dash-content').style.display = 'none';
            }
        });

        // CARREGAMENTO DE DADOS E FUNÇÕES DE EDIÇÃO
        function loadData() {
            // Stats de Produtos
            database.ref('produtos').on('value', snap => {
                const p = snap.val() || {};
                document.getElementById('val-itens').innerText = Object.keys(p).length;
                renderChart(Object.values(p));
            });

            // Stats e Edição de Pedidos
            database.ref('pedidos').on('value', snap => {
                const pedidos = snap.val() || {};
                let totalGeral = 0;
                const tbody = document.getElementById('table-orders');
                tbody.innerHTML = "";

                Object.values(pedidos).reverse().forEach(o => {
                    totalGeral += parseFloat(o.total);
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight:700">${o.token}</td>
                            <td><input class="edit-input" value="${o.cliente}" onchange="updateOrder('${o.token}', 'cliente', this.value)"></td>
                            <td><input class="edit-input" value="${o.total}" onchange="updateOrder('${o.token}', 'total', this.value)"></td>
                            <td><button onclick="deleteOrder('${o.token}')" style="border:none; background:none; cursor:pointer">🗑️</button></td>
                        </tr>
                    `;
                });

                document.getElementById('val-vendas').innerText = `R$ ${totalGeral.toFixed(2)}`;
                document.getElementById('val-pedidos').innerText = Object.keys(pedidos).length;
            });
        }

        // FUNÇÕES EXCLUSIVAS DO ADM (LIBERDADE TOTAL)
        function updateOrder(token, field, value) {
            database.ref(`pedidos/${token}`).update({ [field]: value });
        }

        function deleteOrder(token) {
            if(confirm("Deseja apagar permanentemente este registro de venda?")) {
                database.ref(`pedidos/${token}`).remove();
            }
        }

        let myChart;
        function renderChart(products) {
            const ctx = document.getElementById('chartCat').getContext('2d');
            const cats = {};
            products.forEach(p => cats[p.category] = (cats[p.category] || 0) + 1);

            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(cats),
                    datasets: [{
                        label: 'Itens por Categoria',
                        data: Object.values(cats),
                        backgroundColor: '#FFC800',
                        borderRadius: 15
                    }]
                },
                options: { plugins: { legend: { display: false } } }
            });
        }
    </script>
</body>
</html>
