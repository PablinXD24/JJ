<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Executive Intelligence 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.3);
            --shadow-light: rgba(255, 255, 255, 0.8);
            --font-sans: 'Montserrat', sans-serif;
            --success: #28a745;
            --warning: #f39c12;
            --danger: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); padding-bottom: 50px; }

        /* Login */
        #login-screen { position: fixed; inset: 0; background: var(--jj-bg); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--jj-bg); padding: 50px; border-radius: 50px; box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light); text-align: center; }

        #dash-content { display: none; padding: 30px 5%; opacity: 0; transition: opacity 0.5s; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

        /* Grid de KPIs */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }

        /* Cards Neumórficos com Glassmorphism */
        .card-jj { 
            background: rgba(248, 249, 250, 0.7); 
            backdrop-filter: blur(10px);
            padding: 25px; border-radius: 35px; 
            box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
            margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.2);
        }

        .kpi-card { padding: 20px; text-align: center; border-radius: 25px; }
        .kpi-value { font-size: 1.4rem; font-weight: 700; color: var(--jj-brown); display: block; margin-top: 5px; }
        .kpi-label { font-size: 0.6rem; font-weight: 700; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }

        .section-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--jj-brown); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ''; width: 4px; height: 15px; background: var(--jj-yellow-main); border-radius: 2px; }

        /* Progress Bar Dinâmica */
        .bar-bg { height: 14px; background: #e0e5ec; border-radius: 20px; box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); overflow: hidden; margin: 15px 0; }
        .bar-fill { height: 100%; width: 0%; background: var(--jj-brown); transition: 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67); }

        /* Inputs & Search */
        .search-input {
            width: 100%; padding: 15px 25px; border-radius: 20px; border: none; background: var(--jj-bg);
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            font-family: inherit; outline: none; margin-bottom: 20px;
        }

        .edit-field {
            width: 100%; border: none; background: transparent; padding: 8px; font-family: inherit; font-size: 0.8rem;
            border-radius: 10px; transition: 0.3s; outline: none;
        }
        .edit-field:focus { box-shadow: inset 2px 2px 5px var(--shadow-dark); background: rgba(255, 200, 0, 0.05); }

        /* Tabelas */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; font-size: 0.65rem; color: var(--jj-brown); cursor: pointer; user-select: none; }
        th:hover { opacity: 0.7; }
        td { padding: 10px 12px; border-top: 1px solid rgba(0,0,0,0.03); }

        .btn-jj { padding: 12px 25px; border-radius: 15px; border: none; background: var(--jj-yellow-main); font-weight: 700; cursor: pointer; transition: 0.3s; }
        
        #notification-toast {
            position: fixed; bottom: 30px; right: 30px; z-index: 11000;
            background: var(--jj-bg); padding: 20px 30px; border-radius: 25px;
            box-shadow: 10px 10px 20px var(--shadow-dark); border-left: 10px solid var(--jj-yellow-main);
            display: none; animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <img src="jjvidro.png" style="height: 50px; margin-bottom: 25px;">
            <button class="btn-jj" onclick="login()">ACESSAR PAINEL PABLO</button>
        </div>
    </div>

    <div id="dash-content">
        <header class="header">
            <img src="jjvidro.png" style="height: 40px;">
            <div style="text-align: right">
                <p id="adm-user" style="font-size: 0.8rem; font-weight: 700; color: var(--jj-brown);"></p>
                <p style="font-size: 0.6rem; opacity: 0.5;">ADMINISTRADOR</p>
            </div>
        </header>

        <div class="kpi-grid">
            <div class="card-jj kpi-card">
                <span class="kpi-label">Ticket Médio</span>
                <span id="kpi-ticket" class="kpi-value">R$ 0,00</span>
            </div>
            <div class="card-jj kpi-card">
                <span class="kpi-label">Volume Mensal</span>
                <span id="kpi-volume" class="kpi-value">0 Pedidos</span>
            </div>
            <div class="card-jj kpi-card">
                <span class="kpi-label">Conversão Meta</span>
                <span id="kpi-perc" class="kpi-value">0%</span>
            </div>
        </div>

        <div class="card-jj">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <h3 class="section-title" style="margin:0">Meta Executiva</h3>
                <div style="background: var(--jj-bg); padding: 5px 15px; border-radius: 15px; box-shadow: inset 3px 3px 6px var(--shadow-dark);">
                    <span style="font-size: 0.6rem; font-weight: 800; opacity: 0.5;">R$</span>
                    <input type="number" id="meta-val" style="border:none; background:transparent; font-weight:700; width:80px; outline:none; color:var(--jj-brown)" onchange="salvarMeta(this.value)">
                </div>
            </div>
            <div class="bar-bg"><div id="meta-bar" class="bar-fill"></div></div>
            <p id="txt-faturamento" style="font-size: 0.75rem; font-weight: 600; opacity: 0.7;"></p>
        </div>

        <div class="card-jj">
            <input type="text" id="pedido-search" class="search-input" placeholder="Pesquisar por cliente ou token..." oninput="filtrarPedidos()">
            <h3 class="section-title">Gestão de Pedidos</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th onclick="ordenar('token')">Token ⇅</th>
                            <th onclick="ordenar('cliente')">Cliente ⇅</th>
                            <th onclick="ordenar('total')">Valor (R$) ⇅</th>
                            <th>Pagamento</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-pedidos"></tbody>
                </table>
            </div>
        </div>

        <div class="card-jj">
            <h3 class="section-title">Acervo de Produtos</h3>
            <div style="overflow-x: auto;">
                <table id="tabela-produtos">
                    <thead>
                        <tr><th>Item</th><th>Preço</th><th>Categoria</th></tr>
                    </thead>
                    <tbody id="lista-produtos"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="notification-toast">
        <p id="notif-msg" style="font-size: 0.85rem; font-weight: 700; color: var(--jj-brown);"></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), database = firebase.database();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";
        
        let metaGlobal = 15000, lastLevel = 0, allPedidos = {}, debounceTimer, ordemAtual = { campo: '', asc: true };

        function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }

        auth.onAuthStateChanged(user => {
            if(user && user.email === ADM_EMAIL) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dash-content').style.display = 'block';
                setTimeout(() => document.getElementById('dash-content').style.opacity = '1', 100);
                document.getElementById('adm-user').innerText = user.displayName;
                iniciarEscutas();
            }
        });

        function iniciarEscutas() {
            database.ref('configuracoes/meta').on('value', snap => {
                metaGlobal = parseFloat(snap.val()) || 15000;
                document.getElementById('meta-val').value = metaGlobal;
                recalcularDashboard();
            });

            database.ref('pedidos').on('value', snap => {
                allPedidos = snap.val() || {};
                renderPedidos(Object.values(allPedidos));
                recalcularDashboard();
            });

            database.ref('produtos').on('value', snap => renderProdutos(snap.val() || {}));
        }

        function renderPedidos(pedidosArray) {
            const html = pedidosArray.map(p => `
                <tr>
                    <td><small><b>${p.token}</b></small></td>
                    <td><input class="edit-field" value="${p.cliente || ''}" oninput="updateDB('pedidos/${p.token}', 'cliente', this)"></td>
                    <td><input class="edit-field" value="${p.total || 0}" oninput="updateDB('pedidos/${p.token}', 'total', this, true)"></td>
                    <td><input class="edit-field" value="${p.pagamento || ''}" oninput="updateDB('pedidos/${p.token}', 'pagamento', this)"></td>
                    <td><button onclick="remover('pedidos/${p.token}')" style="border:none; background:none; cursor:pointer">🗑️</button></td>
                </tr>
            `).join('');
            document.getElementById('lista-pedidos').innerHTML = html;
        }

        function recalcularDashboard() {
            const arr = Object.values(allPedidos);
            const total = arr.reduce((acc, p) => acc + (parseFloat(p.total) || 0), 0);
            const volume = arr.length;
            const ticket = volume > 0 ? (total / volume) : 0;
            const perc = metaGlobal > 0 ? Math.floor((total / metaGlobal) * 100) : 0;

            // Update UI
            document.getElementById('kpi-ticket').innerText = `R$ ${ticket.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('kpi-volume').innerText = `${volume} Itens`;
            document.getElementById('kpi-perc').innerText = `${perc}%`;
            document.getElementById('txt-faturamento').innerText = `Total acumulado: R$ ${total.toLocaleString('pt-BR')}`;
            
            const bar = document.getElementById('meta-bar');
            bar.style.width = Math.min(perc, 100) + "%";
            
            // Lógica de Cores da Meta
            if(perc < 50) { bar.style.background = 'var(--danger)'; document.getElementById('kpi-perc').style.color = 'var(--danger)'; }
            else if(perc < 85) { bar.style.background = 'var(--warning)'; document.getElementById('kpi-perc').style.color = 'var(--warning)'; }
            else { bar.style.background = 'var(--success)'; document.getElementById('kpi-perc').style.color = 'var(--success)'; }
        }

        function ordenar(campo) {
            ordemAtual.asc = (ordemAtual.campo === campo) ? !ordemAtual.asc : true;
            ordemAtual.campo = campo;
            const lista = Object.values(allPedidos).sort((a, b) => {
                let v1 = a[campo], v2 = b[campo];
                if(campo === 'total') { v1 = parseFloat(v1); v2 = parseFloat(v2); }
                return ordemAtual.asc ? (v1 > v2 ? 1 : -1) : (v1 < v2 ? 1 : -1);
            });
            renderPedidos(lista);
        }

        function updateDB(path, key, element, isNum = false) {
            clearTimeout(debounceTimer);
            element.style.color = 'var(--jj-yellow-main)';
            debounceTimer = setTimeout(() => {
                let val = isNum ? (parseFloat(element.value.replace(',', '.')) || 0) : element.value;
                database.ref(path).update({ [key]: val }).then(() => {
                    element.style.color = 'inherit';
                });
            }, 800);
        }

        function filtrarPedidos() {
            const termo = document.getElementById('pedido-search').value.toLowerCase();
            const filtrados = Object.values(allPedidos).filter(p => 
                p.cliente?.toLowerCase().includes(termo) || p.token?.toLowerCase().includes(termo)
            );
            renderPedidos(filtrados);
        }

        function renderProdutos(data) {
            document.getElementById('lista-produtos').innerHTML = Object.entries(data).map(([id, p]) => `
                <tr>
                    <td><input class="edit-field" value="${p.name || ''}" oninput="updateDB('produtos/${id}', 'name', this)"></td>
                    <td><input class="edit-field" value="${p.price || 0}" oninput="updateDB('produtos/${id}', 'price', this, true)"></td>
                    <td><input class="edit-field" value="${p.category || ''}" oninput="updateDB('produtos/${id}', 'category', this)"></td>
                </tr>
            `).join('');
        }

        function salvarMeta(v) { database.ref('configuracoes/meta').set(parseFloat(v) || 0); }
        function remover(path) { if(confirm("Deseja excluir?")) database.ref(path).remove(); }
    </script>
</body>
</html>
