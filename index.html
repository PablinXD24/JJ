<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Art Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); overflow-x: hidden; cursor: none; display: flex; flex-direction: column; min-height: 100vh; }

        /* Cursor Custom */
        .cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--jj-yellow-main); border-radius: 50%; z-index: 10000; pointer-events: none; }
        .cursor-outline { position: fixed; width: 40px; height: 40px; border: 2px solid var(--jj-yellow-main); border-radius: 50%; z-index: 9999; pointer-events: none; transition: 0.1s; }

        /* Nav */
        .main-nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background: rgba(248, 249, 250, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .logo-img { height: 50px; width: auto; }
        
        .category-nav { display: flex; gap: 15px; overflow-x: auto; padding: 15px 5%; scrollbar-width: none; background: var(--jj-bg); position: sticky; top: 80px; z-index: 90; }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-filter-btn { padding: 8px 20px; border-radius: 15px; border: none; background: var(--jj-bg); box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); font-size: 0.7rem; font-weight: 700; color: var(--jj-brown); cursor: pointer; white-space: nowrap; text-transform: uppercase; transition: 0.3s; }
        .cat-filter-btn.active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); color: var(--jj-yellow-main); }

        /* Layout */
        .content-wrapper { padding: 20px 0 60px 0; flex: 1; }
        .category-title { margin-left: 5%; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px; color: var(--jj-brown); position: relative; }
        .category-title::after { content: ''; position: absolute; left: 0; bottom: -8px; width: 40px; height: 3px; background: var(--jj-yellow-main); border-radius: 2px; }
        
        .carousel-container { display: flex; gap: 30px; overflow-x: auto; padding: 20px 5% 45px 5%; scrollbar-width: none; }
        .carousel-container::-webkit-scrollbar { display: none; }

        .product-card {
            flex: 0 0 300px; background: var(--jj-bg); padding: 25px; padding-bottom: 85px; border-radius: 45px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            transition: 0.4s; cursor: pointer; position: relative; min-height: 560px;
        }
        
        .img-sculpt-frame {
            background: var(--jj-bg); height: 260px; border-radius: 35px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
            position: relative; overflow: hidden; margin-bottom: 25px;
        }
        .img-sculpt-frame img { max-width: 85%; max-height: 85%; object-fit: contain; z-index: 2; transition: 0.5s; }

        .card-btn-fix {
            position: absolute; bottom: 25px; left: 25px; right: 25px;
            background: var(--jj-yellow-main); color: #1a1a1a; border: none; padding: 16px; border-radius: 22px;
            font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: 0.3s;
            box-shadow: 6px 6px 15px rgba(255, 200, 0, 0.35); text-transform: uppercase;
        }

        /* Cores Selector */
        .color-dot-selector { display: flex; gap: 10px; margin: 15px 0; }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid white; box-shadow: 3px 3px 6px rgba(0,0,0,0.1); transition: 0.3s; }
        .color-dot.active { transform: scale(1.2); border-color: var(--jj-yellow-main); box-shadow: 0 0 10px var(--jj-yellow-main); }

        /* Modais */
        .modal { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(12px); }
        .modal-content { background: var(--jj-bg); width: 100%; max-width: 900px; border-radius: 50px; position: relative; z-index: 2100; padding: 40px; max-height: 90vh; overflow-y: auto; box-shadow: 25px 25px 50px rgba(0,0,0,0.2); transition: 0.4s; transform: translateY(40px); opacity: 0; }
        .modal.active .modal-content { transform: translateY(0); opacity: 1; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .close-btn { position: absolute; top: 25px; right: 25px; background: none; border: none; font-size: 2.2rem; cursor: pointer; color: var(--jj-brown); z-index: 10; }

        .user-input, .edit-field { width: 100%; background: var(--jj-bg); border: none; padding: 12px; border-radius: 15px; box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); margin-bottom: 12px; outline: none; font-size: 0.8rem; font-family: inherit; }

        .float-btn { position: fixed; width: 65px; height: 65px; border-radius: 50%; background: var(--jj-bg); z-index: 1500; box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light); border: none; cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 24px; transition: 0.3s; }
        #cart-btn-floating { bottom: 30px; left: 30px; }
        #admin-btn { bottom: 30px; right: 30px; background: var(--jj-yellow-main); }
        #cart-badge { position: absolute; top: 0; right: 0; background: var(--jj-yellow-main); font-size: 10px; font-weight: 700; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        .order-history-card { background: white; padding: 15px; border-radius: 20px; margin-bottom: 15px; box-shadow: 4px 4px 12px rgba(0,0,0,0.06); font-size: 0.75rem; border-left: 5px solid var(--jj-yellow-main); }

        footer { position: relative; background-image: url('jjvidro2.png'); background-size: cover; background-position: center; padding: 80px 5% 40px 5%; border-radius: 60px 60px 0 0; overflow: hidden; color: #fff; text-align: center; }
        footer::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); z-index: 1; }
        .footer-content { position: relative; z-index: 2; }

        @media (max-width: 768px) {
            .modal { align-items: flex-end; padding: 0; }
            .modal-content { border-radius: 40px 40px 0 0; padding: 50px 20px 30px 20px; transform: translateY(100%); }
            .modal-grid { grid-template-columns: 1fr; gap: 20px; }
            .cursor-dot, .cursor-outline { display: none; }
            body { cursor: auto; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="main-nav">
        <img src="jjvidro.png" alt="Logo J&J" class="logo-img">
        <div id="auth-ui"></div>
    </nav>

    <div class="category-nav" id="cat-nav-list">
        <button class="cat-filter-btn active" onclick="filterCat('all')">Todos</button>
    </div>

    <main class="content-wrapper" id="main-content"></main>

    <footer>
        <div class="footer-content">
            <img src="jjvidro.png" alt="Logo J&J" style="height:60px; margin-bottom:20px; filter: brightness(0) invert(1);">
            <p style="font-size: 0.6rem; letter-spacing: 2px;">© 2026 J&J ART COLLECTION. DESIGNED FOR EXCLUSIVITY.</p>
        </div>
    </footer>

    <button id="cart-btn-floating" class="float-btn" onclick="openCartModal()">🛒 <div id="cart-badge">0</div></button>
    <button id="admin-btn" class="float-btn" onclick="openAdmin()" style="display:none !important">+</button>

    <div id="details-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <div id="details-body" class="modal-grid"></div>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content" style="max-width: 600px;">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <div style="display:flex; gap:10px; margin-bottom:25px;">
                <button class="cat-filter-btn active" id="tab-novo" onclick="switchAdminTab('novo')">Novo Item</button>
                <button class="cat-filter-btn" id="tab-dash" onclick="switchAdminTab('dash')">Pedidos ADM</button>
            </div>
            
            <div id="admin-create-section">
                <input type="text" id="p-category" class="edit-field" placeholder="Categoria (Ex: Vasos)">
                <input type="text" id="p-name" class="edit-field" placeholder="Nome do Item">
                <input type="text" id="p-price" class="edit-field" placeholder="Preço (Ex: 150.00)">
                <input type="text" id="p-colors" class="edit-field" placeholder="Cores (Ex: Ouro, Âmbar, Transparente)">
                <textarea id="p-desc" class="edit-field" placeholder="Breve história da peça"></textarea>
                <button class="card-btn-fix" onclick="saveToRTDB()" style="position:static; width:100%">PUBLICAR NO CATÁLOGO</button>
            </div>

            <div id="admin-dashboard-section" style="display:none">
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <input type="text" id="search-token" class="edit-field" placeholder="Pesquisar Token (Ex: jj1234)" style="margin-bottom:0">
                    <button class="cat-filter-btn" onclick="searchOrderByToken()">BUSCAR</button>
                </div>
                <div id="token-result-area"></div>
                <hr style="margin:20px 0; opacity:0.1">
                <div id="cashier-history"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), database = firebase.database();
        const provider = new firebase.auth.GoogleAuthProvider();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com", WPP_NUM = "5511998937643";
        
        let cart = JSON.parse(localStorage.getItem('jj_cart')) || [];
        let currentProduct = null;
        let selectedColor = "";

        window.onload = () => { updateCartBadge(); listenToProducts(); updateOrderHistory(); };

        auth.onAuthStateChanged(user => {
            const ui = document.getElementById('auth-ui');
            const btnAdmin = document.getElementById('admin-btn');
            if(user) {
                ui.innerHTML = `<span style="font-size:0.6rem; font-weight:700">${user.displayName.split(' ')[0]}</span> <button class="cat-filter-btn" onclick="auth.signOut()" style="padding:4px 10px; font-size:0.5rem; margin-left:5px">Sair</button>`;
                if(user.email === ADM_EMAIL) btnAdmin.style.setProperty('display', 'flex', 'important');
            } else {
                ui.innerHTML = `<button class="cat-filter-btn" onclick="auth.signInWithPopup(provider)">ENTRAR</button>`;
            }
        });

        function saveCart() { localStorage.setItem('jj_cart', JSON.stringify(cart)); updateCartBadge(); }
        function updateCartBadge() { 
            document.getElementById('cart-badge').innerText = cart.length; 
            document.getElementById('cart-btn-floating').style.display = cart.length > 0 ? 'flex' : 'none'; 
        }

        function listenToProducts() {
            database.ref('produtos').on('value', snap => {
                const data = snap.val();
                const main = document.getElementById('main-content');
                const nav = document.getElementById('cat-nav-list');
                main.innerHTML = "";
                nav.innerHTML = `<button class="cat-filter-btn active" onclick="filterCat('all')">Todos</button>`;
                if(!data) return;
                const products = Object.values(data);
                const categories = [...new Set(products.map(p => p.category))];
                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'cat-filter-btn'; btn.innerText = cat;
                    btn.onclick = (e) => filterCat(cat, e.target);
                    nav.appendChild(btn);

                    const section = document.createElement('div');
                    section.className = `cat-group cat-${cat.replace(/\s+/g, '-')}`;
                    section.innerHTML = `<h2 class="category-title">${cat}</h2><div class="carousel-container" id="cat-container-${cat.replace(/\s+/g, '-')}"></div>`;
                    main.appendChild(section);

                    products.filter(p => p.category === cat).forEach(p => {
                        const firstCol = p.colors ? p.colors.split(',')[0].trim() : "";
                        const img = (p.variants && p.variants[firstCol]) ? p.variants[firstCol].img : "jjvidro2.png";
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.onclick = () => openDetails(p);
                        card.innerHTML = `${auth.currentUser?.email === ADM_EMAIL ? `<button onclick="event.stopPropagation(); deleteProduct('${p.id}')" style="position:absolute; top:20px; right:20px; border:none; background:none; font-size:1.5rem; color:var(--jj-brown); z-index:20">&times;</button>` : ''}<div class="img-sculpt-frame"><img src="${img}"></div><h3>${p.name}</h3><div style="font-weight:700">R$ ${p.price}</div><button class="card-btn-fix">VER PEÇA</button>`;
                        document.getElementById(`cat-container-${cat.replace(/\s+/g, '-')}`).appendChild(card);
                    });
                });
            });
        }

        function openDetails(p) {
            currentProduct = p;
            const colors = p.colors ? p.colors.split(',').map(c => c.trim()) : [];
            selectedColor = colors[0];
            if(auth.currentUser?.email === ADM_EMAIL) renderAdminEditor(p, colors); else renderUserView(p, colors);
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
        }

        function renderUserView(p, colors) {
            const body = document.getElementById('details-body');
            const v = (p.variants && p.variants[selectedColor]) ? p.variants[selectedColor] : { img: "jjvidro2.png", stock: "" };
            body.innerHTML = `
                <div class="img-sculpt-frame" id="modal-img-frame"><img src="${v.img}"></div>
                <div>
                    <h2>${p.name}</h2><p style="font-size:0.75rem; margin:15px 0; opacity:0.8; line-height:1.4">${p.desc || ''}</p>
                    <label style="font-size:0.6rem; font-weight:700; color:var(--jj-brown)">CORES:</label>
                    <div class="color-dot-selector">${colors.map(c => `<div class="color-dot ${c === selectedColor ? 'active' : ''}" style="background:${translateColor(c)}" onclick="updateSelectedColor('${c}')"></div>`).join('')}</div>
                    <label style="font-size:0.6rem; font-weight:700; color:var(--jj-brown)">TAMANHO / MODELO:</label>
                    <select id="u-size" class="user-input">${(v.stock ? v.stock.split(',') : ['Padrão']).map(s => `<option value="${s.trim()}">${s.trim()}</option>`).join('')}</select>
                    <input type="number" id="u-qty" class="user-input" value="1" min="1">
                    <div style="font-size:1.6rem; font-weight:900; margin:10px 0">R$ ${p.price}</div>
                    <button class="card-btn-fix" style="position:static; width:100%" onclick="addToCart()">ADICIONAR</button>
                </div>`;
        }

        function renderAdminEditor(p, colors) {
            const body = document.getElementById('details-body');
            let variantEditor = colors.map(c => {
                const v = (p.variants && p.variants[c]) ? p.variants[c] : { img: "", stock: "" };
                return `<div style="background:rgba(0,0,0,0.03); padding:10px; border-radius:15px; margin-bottom:10px">
                    <small>COR: ${c}</small>
                    <input type="file" onchange="uploadImg('${p.id}', '${c}', this)" style="display:block; font-size:0.6rem; margin:5px 0">
                    <input type="text" class="edit-field v-stock" data-color="${c}" value="${v.stock || ''}" placeholder="Tamanhos (P, M, G)">
                </div>`;
            }).join('');
            body.innerHTML = `<div style="grid-column: 1/-1"><h3>EDITOR ADM</h3>
                <input type="text" id="e-cat" class="edit-field" value="${p.category}" placeholder="Categoria">
                <input type="text" id="e-name" class="edit-field" value="${p.name}" placeholder="Nome">
                <input type="text" id="e-price" class="edit-field" value="${p.price}" placeholder="Preço">
                <input type="text" id="e-colors" class="edit-field" value="${p.colors || ''}" placeholder="Cores (Ex: Ouro, Prata)">
                <textarea id="e-desc" class="edit-field" placeholder="Descrição">${p.desc || ''}</textarea>
                ${variantEditor}<button class="card-btn-fix" style="position:static; width:100%" onclick="updateProductAll('${p.id}')">SALVAR ALTERAÇÕES</button></div>`;
        }

        function updateProductAll(id) {
            const updates = { category: document.getElementById('e-cat').value, name: document.getElementById('e-name').value, price: document.getElementById('e-price').value, desc: document.getElementById('e-desc').value, colors: document.getElementById('e-colors').value };
            document.querySelectorAll('.v-stock').forEach(input => {
                const color = input.dataset.color;
                database.ref(`produtos/${id}/variants/${color}/stock`).set(input.value);
            });
            database.ref('produtos/'+id).update(updates).then(() => { closeModals(); });
        }

        function updateSelectedColor(color) {
            selectedColor = color;
            const v = (currentProduct.variants && currentProduct.variants[color]) ? currentProduct.variants[color] : { img: "jjvidro2.png", stock: "" };
            document.querySelector('#modal-img-frame img').src = v.img;
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            event.target.classList.add('active');
            const sizeSelect = document.getElementById('u-size');
            if(sizeSelect) sizeSelect.innerHTML = (v.stock ? v.stock.split(',') : ['Padrão']).map(s => `<option value="${s.trim()}">${s.trim()}</option>`).join('');
        }

        function searchOrderByToken() {
            const tk = document.getElementById('search-token').value.toLowerCase().trim();
            if(!tk) return;
            database.ref('pedidos/'+tk).once('value', snap => {
                const p = snap.val();
                const area = document.getElementById('token-result-area');
                if(p) {
                    area.innerHTML = `<div class="order-history-card" style="background:#fff9e6"><b>LOCALIZADO: #${p.token}</b><br>Cliente: ${p.cliente}<br>Total: R$ ${p.total}<br>Pagamento: ${p.pagamento}</div>`;
                } else {
                    area.innerHTML = `<p style="font-size:0.7rem; color:red">Token não encontrado.</p>`;
                }
            });
        }

        function finishOrder(total) {
            const user = document.getElementById('u-final-name').value;
            const pay = document.getElementById('u-pay').value;
            const type = document.getElementById('u-type').value;
            if(!user) return alert("Informe seu nome.");
            const token = "jj" + Math.floor(1000 + Math.random()*9000);
            const dataHora = new Date().toLocaleString();
            let msg = `*💎 J&J ART COLLECTION*\n*ID:* #${token}\n*CLIENTE:* ${user.toUpperCase()}\n--------------------\n`;
            cart.forEach(i => msg += `📦 *${i.qty}x ${i.name}*\n   ${i.color} | ${i.size}\n   Sub: R$ ${(i.price*i.qty).toFixed(2)}\n\n`);
            msg += `--------------------\n*PAGAMENTO:* ${pay}\n*ATENDIMENTO:* ${type}\n*TOTAL: R$ ${total.toFixed(2)}*\n--------------------\n_Gerado no Totem J&J._`;
            database.ref('pedidos/'+token).set({ token, cliente: user, total: total.toFixed(2), pagamento: pay, tipo: type, itens: cart, data: dataHora }).then(() => {
                cart = []; saveCart(); window.open(`https://wa.me/${WPP_NUM}?text=${encodeURIComponent(msg)}`); closeModals();
            });
        }

        function updateOrderHistory() {
            database.ref('pedidos').on('value', snap => {
                const pedidos = snap.val();
                let html = "";
                if(pedidos) Object.values(pedidos).reverse().forEach(p => {
                    html += `<div class="order-history-card"><div style="display:flex; justify-content:space-between; margin-bottom:5px"><b>#${p.token}</b><span>R$ ${p.total}</span></div><b>${p.cliente}</b><br><small>${p.pagamento} | ${p.tipo}</small><br><div style="margin-top:5px; opacity:0.6; font-size:0.6rem">${p.data}</div></div>`;
                });
                document.getElementById('cashier-history').innerHTML = html || "Sem pedidos.";
            });
        }

        function translateColor(c) {
            const map = { "Ouro": "#FFD700", "Prata": "#C0C0C0", "Preto": "#1a1a1a", "Transparente": "radial-gradient(circle, #fff 0%, #e2e2e2 100%)", "Âmbar": "#FFBF00", "Azul": "#0047AB", "Vermelho": "#C41E3A", "Verde": "#2E8B57" };
            return map[c] || "#ccc";
        }
        function addToCart() { cart.push({ name: currentProduct.name, price: parseFloat(currentProduct.price), color: selectedColor, size: document.getElementById('u-size').value, qty: parseInt(document.getElementById('u-qty').value) }); saveCart(); closeModals(); }
        function openCartModal() {
            let total = 0, list = cart.map(i => { total += (i.price * i.qty); return `<div style="padding:10px 0; border-bottom:1px solid #eee; font-size:0.7rem"><b>${i.qty}x ${i.name}</b> (${i.color}) - R$ ${(i.price*i.qty).toFixed(2)}</div>` }).join('');
            document.getElementById('details-body').innerHTML = `<div style="grid-column: 1/-1"><h2>MEU PEDIDO</h2><div style="background:rgba(0,0,0,0.02); padding:15px; border-radius:20px; margin-bottom:15px">${list}</div><input type="text" id="u-final-name" class="user-input" placeholder="Seu Nome"><select id="u-pay" class="user-input"><option value="Pix">Pix</option><option value="Cartão">Cartão</option><option value="Dinheiro">Dinheiro</option></select><select id="u-type" class="user-input"><option value="Totem">Retirada Local</option><option value="Entrega">Entrega a combinar</option></select><div style="background:var(--jj-yellow-main); padding:20px; border-radius:20px; text-align:center; font-weight:900; font-size:1.5rem">TOTAL: R$ ${total.toFixed(2)}</div><button class="card-btn-fix" style="position:static; width:100%; margin-top:15px" onclick="finishOrder(${total})">CONFIRMAR</button></div>`;
            document.getElementById('details-modal').style.display = 'flex'; setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
        }
        function filterCat(cat, target) { document.querySelectorAll('.cat-filter-btn').forEach(b => b.classList.remove('active')); if(target) target.classList.add('active'); document.querySelectorAll('.cat-group').forEach(g => g.style.display = (cat === 'all' || g.classList.contains('cat-'+cat.replace(/\s+/g, '-'))) ? 'block' : 'none'); }
        function saveToRTDB() { const n = document.getElementById('p-name').value; if(!n) return; const ref = database.ref('produtos').push(); ref.set({ id: ref.key, category: document.getElementById('p-category').value, name: n, price: document.getElementById('p-price').value, colors: document.getElementById('p-colors').value, desc: document.getElementById('p-desc').value }).then(() => { closeModals(); }); }
        function uploadImg(pid, color, input) { const file = input.files[0]; const reader = new FileReader(); reader.onload = (e) => { database.ref(`produtos/${pid}/variants/${color}/img`).set(e.target.result); alert("Foto Ok!"); }; reader.readAsDataURL(file); }
        function switchAdminTab(t) { document.getElementById('admin-create-section').style.display = t === 'novo' ? 'block' : 'none'; document.getElementById('admin-dashboard-section').style.display = t === 'dash' ? 'block' : 'none'; document.getElementById('tab-novo').classList.toggle('active', t==='novo'); document.getElementById('tab-dash').classList.toggle('active', t==='dash'); }
        function closeModals() { document.querySelectorAll('.modal').forEach(m => { m.classList.remove('active'); setTimeout(()=>m.style.display='none', 400); }); }
        function deleteProduct(id) { if(confirm("Apagar?")) database.ref('produtos/'+id).remove(); }
        function openAdmin() { document.getElementById('admin-modal').style.display='flex'; setTimeout(()=>document.getElementById('admin-modal').classList.add('active'), 10); }

        if(window.innerWidth > 768) {
            const dot = document.querySelector('.cursor-dot'), out = document.querySelector('.cursor-outline');
            window.onmousemove = (e) => { dot.style.left = e.clientX+'px'; dot.style.top = e.clientY+'px'; out.style.left = (e.clientX-16)+'px'; out.style.top = (e.clientY-16)+'px'; };
        }
    </script>
</body>
</html>
