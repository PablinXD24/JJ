<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Painel Administrativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--jj-bg); 
            font-family: var(--font-sans); 
            color: var(--jj-text); 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Barra de Navegação Superior (Mantendo o estilo do index original) */
        .admin-nav { 
            padding: 10px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(248, 249, 250, 0.9); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(0,0,0,0.05);
            z-index: 100;
        }

        .logo-img { height: 40px; width: auto; }

        .menu-options { display: flex; gap: 15px; }

        /* Botões seguindo o estilo Neumorphism dos originais */
        .nav-btn { 
            padding: 8px 18px; 
            border-radius: 12px; 
            border: none; 
            background: var(--jj-bg); 
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); 
            font-size: 0.65rem; 
            font-weight: 700; 
            color: var(--jj-brown); 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.3s; 
        }

        .nav-btn.active { 
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); 
            color: var(--jj-yellow-main); 
        }

        /* Container do Iframe (O Palco) */
        #content-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: var(--jj-bg);
        }

        @media (max-width: 768px) {
            .admin-nav { flex-direction: column; gap: 10px; padding: 15px; }
            .nav-btn { font-size: 0.6rem; padding: 8px 12px; }
        }
    </style>
</head>
<body>

    <nav class="admin-nav">
        <img src="jjvidro.png" alt="Logo J&J" class="logo-img">
        <div class="menu-options">
            <button class="nav-btn active" onclick="navigate('index (23).html', this)">Loja</button>
            <button class="nav-btn" onclick="navigate('dash (2).html', this)">Dashboard</button>
            <button class="nav-btn" onclick="navigate('caixa (5).html', this)">Caixa</button>
        </div>
    </nav>

    <iframe id="content-frame" src="index (23).html"></iframe>

    <script>
        function navigate(url, btn) {
            // Atualiza o SRC do iframe
            document.getElementById('content-frame').src = url;

            // Gerencia a classe ativa nos botões
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // Listener para garantir que links internos que tentem sair do iframe sejam contidos (opcional)
        window.addEventListener('message', function(e) {
            // Lógica para comunicação entre arquivos se necessário no futuro
        });
    </script>
</body>
</html>
