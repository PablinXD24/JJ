<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Executive Global Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.35);
            --shadow-light: rgba(255, 255, 255, 0.85);
            --font-sans: 'Montserrat', sans-serif;
            --success: #2ecc71;
            --warning: #f1c40f;
            --danger: #e74c3c;
            --info: #3498db;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); padding-bottom: 50px; }

        #login-screen { position: fixed; inset: 0; background: var(--jj-bg); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--jj-bg); padding: 50px; border-radius: 50px; box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light); text-align: center; }

        #dash-content { display: none; padding: 30px 5%; opacity: 0; transition: opacity 0.5s; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }

        .card-jj { 
            background: rgba(248, 249, 250, 0.8); backdrop-filter: blur(10px);
            padding: 25px; border-radius: 35px; 
            box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
            margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.3);
        }

        .kpi-card { padding: 20px; text-align: center; }
        .kpi-value { font-size: 1.2rem; font-weight: 700; color: var(--jj-brown); display: block; margin-top: 5px; }
        .kpi-label { font-size: 0.55rem; font-weight: 800; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }

        .section-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--jj-brown); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ''; width: 4px; height: 15px; background: var(--jj-yellow-main); border-radius: 2px; }

        .bar-bg { height: 12px; background: #e0e5ec; border-radius: 20px; box-shadow: inset 3px 3px 6px var(--shadow-dark); overflow: hidden; margin: 15px 0; }
        .bar-fill { height: 100%; width: 0%; background: var(--jj-brown); transition: 1.5s ease-in-out; }

        .edit-field {
            width: 100%; border: none; background: transparent; padding: 6px; font-family: inherit; font-size: 0.75rem;
            border-bottom: 1px solid transparent; transition: 0.3s; outline: none;
        }
        .edit-field:focus { border-bottom: 1px solid var(--jj-yellow-main); }

        .status-select {
            padding: 4px 8px; border-radius: 8px; border: none; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; cursor: pointer;
        }
        .st-orcamento { background: #eee; color: #666; }
        .st-producao { background: var(--info); color: white; }
        .st-finalizado { background: var(--success); color: white; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; font-size: 0.6rem; color: var(--jj-brown); opacity: 0.7; }
        td { padding: 10px 12px; border-top: 1px solid rgba(0,0,0,0.03); font-size: 0.8rem; }

        .btn-jj { padding: 12px 25px; border-radius: 15px; border: none; background: var(--jj-yellow-main); font-weight: 700; cursor: pointer; }
        
        .low-stock { color: var(--danger); font-weight: 800; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        #notification-toast {
            position: fixed; bottom: 30px; right: 30px; z-index: 11000;
            background: var(--jj-bg); padding: 20px 30px; border-radius: 25px;
            box-shadow: 10px 10px 20px var(--shadow-dark); display: none;
        }

        code { background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.7rem; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <img src="jjvidro.png" style="height: 50px; margin-bottom: 25px;">
            <button class="btn-jj" onclick="login()">ACESSAR GESTÃO J&J</button>
        </div>
    </div>

    <div id="dash-content">
        <header class="header">
            <img src="jjvidro.png" style="height: 40px;">
            <div style="text-align: right">
                <p id="adm-user" style="font-size: 0.8rem; font-weight: 700; color: var(--jj-brown);"></p>
                <p style="font-size: 0.5rem; letter-spacing: 1px;">CHIEF EXECUTIVE OFFICER</p>
            </div>
        </header>

        <div class="kpi-grid">
            <div class="card-jj kpi-card">
                <span class="kpi-label">Faturamento Total</span>
                <span id="kpi-total" class="kpi-value">R$ 0,00</span>
            </div>
            <div class="card-jj kpi-card">
                <span class="kpi-label">Ticket Médio</span>
                <span id="kpi-ticket" class="kpi-value">R$ 0,00</span>
            </div>
            <div class="card-jj kpi-card">
                <span class="kpi-label">Em Produção</span>
                <span id="kpi-prod" class="kpi-value">0</span>
            </div>
            <div class="card-jj kpi-card">
                <span class="kpi-label">Melhor Cliente</span>
                <span id="kpi-top-client" class="kpi-value">---</span>
            </div>
        </div>

        <div class="card-jj">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 class="section-title" style="margin:0">Meta de Expansão</h3>
                <input type="number" id="meta-val" style="background:transparent; border:none; border-bottom:1px solid var(--jj-yellow-main); width:80px; text-align:right; font-weight:700;" onchange="salvarMeta(this.value)">
            </div>
            <div class="bar-bg"><div id="meta-bar" class="bar-fill"></div></div>
            <p id="txt-status-meta" style="font-size: 0.65rem; font-weight: 700; text-align: right;"></p>
        </div>

        <div class="card-jj">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <h3 class="section-title">Controle de Pedidos & Fluxo</h3>
                <input type="text" id="pedido-search" placeholder="🔍 Buscar cliente..." oninput="filtrarPedidos()" style="border:none; background:rgba(0,0,0,0.05); padding:5px 15px; border-radius:10px; font-size:0.7rem;">
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Token</th>
                            <th>Cliente</th>
                            <th>Valor (R$)</th>
                            <th>Status de Gestão</th>
                            <th>Prazo / Data</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-pedidos">
                        <tr><td colspan="6" style="text-align:center; padding:20px; opacity:0.5;">Carregando dados...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card-jj">
            <h3 class="section-title">Estoque Crítico de Insumos</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr><th>Insumo</th><th>Preço</th><th>Qtd Atual</th><th>Status</th></tr>
                    </thead>
                    <tbody id="lista-produtos"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="notification-toast"><p id="notif-msg"></p></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), database = firebase.database();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";
        let metaGlobal = 15000, allPedidos = {}, debounceTimer;

        function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }

        auth.onAuthStateChanged(user => {
            if(user && user.email === ADM_EMAIL) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dash-content').style.display = 'block';
                setTimeout(() => document.getElementById('dash-content').style.opacity = '1', 100);
                document.getElementById('adm-user').innerText = user.displayName;
                iniciarEscutas();
            } else if (user) {
                alert("Acesso negado.");
                auth.signOut();
            }
        });

        function iniciarEscutas() {
            database.ref('configuracoes/meta').on('value', snap => {
                metaGlobal = parseFloat(snap.val()) || 15000;
                document.getElementById('meta-val').value = metaGlobal;
                recalcularGestao();
            });

            database.ref('pedidos').on('value', snap => {
                const data = snap.val();
                allPedidos = data ? data : {};
                renderPedidos(Object.values(allPedidos));
                recalcularGestao();
            }, error => {
                console.error("Erro ao ler pedidos:", error);
                document.getElementById('lista-pedidos').innerHTML = `<tr><td colspan="6" style="color:red; text-align:center">Erro de Permissão no Firebase</td></tr>`;
            });

            database.ref('produtos').on('value', snap => renderProdutos(snap.val() || {}));
        }

        function renderPedidos(pedidosArray) {
            if(!pedidosArray || pedidosArray.length === 0) {
                document.getElementById('lista-pedidos').innerHTML = `<tr><td colspan="6" style="text-align:center; padding:20px; opacity:0.5;">Nenhum pedido encontrado no banco.</td></tr>`;
                return;
            }

            const html = [...pedidosArray].reverse().map(p => {
                const token = p.token || 'N/A';
                const status = p.status || 'orcamento';
                return `
                <tr>
                    <td><code>${token}</code></td>
                    <td><input class="edit-field" style="font-weight:700" value="${p.cliente || ''}" oninput="updateDB('pedidos/${token}', 'cliente', this)"></td>
                    <td><input class="edit-field" value="${p.total || 0}" oninput="updateDB('pedidos/${token}', 'total', this, true)"></td>
                    <td>
                        <select class="status-select ${getStatusClass(status)}" onchange="updateDB('pedidos/${token}', 'status', this)">
                            <option value="orcamento" ${status==='orcamento'?'selected':''}>Orçamento</option>
                            <option value="producao" ${status==='producao'?'selected':''}>Produção</option>
                            <option value="finalizado" ${status==='finalizado'?'selected':''}>Finalizado</option>
                        </select>
                    </td>
                    <td><input type="date" class="edit-field" value="${p.data || ''}" oninput="updateDB('pedidos/${token}', 'data', this)"></td>
                    <td><button onclick="remover('pedidos/${token}')" style="border:none; background:none; cursor:pointer">🗑️</button></td>
                </tr>
            `}).join('');
            document.getElementById('lista-pedidos').innerHTML = html;
        }

        function getStatusClass(st) {
            if(st === 'producao') return 'st-producao';
            if(st === 'finalizado') return 'st-finalizado';
            return 'st-orcamento';
        }

        function recalcularGestao() {
            const arr = Object.values(allPedidos);
            if(arr.length === 0) return;

            const total = arr.reduce((acc, p) => acc + (parseFloat(p.total) || 0), 0);
            const emProducao = arr.filter(p => p.status === 'producao').length;
            const ticket = arr.length > 0 ? (total / arr.length) : 0;
            const perc = metaGlobal > 0 ? Math.floor((total / metaGlobal) * 100) : 0;

            const ranking = {};
            arr.forEach(p => { 
                if(p.cliente) ranking[p.cliente] = (ranking[p.cliente] || 0) + (parseFloat(p.total) || 0); 
            });
            const clients = Object.keys(ranking);
            const topClient = clients.length > 0 ? clients.reduce((a, b) => ranking[a] > ranking[b] ? a : b) : '---';

            document.getElementById('kpi-total').innerText = `R$ ${total.toLocaleString('pt-BR', {minimumFractionDigits:2})}`;
            document.getElementById('kpi-ticket').innerText = `R$ ${ticket.toLocaleString('pt-BR', {maximumFractionDigits:0})}`;
            document.getElementById('kpi-prod').innerText = emProducao;
            document.getElementById('kpi-top-client').innerText = topClient.substring(0, 12);
            
            const bar = document.getElementById('meta-bar');
            bar.style.width = Math.min(perc, 100) + "%";
            document.getElementById('txt-status-meta').innerText = `${perc}% CONCLUÍDO`;
            bar.style.background = perc > 80 ? 'var(--success)' : (perc > 40 ? 'var(--jj-yellow-main)' : 'var(--danger)');
        }

        function updateDB(path, key, element, isNum = false) {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                let val = isNum ? (parseFloat(element.value.replace(',', '.')) || 0) : element.value;
                database.ref(path).update({ [key]: val }).catch(e => console.error("Erro ao atualizar:", e));
            }, 600);
        }

        function renderProdutos(data) {
            const html = Object.entries(data).map(([id, p]) => {
                const isLow = (p.stock || 0) < 5;
                return `
                <tr>
                    <td>${p.name || 'Sem nome'}</td>
                    <td>R$ ${p.price || 0}</td>
                    <td><input class="edit-field ${isLow?'low-stock':''}" type="number" value="${p.stock || 0}" oninput="updateDB('produtos/${id}', 'stock', this, true)"></td>
                    <td><span class="${isLow?'low-stock':''}">${isLow ? '⚠️ REPOR' : 'OK'}</span></td>
                </tr>`;
            }).join('');
            document.getElementById('lista-produtos').innerHTML = html;
        }

        function filtrarPedidos() {
            const t = document.getElementById('pedido-search').value.toLowerCase();
            const filtrados = Object.values(allPedidos).filter(p => (p.cliente || "").toLowerCase().includes(t));
            renderPedidos(filtrados);
        }

        function salvarMeta(v) { database.ref('configuracoes/meta').set(parseFloat(v) || 0); }
        function remover(path) { if(confirm("Remover permanentemente?")) database.ref(path).remove(); }
    </script>
</body>
</html>
