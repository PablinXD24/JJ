<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Art Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow-light: #FFF4AC;
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); overflow-x: hidden; cursor: none; }

        /* Cursor */
        .cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--jj-yellow-main); border-radius: 50%; z-index: 10000; pointer-events: none; }
        .cursor-outline { position: fixed; width: 40px; height: 40px; border: 2px solid var(--jj-yellow-main); border-radius: 50%; z-index: 9999; pointer-events: none; transition: 0.1s; }

        /* Navbar */
        .main-nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background: rgba(248, 249, 250, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .logo-img { height: 55px; width: auto; object-fit: contain; }

        /* Botão Carrinho */
        #cart-trigger { position: fixed; bottom: 30px; left: 30px; width: 65px; height: 65px; border-radius: 50%; background: var(--jj-bg); box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light); display: flex; align-items: center; justify-content: center; z-index: 1500; cursor: pointer; border: none; font-size: 24px; }
        #cart-count { position: absolute; top: 0; right: 0; background: var(--jj-yellow-main); font-size: 0.7rem; font-weight: 700; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        .content-wrapper { padding: 20px 0 60px 0; min-height: 80vh; }
        .category-title { margin-left: 5%; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; color: var(--jj-brown); }
        .carousel-container { display: flex; gap: 30px; overflow-x: auto; padding: 20px 5% 40px 5%; scrollbar-width: none; }
        .carousel-container::-webkit-scrollbar { display: none; }

        /* Card */
        .product-card {
            flex: 0 0 300px; background: var(--jj-bg); padding: 25px; padding-bottom: 85px; border-radius: 45px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            transition: 0.4s; cursor: pointer; position: relative; min-height: 540px;
        }
        
        .img-sculpt-frame {
            background: var(--jj-bg); height: 260px; border-radius: 35px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
            position: relative; overflow: hidden; margin-bottom: 20px;
        }
        .glass-inner-border { position: absolute; inset: 15px; border-radius: 25px; border: 1px solid rgba(255, 200, 0, 0.2); background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(4px); z-index: 1; }
        .img-sculpt-frame img { max-width: 85%; max-height: 85%; object-fit: contain; z-index: 2; position: relative; }

        .size-pills { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .size-pill { font-size: 0.6rem; padding: 5px 10px; border-radius: 10px; background: var(--jj-bg); color: var(--jj-brown); font-weight: 700; box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light); }

        .card-btn-fix {
            position: absolute; bottom: 25px; left: 25px; right: 25px;
            background: var(--jj-yellow-main); color: #1a1a1a; border: none; padding: 15px; border-radius: 20px;
            font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: 0.3s;
            box-shadow: 5px 5px 15px rgba(255, 200, 0, 0.3); font-family: var(--font-sans); text-transform: uppercase;
        }

        .jj-btn-ghost { background: var(--jj-bg); border: none; padding: 10px 20px; border-radius: 15px; box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light); font-weight: 700; font-size: 0.65rem; cursor: pointer; color: var(--jj-brown); }
        .edit-field, .user-input { width: 100%; background: var(--jj-bg); border: none; padding: 12px 15px; border-radius: 18px; box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); margin-bottom: 12px; font-family: var(--font-sans); outline: none; font-size: 0.85rem; }

        /* Modals */
        .modal { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(12px); }
        .modal-content { 
            background: var(--jj-bg); width: 100%; max-width: 850px; max-height: 90vh; border-radius: 50px; 
            position: relative; z-index: 2100; padding: 45px; overflow-y: auto; 
            box-shadow: 25px 25px 50px rgba(0,0,0,0.2); transition: 0.4s; transform: translateY(40px); opacity: 0;
        }
        .modal.active .modal-content { transform: translateY(0); opacity: 1; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .close-btn { position: absolute; top: 25px; right: 25px; background: none; border: none; font-size: 2.2rem; cursor: pointer; color: var(--jj-brown); z-index: 2200; }

        /* Item no Carrinho */
        .cart-item { display: flex; align-items: center; gap: 15px; padding: 15px; background: var(--jj-bg); border-radius: 25px; box-shadow: 5px 5px 15px var(--shadow-dark); margin-bottom: 15px; position: relative; }
        .cart-item img { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; }
        .cart-item-info h4 { font-size: 0.8rem; color: var(--jj-brown); }
        .cart-item-info p { font-size: 0.7rem; opacity: 0.7; }
        .remove-cart { position: absolute; top: 10px; right: 10px; border: none; background: none; color: var(--jj-brown); cursor: pointer; font-size: 1.2rem; }

        /* Admin Btn */
        #admin-btn { display: none; position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; border-radius: 50%; z-index: 1500; font-size: 32px; border: none; background: var(--jj-yellow-main); cursor: pointer; }

        @media (max-width: 768px) {
            .modal { align-items: flex-end; padding: 0; }
            .modal-content { max-height: 95vh; border-radius: 40px 40px 0 0; padding: 50px 20px 30px 20px; transform: translateY(100%); }
            .modal.active .modal-content { transform: translateY(0); }
            .modal-grid { grid-template-columns: 1fr; gap: 20px; }
            .cursor-dot, .cursor-outline { display: none; }
            body { cursor: auto; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="main-nav">
        <img src="j&j vidro.png" alt="J&J Logo" class="logo-img">
        <div id="auth-ui"><button class="jj-btn-ghost" onclick="loginGoogle()">ENTRAR</button></div>
    </nav>

    <main class="content-wrapper" id="main-content"></main>

    <button id="cart-trigger" onclick="openCart()">
        🛒 <div id="cart-count">0</div>
    </button>

    <div id="details-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <div id="details-body" class="modal-grid"></div>
        </div>
    </div>

    <div id="cart-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content" style="max-width: 500px;">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <h2 style="color:var(--jj-brown); margin-bottom:20px; font-size:1.1rem; text-transform:uppercase;">Seus Interesses</h2>
            <div id="cart-items-list" style="margin-bottom:20px;"></div>
            <div id="cart-footer" style="display:none">
                <input type="text" id="cart-user-name" class="user-input" placeholder="Seu Nome Completo">
                <select id="cart-user-pay" class="user-input">
                    <option value="Pix">Pagamento: Pix</option>
                    <option value="Cartão">Pagamento: Cartão</option>
                </select>
                <button class="card-btn-fix" style="position:static; width:100%; margin-top:10px" onclick="checkoutWhatsApp()">FINALIZAR PEDIDO NO WHATSAPP</button>
            </div>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content" style="max-width: 500px;">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <h2 style="color:var(--jj-brown); margin-bottom:20px; font-size:1.1rem;">CADASTRAR ITEM</h2>
            <input type="text" id="p-category" class="edit-field" placeholder="Categoria">
            <input type="text" id="p-name" class="edit-field" placeholder="Nome">
            <input type="text" id="p-price" class="edit-field" placeholder="Preço (Apenas números, ex: 150.00)">
            <textarea id="p-sizes" class="edit-field" placeholder="Tamanhos (P, M, G)"></textarea>
            <input type="text" id="p-colors" class="edit-field" placeholder="Cores (Preto, Azul)">
            <input type="file" id="p-file" class="edit-field" onchange="handleFileSelect(this, 'p-img-preview')">
            <img id="p-img-preview" style="width:60px; display:none; margin-bottom:10px;">
            <textarea id="p-desc" class="edit-field" placeholder="Descrição..." rows="2"></textarea>
            <button class="card-btn-fix" onclick="saveToRTDB()" style="position:static; width:100%">SALVAR</button>
        </div>
    </div>

    <button id="admin-btn" onclick="openAdmin()">+</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";
        
        let cart = [];
        let tempBase64 = "";

        function loginGoogle() { auth.signInWithPopup(provider); }
        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            const authUI = document.getElementById('auth-ui');
            if (user) {
                authUI.innerHTML = `<span style="font-size:0.7rem;">${user.displayName}</span> <button class="jj-btn-ghost" onclick="logout()">SAIR</button>`;
                if (user.email === ADM_EMAIL) document.getElementById('admin-btn').style.display = 'block';
            } else {
                authUI.innerHTML = `<button class="jj-btn-ghost" onclick="loginGoogle()">ENTRAR</button>`;
            }
            listenToProducts();
        });

        function handleFileSelect(input, previewId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    tempBase64 = e.target.result;
                    document.getElementById(previewId).src = tempBase64;
                    document.getElementById(previewId).style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function saveToRTDB() {
            const id = database.ref('produtos').push().key;
            const data = {
                id,
                category: document.getElementById('p-category').value || "Geral",
                name: document.getElementById('p-name').value,
                price: document.getElementById('p-price').value,
                sizes: document.getElementById('p-sizes').value,
                colors: document.getElementById('p-colors').value,
                desc: document.getElementById('p-desc').value,
                img: tempBase64
            };
            database.ref('produtos/' + id).set(data).then(closeModals);
        }

        function listenToProducts() {
            database.ref('produtos').on('value', snapshot => {
                const content = document.getElementById('main-content');
                content.innerHTML = "";
                const data = snapshot.val();
                if (data) {
                    const products = Object.values(data);
                    const cats = [...new Set(products.map(p => p.category))];
                    cats.forEach(cat => {
                        const section = document.createElement('div');
                        section.innerHTML = `<h2 class="category-title">${cat}</h2><div class="carousel-container" id="cat-${cat}"></div>`;
                        content.appendChild(section);
                        products.filter(p => p.category === cat).forEach(p => {
                            const card = document.createElement('div');
                            card.className = 'product-card';
                            card.onclick = () => openDetails(p);
                            card.innerHTML = `
                                ${auth.currentUser?.email === ADM_EMAIL ? `<button onclick="event.stopPropagation(); deleteProduct('${p.id}')" class="remove-cart" style="right:20px; top:20px">&times;</button>` : ''}
                                <div class="img-sculpt-frame"><div class="glass-inner-border"></div><img src="${p.img}"></div>
                                <h3>${p.name}</h3><p class="price">R$ ${p.price}</p>
                                <button class="card-btn-fix">VER DETALHES</button>
                            `;
                            document.getElementById(`cat-${cat}`).appendChild(card);
                        });
                    });
                }
            });
        }

        function openDetails(p) {
            const body = document.getElementById('details-body');
            const isAdm = auth.currentUser?.email === ADM_EMAIL;
            if (isAdm) {
                body.innerHTML = `
                    <div class="img-sculpt-frame"><img src="${p.img}" id="e-img"></div>
                    <div>
                        <input type="text" id="e-name" class="edit-field" value="${p.name}">
                        <input type="text" id="e-price" class="edit-field" value="${p.price}">
                        <textarea id="e-sizes" class="edit-field">${p.sizes || ''}</textarea>
                        <textarea id="e-colors" class="edit-field">${p.colors || ''}</textarea>
                        <textarea id="e-desc" class="edit-field">${p.desc || ''}</textarea>
                        <button class="card-btn-fix" style="position:static; width:100%" onclick="updateProduct('${p.id}', '${p.img}')">SALVAR</button>
                    </div>`;
            } else {
                body.innerHTML = `
                    <div class="img-sculpt-frame"><img src="${p.img}"></div>
                    <div>
                        <h2 style="color:var(--jj-brown); margin-bottom:10px">${p.name}</h2>
                        <p style="font-size:0.8rem; margin-bottom:15px">${p.desc}</p>
                        <select id="u-size" class="user-input">${p.sizes.split(',').map(s=>`<option>${s.trim()}</option>`)}</select>
                        <select id="u-color" class="user-input">${p.colors.split(',').map(c=>`<option>${c.trim()}</option>`)}</select>
                        <input type="number" id="u-qty" class="user-input" value="1" min="1">
                        <button class="card-btn-fix" style="position:static; width:100%; margin-top:10px" onclick="addToCart('${p.id}', '${p.name}', '${p.price}', '${p.img}')">ADICIONAR AO CARRINHO</button>
                    </div>`;
            }
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
        }

        function addToCart(id, name, price, img) {
            const size = document.getElementById('u-size').value;
            const color = document.getElementById('u-color').value;
            const qty = document.getElementById('u-qty').value;
            cart.push({ id, name, price, img, size, color, qty });
            updateCartUI();
            closeModals();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const list = document.getElementById('cart-items-list');
            list.innerHTML = "";
            if(cart.length === 0) {
                list.innerHTML = "<p style='text-align:center; opacity:0.5'>Carrinho vazio</p>";
                document.getElementById('cart-footer').style.display = 'none';
            } else {
                cart.forEach((item, index) => {
                    list.innerHTML += `
                        <div class="cart-item">
                            <img src="${item.img}">
                            <div class="cart-item-info">
                                <h4>${item.name}</h4>
                                <p>${item.size} | ${item.color} | Qtd: ${item.qty}</p>
                                <p><strong>R$ ${item.price}</strong></p>
                            </div>
                            <button class="remove-cart" onclick="removeFromCart(${index})">&times;</button>
                        </div>`;
                });
                document.getElementById('cart-footer').style.display = 'block';
            }
        }

        function removeFromCart(index) { cart.splice(index, 1); updateCartUI(); }

        function checkoutWhatsApp() {
            const userName = document.getElementById('cart-user-name').value;
            const pay = document.getElementById('cart-user-pay').value;
            if(!userName) return alert("Diga-nos seu nome!");

            let total = 0;
            let itemsMsg = "";
            cart.forEach(i => {
                itemsMsg += `- ${i.name} (${i.size}/${i.color}) x${i.qty}: R$ ${i.price}%0A`;
                total += parseFloat(i.price) * parseInt(i.qty);
            });

            const finalMsg = `Olá J&J! Me chamo ${userName}.%0A%0A*MEU PEDIDO:*%0A${itemsMsg}%0A*TOTAL: R$ ${total.toFixed(2)}*%0AForma de Pagamento: ${pay}`;
            window.open(`https://wa.me/5511999999999?text=${finalMsg}`, '_blank');
        }

        function updateProduct(id, oldImg) {
            const data = {
                name: document.getElementById('e-name').value,
                price: document.getElementById('e-price').value,
                sizes: document.getElementById('e-sizes').value,
                colors: document.getElementById('e-colors').value,
                desc: document.getElementById('e-desc').value,
                img: tempBase64 || oldImg
            };
            database.ref('produtos/' + id).update(data).then(closeModals);
        }

        function openCart() { document.getElementById('cart-modal').style.display='flex'; setTimeout(()=>document.getElementById('cart-modal').classList.add('active'),10); }
        function openAdmin() { document.getElementById('admin-modal').style.display='flex'; setTimeout(()=>document.getElementById('admin-modal').classList.add('active'),10); }
        function deleteProduct(id) { if(confirm("Apagar?")) database.ref('produtos/'+id).remove(); }
        function closeModals() { document.querySelectorAll('.modal').forEach(m=>{m.classList.remove('active'); setTimeout(()=>m.style.display='none',400);}); tempBase64=""; }

        if (window.innerWidth > 768) {
            const dot = document.querySelector('.cursor-dot'), outline = document.querySelector('.cursor-outline');
            window.onmousemove = (e) => { dot.style.left = outline.style.left = e.clientX + 'px'; dot.style.top = outline.style.top = e.clientY + 'px'; };
        }
    </script>
</body>
</html>
