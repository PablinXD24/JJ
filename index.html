<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Art Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); overflow-x: hidden; }

        .cursor-dot, .cursor-outline { position: fixed; pointer-events: none; z-index: 9999; border-radius: 50%; opacity: 0; transition: opacity 0.3s; }
        .cursor-dot { width: 8px; height: 8px; background: var(--jj-brown); }
        .cursor-outline { width: 32px; height: 32px; border: 2px solid var(--jj-brown); transition: transform 0.15s ease-out; }

        nav { padding: 30px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(248,249,250,0.8); backdrop-filter: blur(15px); z-index: 1000; }
        .logo { height: 45px; cursor: pointer; filter: drop-shadow(2px 2px 4px var(--shadow-dark)); }
        
        .cat-nav { overflow-x: auto; white-space: nowrap; padding: 15px 5%; scrollbar-width: none; -ms-overflow-style: none; }
        .cat-nav::-webkit-scrollbar { display: none; }
        .cat-filter-btn { 
            background: var(--jj-bg); border: none; padding: 12px 25px; border-radius: 30px; 
            margin-right: 15px; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; 
            letter-spacing: 1px; color: var(--jj-brown); cursor: pointer;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            transition: 0.3s;
        }
        .cat-filter-btn.active { box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light); color: var(--jj-yellow-main); }

        .category-title { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 4px; color: var(--jj-brown); margin: 40px 5% 20px; display: flex; align-items: center; gap: 15px; }
        .category-title::after { content: ''; height: 2px; flex-grow: 1; background: linear-gradient(90deg, var(--jj-yellow-main), transparent); }

        .carousel-container { display: flex; gap: 25px; overflow-x: auto; padding: 20px 5% 40px; scrollbar-width: none; scroll-snap-type: x mandatory; }
        .carousel-container::-webkit-scrollbar { display: none; }

        .product-card { 
            min-width: 280px; background: var(--jj-bg); padding: 25px; border-radius: 45px; 
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; scroll-snap-align: start;
            position: relative; border: 1px solid rgba(255,255,255,0.2);
        }
        .product-card:hover { transform: translateY(-10px) scale(1.02); }
        .img-sculpt-frame { 
            width: 100%; aspect-ratio: 1; border-radius: 35px; overflow: hidden; margin-bottom: 20px; 
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
            display: flex; align-items: center; justify-content: center; background: #fff;
        }
        .img-sculpt-frame img { width: 90%; height: 90%; object-fit: contain; filter: drop-shadow(10px 10px 20px rgba(0,0,0,0.15)); }

        .product-card h3 { font-size: 1rem; font-weight: 700; color: var(--jj-brown); margin-bottom: 5px; }
        .card-btn-fix { 
            margin-top: 15px; width: 100%; padding: 12px; border: none; border-radius: 20px; 
            background: var(--jj-brown); color: #fff; font-weight: 800; font-size: 0.65rem; 
            letter-spacing: 2px; cursor: pointer; transition: 0.3s;
        }
        .card-btn-fix:hover { background: var(--jj-yellow-main); color: var(--jj-brown); }

        .modal { 
            position: fixed; inset: 0; background: rgba(248,249,250,0.95); z-index: 2000; 
            display: none; padding: 30px; overflow-y: auto; opacity: 0; transition: 0.4s; backdrop-filter: blur(10px);
        }
        .modal.active { opacity: 1; display: flex; }
        .modal-content { 
            margin: auto; width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr 1.2fr; gap: 40px; 
            background: var(--jj-bg); padding: 50px; border-radius: 60px;
            box-shadow: 30px 30px 60px var(--shadow-dark), -30px -30px 60px var(--shadow-light);
        }
        .close-btn { position: fixed; top: 30px; right: 30px; font-size: 2rem; cursor: pointer; color: var(--jj-brown); z-index: 2001; }

        .color-selector { display: flex; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
        .color-dot-btn { 
            width: 35px; height: 35px; border-radius: 50%; cursor: pointer; 
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            transition: 0.3s; border: 3px solid transparent; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 800;
        }
        .color-dot-btn.selected { border-color: var(--jj-yellow-main); transform: scale(1.2); }
        .out-of-stock { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }

        .edit-field { 
            width: 100%; padding: 15px; margin-bottom: 15px; border: none; border-radius: 20px; 
            background: var(--jj-bg); box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            font-family: inherit; font-size: 0.8rem; outline: none;
        }

        .bottom-nav { 
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); 
            background: rgba(248,249,250,0.8); backdrop-filter: blur(15px); padding: 15px 40px; 
            border-radius: 40px; display: flex; gap: 50px; z-index: 1000;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
        }
        .nav-item { font-size: 1.2rem; cursor: pointer; color: var(--jj-brown); transition: 0.3s; opacity: 0.5; }
        .nav-item.active { opacity: 1; transform: scale(1.2); color: var(--jj-yellow-main); }

        #scanner-ui { display: none; position: fixed; inset: 0; background: #000; z-index: 5000; }

        @media (max-width: 850px) {
            .modal-content { grid-template-columns: 1fr; padding: 30px; border-radius: 40px; }
            .carousel-container { gap: 15px; }
            .product-card { min-width: 240px; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav>
        <img src="jjvidro.png" class="logo" onclick="location.reload()">
        <div style="display: flex; gap: 20px;">
            <span class="nav-item" onclick="openAdmin()" title="Admin">⚙️</span>
        </div>
    </nav>

    <div id="cat-nav-list" class="cat-nav"></div>

    <main id="main-content"></main>

    <div id="new-product-modal" class="modal">
        <span class="close-btn" onclick="closeModals()">×</span>
        <div class="modal-content" style="grid-template-columns: 1fr;">
            <h2 class="category-title" style="margin: 0 0 20px">NOVA ESCULTURA</h2>
            <input type="text" id="p-cat" class="edit-field" placeholder="CATEGORIA">
            <input type="text" id="p-name" class="edit-field" placeholder="NOME DO PRODUTO">
            <input type="text" id="p-price" class="edit-field" placeholder="PREÇO (EX: 250,00)">
            <input type="text" id="p-colors" class="edit-field" placeholder="CORES (EX: Amarelo, Azul, Verde)">
            <textarea id="p-desc" class="edit-field" style="height:100px" placeholder="DESCRIÇÃO"></textarea>
            <button class="card-btn-fix" style="position:static" onclick="saveProduct()">CADASTRAR COLEÇÃO</button>
        </div>
    </div>

    <div id="cart-modal" class="modal">
        <span class="close-btn" onclick="closeModals()">×</span>
        <div class="modal-content" style="grid-template-columns: 1fr;">
            <h2 class="category-title" style="margin: 0 0 20px">LISTA DE INTERESSE</h2>
            <input type="text" id="c-name" class="edit-field" placeholder="NOME DO CLIENTE">
            <select id="c-pgto" class="edit-field">
                <option value="PIX">PIX</option>
                <option value="CARTÃO DE CRÉDITO">CARTÃO DE CRÉDITO</option>
                <option value="CARTÃO DE DÉBITO">CARTÃO DE DÉBITO</option>
                <option value="DINHEIRO">DINHEIRO</option>
            </select>
            <div id="cart-items" style="margin: 20px 0;"></div>
            <div id="cart-total" style="font-size: 1.2rem; font-weight: 800; text-align: right; color: var(--jj-brown);">TOTAL: R$ 0,00</div>
            <button class="card-btn-fix" style="position:static" onclick="finalizeOrder()">FINALIZAR PEDIDO</button>
        </div>
    </div>

    <div id="details-modal" class="modal">
        <span class="close-btn" onclick="closeModals()">×</span>
        <div class="modal-content" id="details-body"></div>
    </div>

    <div id="admin-modal" class="modal">
        <span class="close-btn" onclick="closeModals()">×</span>
        <div class="modal-content" style="grid-template-columns: 1fr; text-align: center;">
            <img src="jjvidro.png" style="height:50px; margin: 0 auto 30px">
            <p style="font-weight:700; font-size:0.7rem; margin-bottom:20px">SISTEMA DE GESTÃO EXECUTIVA</p>
            <button class="card-btn-fix" style="position:static" onclick="login()">LOGAR COMO PABLO</button>
            <button class="card-btn-fix" style="position:static; margin-top:10px; background:#ddd; color:#333" onclick="logout()">SAIR</button>
        </div>
    </div>

    <div id="scanner-ui">
        <div id="reader" style="width: 100vw; height: 100vh;"></div>
        <button class="card-btn-fix" style="position:fixed; bottom:30px; left:50%; transform:translateX(-50%); width:200px; z-index:6000" onclick="stopScanner()">FECHAR CÂMERA</button>
    </div>

    <div class="bottom-nav">
        <span class="nav-item active" id="tab-home" onclick="changeTab('home')">🏠</span>
        <span class="nav-item" id="tab-novo" onclick="changeTab('novo')">✨</span>
        <span class="nav-item" id="tab-qr" onclick="startScanner()">📷</span>
        <span class="nav-item" id="tab-caixa" onclick="changeTab('caixa')">🛒</span>
        <span class="nav-item" id="tab-dash" onclick="window.location.href='dash.html'">📊</span>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), database = firebase.database();
        const ADM_EMAIL = "pablo11ssousa2@gmail.com";
        let cart = [], currentProduct = null, html5QrCode = null, selectedSizeData = { size: null, max: 0 };

        function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function logout() { auth.signOut().then(()=>location.reload()); }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('tab-novo').style.display = user.email === ADM_EMAIL ? 'block' : 'none';
                document.getElementById('tab-dash').style.display = user.email === ADM_EMAIL ? 'block' : 'none';
            }
            listenToProducts();
        });

        function listenToProducts() {
            database.ref('produtos').on('value', snap => {
                const data = snap.val();
                const main = document.getElementById('main-content');
                const catNav = document.getElementById('cat-nav-list');
                main.innerHTML = "";
                catNav.innerHTML = `<button class="cat-filter-btn active" onclick="filterCat('all')">Todos</button>`;
                if(data) {
                    const products = Object.values(data);
                    const cats = [...new Set(products.map(p => p.category))];
                    cats.forEach(cat => {
                        catNav.innerHTML += `<button class="cat-filter-btn" onclick="filterCat('${cat}')">${cat}</button>`;
                        const section = document.createElement('div');
                        section.className = `cat-group cat-${cat.replace(/\s+/g, '-')}`;
                        section.innerHTML = `<h2 class="category-title">${cat}</h2><div class="carousel-container" id="cat-container-${cat.replace(/\s+/g, '-')}"></div>`;
                        main.appendChild(section);
                        products.filter(p => p.category === cat).forEach(p => {
                            const variantKeys = p.variants ? Object.keys(p.variants) : [];
                            const colorList = variantKeys.length > 0 ? variantKeys : (p.colors ? p.colors.split(',').map(c => c.trim()) : []);
                            const firstColor = colorList[0] || "";
                            
                            const img = (p.variants && p.variants[firstColor] && p.variants[firstColor].img) ? p.variants[firstColor].img : "jjvidro2.png";
                            const card = document.createElement('div');
                            card.className = 'product-card';
                            card.onclick = () => openDetails(p);
                            card.innerHTML = `${auth.currentUser?.email === ADM_EMAIL ? `<button onclick="event.stopPropagation(); deleteProduct('${p.id}')" style="position:absolute; top:20px; right:20px; border:none; background:none; font-size:1.5rem; color:var(--jj-brown); z-index:20">&times;</button>` : ''}<div class="img-sculpt-frame"><img src="${img}"></div><h3>${p.name}</h3><div style="font-weight:700">R$ ${p.price}</div><button class="card-btn-fix">VER PEÇA</button>`;
                            document.getElementById(`cat-container-${cat.replace(/\s+/g, '-')}`).appendChild(card);
                        });
                    });
                }
            });
        }

        function saveProduct() {
            const id = "JJ" + Date.now();
            const p = {
                id,
                category: document.getElementById('p-cat').value,
                name: document.getElementById('p-name').value,
                price: document.getElementById('p-price').value,
                colors: document.getElementById('p-colors').value,
                desc: document.getElementById('p-desc').value,
                variants: {}
            };
            p.colors.split(',').forEach(c => p.variants[c.trim()] = { stock: "P:10, M:10", img: "", hex: "" });
            database.ref('produtos/'+id).set(p).then(() => { closeModals(); alert("Obra catalogada!"); });
        }

        function openDetails(p) {
            currentProduct = p;
            selectedSizeData = { size: null, max: 0 };
            const body = document.getElementById('details-body');
            
            const variantKeys = p.variants ? Object.keys(p.variants) : [];
            const colors = variantKeys.length > 0 ? variantKeys : (p.colors ? p.colors.split(',').map(c => c.trim()) : []);
            let selectedCol = colors[0] || "";

            if(auth.currentUser?.email === ADM_EMAIL) {
                let variantEditor = colors.map(c => {
                    const v = (p.variants && p.variants[c]) ? p.variants[c] : { img: "", stock: "", hex: "" };
                    return `
                    <div class="variant-box">
                        <div class="color-picker-wrapper">
                            <label style="font-size:0.6rem; font-weight:700">COR: ${c.toUpperCase()}</label>
                            <input type="color" class="admin-color-input v-hex" data-color="${c}" value="${v.hex || getDotColor(null, c)}">
                        </div>
                        <input type="file" onchange="uploadImg('${p.id}', '${c}', this)" style="display:block; margin:10px 0; font-size:0.7rem">
                        <input type="text" class="edit-field v-stock" data-color="${c}" value="${v.stock || ''}" placeholder="Estoque (Ex: P:2, M:5)">
                    </div>`;
                }).join('');
                
                body.innerHTML = `<div style="grid-column: 1/-1"><h3 style="margin-bottom:20px">EDITOR DE PEÇA</h3><div style="background:white; padding:20px; border-radius:30px; text-align:center; margin-bottom:20px; display:flex; flex-direction:column; align-items:center;"><div id="qrcode-container"></div><p style="font-size:0.5rem; margin-top:10px; opacity:0.6; font-family:monospace">${p.id}</p></div><input type="text" id="e-cat" class="edit-field" value="${p.category}"><input type="text" id="e-name" class="edit-field" value="${p.name}"><input type="text" id="e-price" class="edit-field" value="${p.price}"><input type="text" id="e-colors" class="edit-field" value="${p.colors}"><textarea id="e-desc" class="edit-field" style="height:80px">${p.desc || ''}</textarea>${variantEditor}<button class="card-btn-fix" style="position:static; width:100%" onclick="updateProductAll('${p.id}')">SALVAR ALTERAÇÕES</button></div>`;
                
                setTimeout(() => {
                    new QRCode(document.getElementById("qrcode-container"), {
                        text: p.id, width: 128, height: 128, colorDark : "#834A29", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
                    });
                }, 100);
            } else {
                renderUserView(p, selectedCol);
            }
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
        }

        function renderUserView(p, color) {
            const body = document.getElementById('details-body');
            const v = (p.variants && p.variants[color]) ? p.variants[color] : { img: "jjvidro2.png", stock: "" };
            const stockArr = v.stock ? v.stock.split(',').map(s => s.trim()) : [];
            
            const variantKeys = p.variants ? Object.keys(p.variants) : (p.colors ? p.colors.split(',').map(c => c.trim()) : []);
            
            const colorDots = variantKeys.map(c => {
                const cTrim = c.trim();
                const bgColor = getDotColor(p, cTrim);
                return `<div class="color-dot-btn ${cTrim === color ? 'selected' : ''}" style="background:${bgColor}" onclick="renderUserView(currentProduct, '${cTrim}')"></div>`;
            }).join('');
            
            const sizeDots = stockArr.map(s => {
                const parts = s.split(':');
                const tam = parts[0];
                const qtd = parts[1] || 0;
                const isOut = parseInt(qtd) <= 0;
                return `<div class="color-dot-btn size-dot-btn ${isOut ? 'out-of-stock' : ''} ${selectedSizeData.size === tam ? 'size-selected' : ''}" 
                             onclick="${isOut ? '' : `selectSize(this, '${tam}', ${qtd})`}" 
                             data-size="${tam}" data-max="${qtd}">
                             ${tam}
                        </div>`;
            }).join('') || `<div class="color-dot-btn size-dot-btn size-selected" onclick="selectSize(this, 'Padrão', 999)">P</div>`;

            body.innerHTML = `<div class="img-sculpt-frame"><img src="${v.img || 'jjvidro2.png'}"></div><div><h2>${p.name}</h2><p style="font-size:0.75rem; margin:15px 0; opacity:0.8; line-height:1.4">${p.desc || ''}</p><div style="background:rgba(0,0,0,0.03); padding:20px; border-radius:25px; margin-bottom:20px"><div class="color-selector">${colorDots}</div><div class="color-selector" id="size-selector-area">${sizeDots}</div><input type="number" id="u-qty" class="user-input edit-field" value="1" min="1" placeholder="Quantidade"></div><div style="font-size:1.5rem; font-weight:800; margin-bottom:15px">R$ ${p.price}</div><button class="card-btn-fix" style="position:static; width:100%" onclick="addToCart('${p.name}', '${p.price}', '${color}')">ADICIONAR À LISTA</button></div>`;
        }

        function selectSize(el, tam, max) {
            document.querySelectorAll('.size-dot-btn').forEach(b => b.classList.remove('size-selected'));
            el.classList.add('size-selected');
            selectedSizeData = { size: tam, max: max };
        }

        function getDotColor(p, color) {
            if(p && p.variants && p.variants[color] && p.variants[color].hex) return p.variants[color].hex;
            const dict = { "Amarelo":"#FFD700", "Azul":"#0000FF", "Verde":"#008000", "Vermelho":"#FF0000", "Preto":"#000", "Branco":"#fff", "Âmbar":"#FFBF00", "Cristal":"#E0FFFF" };
            return dict[color] || "#ccc";
        }

        function updateProductAll(id) {
            const up = {
                category: document.getElementById('e-cat').value,
                name: document.getElementById('e-name').value,
                price: document.getElementById('e-price').value,
                colors: document.getElementById('e-colors').value,
                desc: document.getElementById('e-desc').value
            };
            document.querySelectorAll('.v-hex').forEach(el => {
                const c = el.dataset.color;
                database.ref(`produtos/${id}/variants/${c}/hex`).set(el.value);
            });
            document.querySelectorAll('.v-stock').forEach(el => {
                const c = el.dataset.color;
                database.ref(`produtos/${id}/variants/${c}/stock`).set(el.value);
            });
            database.ref('produtos/'+id).update(up).then(() => { alert("Dados atualizados!"); closeModals(); });
        }

        function uploadImg(pid, color, input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => database.ref(`produtos/${pid}/variants/${color}/img`).set(e.target.result).then(()=>alert("Imagem salva!"));
            reader.readAsDataURL(file);
        }

        function addToCart(name, price, color) {
            const qty = parseInt(document.getElementById('u-qty').value);
            if(!selectedSizeData.size) { alert("Escolha o tamanho."); return; }
            if(qty > selectedSizeData.max) { alert("Estoque insuficiente."); return; }
            cart.push({ name, price: parseFloat(price.replace(',','.')), color, size: selectedSizeData.size, qty });
            alert("Adicionado!");
            closeModals();
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cart-items');
            list.innerHTML = cart.map((item, i) => `<div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #eee"><span>${item.qty}x ${item.name} (${item.color}/${item.size})</span><b>R$ ${(item.price * item.qty).toFixed(2)}</b><span onclick="cart.splice(${i},1); updateCartUI()" style="cursor:pointer">🗑️</span></div>`).join('');
            const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            document.getElementById('cart-total').innerText = `TOTAL: R$ ${total.toFixed(2).replace('.',',')}`;
        }

        function finalizeOrder() {
            const cliente = document.getElementById('c-name').value;
            if(!cliente || cart.length === 0) return alert("Preencha os dados!");
            const token = Math.random().toString(36).substr(2, 6).toUpperCase();
            const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            const resumo = cart.map(i => `${i.qty}x ${i.name} (${i.color}/${i.size})`).join('\n');
            
            database.ref('pedidos/'+token).set({
                token, cliente, total, 
                pagamento: document.getElementById('c-pgto').value,
                itens_resumo: resumo,
                status: 'orcamento',
                timestamp: Date.now()
            }).then(() => {
                alert("PEDIDO #" + token + " ENVIADO!");
                cart = [];
                updateCartUI();
                closeModals();
            });
        }

        function startScanner() {
            document.getElementById('scanner-ui').style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => {
                stopScanner();
                database.ref('produtos/'+txt).once('value', snap => {
                    if(snap.exists()) openDetails(snap.val());
                    else alert("Obra não encontrada.");
                });
            });
        }

        function stopScanner() {
            if(html5QrCode) { html5QrCode.stop(); html5QrCode = null; }
            document.getElementById('scanner-ui').style.display = 'none';
        }

        function changeTab(t) {
            closeModals();
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('tab-'+t).classList.add('active');
            if(t==='novo') document.getElementById('new-product-modal').style.display = 'flex', setTimeout(()=>document.getElementById('new-product-modal').classList.add('active'),10);
            if(t==='caixa') document.getElementById('cart-modal').style.display = 'flex', setTimeout(()=>document.getElementById('cart-modal').classList.add('active'),10);
        }

        function filterCat(c) {
            document.querySelectorAll('.cat-filter-btn').forEach(b => b.classList.remove('active'));
            if(event) event.target.classList.add('active');
            document.querySelectorAll('.cat-group').forEach(g => g.style.display = (c==='all' || g.classList.contains('cat-'+c.replace(/\s+/g, '-'))) ? 'block' : 'none');
        }

        function closeModals() { 
            stopScanner(); 
            document.querySelectorAll('.modal').forEach(m => { 
                m.classList.remove('active'); 
                setTimeout(()=>m.style.display='none', 400); 
            }); 
        }

        function deleteProduct(id) { if(confirm("Remover este item?")) database.ref('produtos/'+id).remove(); }
        
        function openAdmin() { 
            document.getElementById('admin-modal').style.display='flex'; 
            setTimeout(()=>document.getElementById('admin-modal').classList.add('active'), 10); 
        }

        if(window.innerWidth > 768) {
            const dot = document.querySelector('.cursor-dot'), out = document.querySelector('.cursor-outline');
            window.onmousemove = (e) => { 
                dot.style.opacity = out.style.opacity = 1;
                dot.style.left = e.clientX+'px'; dot.style.top = e.clientY+'px'; 
                out.style.left = (e.clientX-16)+'px'; out.style.top = (e.clientY-16)+'px'; 
            };
        }
    </script>
</body>
</html>
