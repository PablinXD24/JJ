<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Art Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); overflow-x: hidden; cursor: none; }

        /* Cursor */
        .cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--jj-yellow-main); border-radius: 50%; z-index: 10000; pointer-events: none; }
        .cursor-outline { position: fixed; width: 40px; height: 40px; border: 2px solid var(--jj-yellow-main); border-radius: 50%; z-index: 9999; pointer-events: none; transition: 0.1s; }

        /* Navbar */
        .main-nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background: rgba(248, 249, 250, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .logo-img { height: 55px; width: auto; object-fit: contain; }

        .content-wrapper { padding: 20px 0 60px 0; min-height: 80vh; }
        .category-title { margin-left: 5%; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px; color: var(--jj-brown); position: relative; }
        
        .carousel-container { display: flex; gap: 30px; overflow-x: auto; padding: 20px 5% 45px 5%; scrollbar-width: none; }
        .carousel-container::-webkit-scrollbar { display: none; }

        /* Card */
        .product-card {
            flex: 0 0 300px; background: var(--jj-bg); padding: 25px; padding-bottom: 85px; border-radius: 45px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            transition: 0.4s; cursor: pointer; position: relative; min-height: 560px;
        }
        
        .img-sculpt-frame {
            background: var(--jj-bg); height: 260px; border-radius: 35px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
            position: relative; overflow: hidden; margin-bottom: 25px;
        }
        .img-sculpt-frame img { max-width: 85%; max-height: 85%; object-fit: contain; z-index: 2; transition: 0.5s; }

        /* Bolinhas de Cor */
        .color-dots { display: flex; gap: 8px; margin-bottom: 12px; }
        .color-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid white; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
        .color-dot.active { border: 2px solid var(--jj-yellow-main); transform: scale(1.2); }

        .card-label { font-size: 0.55rem; font-weight: 700; color: var(--jj-yellow-main); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 5px; display: block; }
        .product-card h3 { font-weight: 700; font-size: 1rem; text-transform: uppercase; margin-bottom: 8px; color: var(--jj-brown); }
        .product-card .price { font-weight: 800; color: var(--jj-text); font-size: 1.2rem; }

        .card-btn-fix {
            position: absolute; bottom: 25px; left: 25px; right: 25px;
            background: var(--jj-yellow-main); color: #1a1a1a; border: none; padding: 16px; border-radius: 22px;
            font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: 0.3s;
            box-shadow: 6px 6px 15px rgba(255, 200, 0, 0.35); text-transform: uppercase;
        }

        /* Inputs Neumórficos */
        .edit-field, .user-input { width: 100%; background: var(--jj-bg); border: none; padding: 12px 15px; border-radius: 15px; box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); margin-bottom: 12px; font-family: var(--font-sans); outline: none; font-size: 0.8rem; }

        /* Modals */
        .modal { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(12px); }
        .modal-content { background: var(--jj-bg); width: 100%; max-width: 850px; max-height: 90vh; border-radius: 50px; position: relative; z-index: 2100; padding: 45px; overflow-y: auto; transition: 0.4s; transform: translateY(40px); opacity: 0; }
        .modal.active .modal-content { transform: translateY(0); opacity: 1; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .close-btn { position: absolute; top: 25px; right: 25px; background: none; border: none; font-size: 2.2rem; cursor: pointer; color: var(--jj-brown); z-index: 2200; }

        /* Item no Carrinho Visual */
        .cart-visual-item { display: flex; gap: 15px; padding: 15px; background: var(--jj-bg); border-radius: 25px; box-shadow: 5px 5px 15px var(--shadow-dark); margin-bottom: 15px; align-items: center; position: relative; }
        .cart-visual-img { width: 70px; height: 70px; border-radius: 15px; object-fit: cover; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1); }
        .cart-visual-data { flex: 1; }
        .cart-visual-data h4 { font-size: 0.85rem; text-transform: uppercase; color: var(--jj-brown); margin-bottom: 5px; }

        /* Footer */
        .main-footer { position: relative; width: 100%; min-height: 250px; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; text-align: center; margin-top: 50px; }
        .footer-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); }

        #cart-btn-floating { position: fixed; bottom: 30px; left: 30px; width: 65px; height: 65px; border-radius: 50%; background: var(--jj-bg); z-index: 1500; box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light); border: none; cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 24px; }
        #cart-badge { position: absolute; top: 0; right: 0; background: var(--jj-yellow-main); font-size: 10px; font-weight: 700; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        @media (max-width: 768px) {
            .modal-content { padding: 50px 20px 30px 20px; border-radius: 40px 40px 0 0; }
            .modal-grid { grid-template-columns: 1fr; }
            .product-card { flex: 0 0 285px; }
            .cursor-dot, .cursor-outline { display: none; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="main-nav">
        <img src="j&j vidro.png" alt="Logo" class="logo-img">
        <div id="auth-ui"></div>
    </nav>

    <main class="content-wrapper" id="main-content"></main>

    <footer class="main-footer">
        <div class="footer-overlay"></div>
        <div class="footer-content" style="position:relative; color:white; z-index:2">
            <h2>J&J ART COLLECTION</h2>
            <p style="font-size:0.7rem; opacity:0.6; margin-top:10px">© 2026 TODOS OS DIREITOS RESERVADOS</p>
        </div>
    </footer>

    <button id="cart-btn-floating" onclick="openCartModal()">
        🛒 <div id="cart-badge">0</div>
    </button>

    <div id="details-modal" class="modal">
        <div class="modal-overlay" onclick="closeModals()"></div>
        <div class="modal-content">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <div id="details-body" class="modal-grid"></div>
        </div>
    </div>

    <script>
        // Mantenha suas chaves Firebase aqui
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        const provider = new firebase.auth.GoogleAuthProvider();
        
        let cart = [];
        let selectedColor = "";

        // Tradutor de nomes para cores CSS
        const colorMap = { "preto": "#000", "branco": "#fff", "azul": "#0000ff", "vermelho": "#ff0000", "nude": "#e3bc9a", "off white": "#f5f5f5" };

        function loginGoogle() { auth.signInWithPopup(provider); }
        auth.onAuthStateChanged(user => {
            document.getElementById('auth-ui').innerHTML = user ? 
                `<span style="font-size:0.7rem;">${user.displayName}</span>` : 
                `<button class="jj-btn-ghost" style="padding:10px; border-radius:10px" onclick="loginGoogle()">ENTRAR</button>`;
            listenToProducts();
        });

        function listenToProducts() {
            database.ref('produtos').on('value', snap => {
                const main = document.getElementById('main-content');
                main.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.values(data).forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.onclick = () => openDetails(p);
                        
                        const colorHtml = p.colors ? p.colors.split(',').map(c => {
                            const cTrim = c.trim().toLowerCase();
                            const bg = colorMap[cTrim] || cTrim;
                            return `<div class="color-dot" style="background:${bg}"></div>`;
                        }).join('') : '';

                        card.innerHTML = `
                            <div class="img-sculpt-frame"><img src="${p.img}"></div>
                            <div class="card-info">
                                <div class="color-dots">${colorHtml}</div>
                                <span class="card-label">Exclusive Art</span>
                                <h3>${p.name}</h3>
                                <div class="price">R$ ${p.price}</div>
                            </div>
                            <button class="card-btn-fix">DETALHES</button>
                        `;
                        main.appendChild(card);
                    });
                }
            });
        }

        function openDetails(p) {
            selectedColor = p.colors ? p.colors.split(',')[0].trim() : "Padrão";
            const body = document.getElementById('details-body');
            const sizes = p.sizes ? p.sizes.split(',').map(s=>`<option>${s.trim()}</option>`).join('') : '<option>Único</option>';
            
            const colorSelectionHtml = p.colors ? p.colors.split(',').map(c => {
                const cTrim = c.trim().toLowerCase();
                const bg = colorMap[cTrim] || cTrim;
                return `<div class="color-dot" onclick="selectColor(this, '${c.trim()}')" style="background:${bg}; cursor:pointer; width:25px; height:25px"></div>`;
            }).join('') : '';

            body.innerHTML = `
                <div class="img-sculpt-frame"><img src="${p.img}"></div>
                <div>
                    <h2>${p.name}</h2>
                    <p style="margin:15px 0; font-size:0.85rem; opacity:0.7">${p.desc || ''}</p>
                    <div style="margin-bottom:20px">
                        <p style="font-size:0.7rem; font-weight:700; margin-bottom:10px">COR SELECIONADA</p>
                        <div class="color-dots">${colorSelectionHtml}</div>
                    </div>
                    <select id="u-size" class="user-input">${sizes}</select>
                    <input type="number" id="u-qty" class="user-input" value="1" min="1">
                    <div style="font-size:1.5rem; font-weight:800; margin:15px 0">R$ ${p.price}</div>
                    <button class="card-btn-fix" style="position:static; width:100%" onclick="addToCart('${p.id}', '${p.name}', '${p.price}', '${p.img}', '${p.sizes}', '${p.colors}')">ADICIONAR À LISTA</button>
                </div>`;
            
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
        }

        function selectColor(el, val) {
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
            selectedColor = val;
        }

        function addToCart(id, name, price, img, sizesRaw, colorsRaw) {
            const size = document.getElementById('u-size').value;
            const qty = document.getElementById('u-qty').value;
            cart.push({ id, name, price, img, size, color: selectedColor, qty, sizesRaw, colorsRaw });
            updateBadge();
            closeModals();
        }

        function updateBadge() {
            document.getElementById('cart-badge').innerText = cart.length;
            document.getElementById('cart-btn-floating').style.display = cart.length > 0 ? 'flex' : 'none';
        }

        function openCartModal() {
            const userName = auth.currentUser ? auth.currentUser.displayName : "";
            const body = document.getElementById('details-body');
            
            let itemsHtml = cart.map((item, idx) => {
                const sizeOpts = item.sizesRaw ? item.sizesRaw.split(',').map(s => `<option ${s.trim()===item.size?'selected':''}>${s.trim()}</option>`).join('') : `<option>${item.size}</option>`;
                const colorOpts = item.colorsRaw ? item.colorsRaw.split(',').map(c => `<option ${c.trim()===item.color?'selected':''}>${c.trim()}</option>`).join('') : `<option>${item.color}</option>`;
                
                return `
                <div class="cart-visual-item">
                    <img src="${item.img}" class="cart-visual-img">
                    <div class="cart-visual-data">
                        <h4>${item.name}</h4>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px">
                            <select onchange="cart[${idx}].size = this.value" class="user-input" style="padding:5px; margin:0">${sizeOpts}</select>
                            <select onchange="cart[${idx}].color = this.value" class="user-input" style="padding:5px; margin:0">${colorOpts}</select>
                        </div>
                    </div>
                    <button onclick="cart.splice(${idx},1); updateBadge(); openCartModal();" style="border:none; background:none; font-size:1.2rem; cursor:pointer">×</button>
                </div>`;
            }).join('');

            body.innerHTML = `
                <div style="grid-column: span 2">
                    <h2 style="margin-bottom:20px">MINHA LISTA</h2>
                    ${itemsHtml || '<p style="text-align:center; opacity:0.5">Vazio</p>'}
                    <div style="margin-top:25px">
                        <input type="text" id="u-final-name" class="user-input" placeholder="Seu Nome" value="${userName}">
                        <button class="card-btn-fix" style="position:static; width:100%" onclick="sendWhatsApp()">PEDIR NO WHATSAPP</button>
                    </div>
                </div>`;
            
            document.getElementById('details-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('details-modal').classList.add('active'), 10);
        }

        function sendWhatsApp() {
            const user = document.getElementById('u-final-name').value;
            if(!user) return alert("Diga seu nome!");
            let msg = `Olá! Me chamo ${user}.%0A%0A*PEDIDO:*%0A`;
            cart.forEach(i => msg += `- ${i.name} (${i.size} / ${i.color}) x${i.qty}%0A`);
            window.open(`https://wa.me/5511999999999?text=${msg}`, '_blank');
        }

        function closeModals() { document.querySelectorAll('.modal').forEach(m => { m.classList.remove('active'); setTimeout(() => m.style.display = 'none', 400); }); }
        
        // Cursor
        const dot = document.querySelector('.cursor-dot'), out = document.querySelector('.cursor-outline');
        window.onmousemove = (e) => { dot.style.left = out.style.left = e.clientX+'px'; dot.style.top = out.style.top = e.clientY+'px'; };
    </script>
</body>
</html>
