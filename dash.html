<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Private Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --jj-text: #1a1a1a;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--jj-bg); font-family: var(--font-sans); color: var(--jj-text); padding: 20px; }

        /* Login */
        #login-screen { position: fixed; inset: 0; background: var(--jj-bg); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--jj-bg); padding: 50px; border-radius: 50px; box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light); text-align: center; }

        #dash-content { display: none; max-width: 1200px; margin: 0 auto; }
        
        .card-jj { 
            background: var(--jj-bg); padding: 30px; border-radius: 40px; 
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            margin-bottom: 30px; position: relative;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logo-img { height: 40px; }

        /* Meta Editável */
        .meta-val { background: transparent; border: none; border-bottom: 2px solid var(--jj-yellow-main); font-size: 1.5rem; font-weight: 700; color: var(--jj-brown); width: 150px; outline: none; text-align: right; }
        .bar-bg { height: 12px; background: #e0e5ec; border-radius: 10px; box-shadow: inset 3px 3px 6px var(--shadow-dark); margin: 20px 0; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; background: var(--jj-yellow-main); transition: 1s ease-in-out; }

        /* Inputs de Edição Direta */
        .edit-input { width: 100%; border: none; background: transparent; padding: 10px; border-radius: 10px; box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light); font-family: inherit; font-size: 0.85rem; outline: none; }
        .edit-input:focus { color: var(--jj-brown); font-weight: 600; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; font-size: 0.7rem; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 15px; border-top: 1px solid rgba(0,0,0,0.05); }

        /* Notificação direta WhatsApp */
        #wpp-trigger {
            display: none; position: fixed; bottom: 30px; right: 30px; z-index: 999;
            background: #25D366; color: white; padding: 20px; border-radius: 50px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); cursor: pointer; font-weight: 700;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .btn-del { background: none; border: none; cursor: pointer; font-size: 1.2rem; filter: grayscale(1); transition: 0.3s; }
        .btn-del:hover { filter: grayscale(0); transform: scale(1.2); }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <img src="jjvidro.png" style="height: 60px; margin-bottom: 30px;">
            <button onclick="login()" style="padding: 15px 30px; border-radius: 20px; border: none; background: var(--jj-yellow-main); font-weight: 700; cursor: pointer;">ENTRAR COMO ADM</button>
        </div>
    </div>

    <div id="wpp-trigger" onclick="sendDirectWpp()">
        🚀 META ALCANÇADA! ENVIAR AVISO
    </div>

    <div id="dash-content">
        <header class="header">
            <img src="jjvidro.png" class="logo-img">
            <h2 style="font-size: 0.8rem; letter-spacing: 3px; color: var(--jj-brown);">SISTEMA DE GESTÃO J&J</h2>
        </header>

        <div class="card-jj">
            <div style="display:flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <p style="font-size: 0.7rem; font-weight: 700; opacity: 0.5;">META ATUAL (R$)</p>
                    <input type="number" id="input-meta" class="meta-val" onchange="saveMeta(this.value)">
                </div>
                <div style="text-align: right;">
                    <p id="txt-perc" style="font-size: 1.5rem; font-weight: 700; color: var(--jj-brown);">0%</p>
                    <p id="txt-total" style="font-size: 0.7rem; font-weight: 600; opacity: 0.6;">R$ 0,00 acumulados</p>
                </div>
            </div>
            <div class="bar-bg"><div id="bar-fill" class="bar-fill"></div></div>
        </div>

        <div class="card-jj">
            <h3 style="font-size: 0.75rem; margin-bottom: 20px; letter-spacing: 2px;">VENDAS RECENTES (EDIÇÃO TOTAL)</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Token</th>
                            <th>Cliente</th>
                            <th>Valor Bruto</th>
                            <th>Pagamento</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="table-pedidos"></tbody>
                </table>
            </div>
        </div>

        <div class="card-jj">
            <h3 style="font-size: 0.75rem; margin-bottom: 20px; letter-spacing: 2px;">CONTROLE DE ACERVO</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Preço Base (R$)</th>
                            <th>Categoria</th>
                        </tr>
                    </thead>
                    <tbody id="table-produtos"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), database = firebase.database();
        const ADM = "pablo11ssousa2@gmail.com";
        
        let currentMeta = 15000;
        let currentTotal = 0;
        let lastNotifiedStep = 0;

        function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }

        auth.onAuthStateChanged(user => {
            if(user && user.email === ADM) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dash-content').style.display = 'block';
                initData();
            }
        });

        function initData() {
            // Meta
            database.ref('configuracoes/meta').on('value', snap => {
                currentMeta = snap.val() || 15000;
                document.getElementById('input-meta').value = currentMeta;
                updateVisuals();
            });

            // Pedidos
            database.ref('pedidos').on('value', snap => {
                const pedidos = snap.val() || {};
                renderOrders(pedidos);
                calculateProgress(pedidos);
            });

            // Produtos
            database.ref('produtos').on('value', snap => renderProducts(snap.val() || {}));
        }

        function calculateProgress(pedidos) {
            currentTotal = Object.values(pedidos).reduce((acc, curr) => acc + parseFloat(curr.total || 0), 0);
            updateVisuals();
        }

        function updateVisuals() {
            const perc = Math.floor((currentTotal / currentMeta) * 100);
            document.getElementById('bar-fill').style.width = Math.min(perc, 100) + "%";
            document.getElementById('txt-perc').innerText = perc + "%";
            document.getElementById('txt-total').innerText = `R$ ${currentTotal.toFixed(2)} acumulados`;

            // Lógica de Notificação Direta (Sem Terceiros)
            const step = Math.floor(perc / 10) * 10;
            if(step > lastNotifiedStep && step <= 100 && step > 0) {
                // Como não queremos terceiros, o Dashboard "acende" um botão flutuante 
                // para você disparar o WhatsApp com um clique, contornando o bloqueio do browser.
                document.getElementById('wpp-trigger').style.display = 'block';
                document.getElementById('wpp-trigger').innerText = `🚀 META DE ${step}% ATINGIDA! ENVIAR`;
                lastNotifiedStep = step;
            }
        }

        function sendDirectWpp() {
            const msg = `J&J ART COLLECTION:\nPablo, atingiste ${Math.floor((currentTotal / currentMeta) * 100)}% da meta!\nFaturamento: R$ ${currentTotal.toFixed(2)}`;
            const url = `https://wa.me/55119XXXXXXXX?text=${encodeURIComponent(msg)}`; // Coloque o seu número aqui
            window.open(url, '_blank');
            document.getElementById('wpp-trigger').style.display = 'none';
        }

        function renderOrders(data) {
            document.getElementById('table-pedidos').innerHTML = Object.values(data).reverse().map(p => `
                <tr>
                    <td><b>${p.token}</b></td>
                    <td><input class="edit-input" value="${p.cliente}" onchange="edit('pedidos/${p.token}', 'cliente', this.value)"></td>
                    <td><input class="edit-input" value="${p.total}" onchange="edit('pedidos/${p.token}', 'total', this.value)"></td>
                    <td><input class="edit-input" value="${p.pagamento}" onchange="edit('pedidos/${p.token}', 'pagamento', this.value)"></td>
                    <td><button class="btn-del" onclick="remove('pedidos/${p.token}')">🗑️</button></td>
                </tr>
            `).join('');
        }

        function renderProducts(data) {
            document.getElementById('table-produtos').innerHTML = Object.entries(data).map(([id, p]) => `
                <tr>
                    <td><input class="edit-input" value="${p.name}" onchange="edit('produtos/${id}', 'name', this.value)"></td>
                    <td><input class="edit-input" value="${p.price}" onchange="edit('produtos/${id}', 'price', this.value)"></td>
                    <td><input class="edit-input" value="${p.category}" onchange="edit('produtos/${id}', 'category', this.value)"></td>
                </tr>
            `).join('');
        }

        function saveMeta(v) { database.ref('configuracoes/meta').set(parseFloat(v)); }
        function edit(path, key, val) { database.ref(path).update({ [key]: val }); }
        function remove(path) { if(confirm("Eliminar permanentemente?")) database.ref(path).remove(); }
    </script>
</body>
</html>
