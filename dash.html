<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J&J | Business Intelligence & Operations</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --jj-yellow-main: #FFC800;
            --jj-brown: #834A29;
            --jj-bg: #f8f9fa;
            --shadow-dark: rgba(163, 177, 198, 0.4);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --success: #2ecc71;
            --warning: #f1c40f;
            --danger: #e74c3c;
            --info: #3498db;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--jj-bg); color: #1a1a1a; padding: 20px 5%; }

        /* Estilo Neumórfico com Glassmorphism */
        .card-jj { 
            background: rgba(248, 249, 250, 0.8); backdrop-filter: blur(10px);
            padding: 25px; border-radius: 30px; 
            box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
            margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.3);
        }

        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .kpi-card { text-align: center; padding: 20px; border-radius: 20px; }
        .kpi-val { display: block; font-size: 1.2rem; font-weight: 700; color: var(--jj-brown); }
        .kpi-lab { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; }

        /* Tags de Status */
        .status-badge { padding: 5px 12px; border-radius: 12px; font-size: 0.65rem; font-weight: 700; border: none; cursor: pointer; }
        .st-orcamento { background: #eee; color: #666; }
        .st-producao { background: var(--info); color: white; }
        .st-finalizado { background: var(--success); color: white; }

        /* Inputs Estilizados */
        .edit-field {
            width: 100%; border: none; background: transparent; padding: 8px; font-size: 0.8rem;
            border-radius: 10px; transition: 0.3s; outline: none;
        }
        .edit-field:focus { background: rgba(255,255,255,0.5); box-shadow: inset 2px 2px 5px var(--shadow-dark); }

        .stock-alert { color: var(--danger); font-weight: 700; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; font-size: 0.65rem; text-transform: uppercase; padding: 10px; opacity: 0.6; }
        td { padding: 10px; border-top: 1px solid rgba(0,0,0,0.05); }

        .btn-add { background: var(--jj-yellow-main); border: none; padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; float: right; }
    </style>
</head>
<body>

    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <img src="jjvidro.png" height="40">
        <button class="btn-add" onclick="novoPedido()">+ NOVO PEDIDO</button>
    </header>

    <div class="kpi-grid">
        <div class="card-jj kpi-card">
            <span class="kpi-lab">Ticket Médio</span>
            <span id="kpi-ticket" class="kpi-val">R$ 0,00</span>
        </div>
        <div class="card-jj kpi-card">
            <span class="kpi-lab">Em Produção</span>
            <span id="kpi-prod" class="kpi-val">0</span>
        </div>
        <div class="card-jj kpi-card">
            <span class="kpi-lab">Previsão Entrada</span>
            <span id="kpi-prev" class="kpi-val">R$ 0,00</span>
        </div>
    </div>

    <div class="card-jj">
        <h3 style="font-size: 0.8rem; letter-spacing: 1px; color: var(--jj-brown);">GERENCIAMENTO DE OPERAÇÕES</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Valor (R$)</th>
                        <th>Prazo Entrega</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-pedidos"></tbody>
            </table>
        </div>
    </div>

    <div class="card-jj">
        <h3 style="font-size: 0.8rem; letter-spacing: 1px; color: var(--jj-brown);">CONTROLE DE SUPRIMENTOS</h3>
        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Qtd Atual</th>
                    <th>Mínimo</th>
                    <th>Status Estoque</th>
                </tr>
            </thead>
            <tbody id="lista-estoque"></tbody>
        </table>
    </div>

    <script>
        // Configurações Firebase (Use as suas)
        const firebaseConfig = {
            apiKey: "AIzaSyDTYFc2tphilGadT8LfSV_mTI0GRmebMdI",
            authDomain: "jj26-d5c78.firebaseapp.com",
            databaseURL: "https://jj26-d5c78-default-rtdb.firebaseio.com",
            projectId: "jj26-d5c78",
            storageBucket: "jj26-d5c78.firebasestorage.app",
            messagingSenderId: "923255408755",
            appId: "1:923255408755:web:b9197990d671452d5dc206"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Inicialização
        function init() {
            db.ref('pedidos').on('value', snap => renderPedidos(snap.val() || {}));
            db.ref('produtos').on('value', snap => renderEstoque(snap.val() || {}));
        }

        function renderPedidos(data) {
            const list = Object.values(data).reverse();
            let totalVendas = 0, emProducao = 0, previsao = 0;

            const html = list.map(p => {
                const val = parseFloat(p.total) || 0;
                totalVendas += val;
                if(p.status === 'Produção') emProducao++;
                if(p.status !== 'Finalizado') previsao += val;

                return `
                    <tr>
                        <td><input class="edit-field" value="${p.cliente || ''}" onchange="update('pedidos/${p.token}', 'cliente', this.value)"></td>
                        <td><input class="edit-field" type="number" value="${val}" onchange="update('pedidos/${p.token}', 'total', this.value)"></td>
                        <td><input class="edit-field" type="date" value="${p.prazo || ''}" onchange="update('pedidos/${p.token}', 'prazo', this.value)"></td>
                        <td>
                            <select class="status-badge ${getStatusClass(p.status)}" onchange="update('pedidos/${p.token}', 'status', this.value)">
                                <option value="Orçamento" ${p.status=='Orçamento'?'selected':''}>Orçamento</option>
                                <option value="Produção" ${p.status=='Produção'?'selected':''}>Produção</option>
                                <option value="Finalizado" ${p.status=='Finalizado'?'selected':''}>Finalizado</option>
                            </select>
                        </td>
                        <td><button onclick="remover('pedidos/${p.token}')">🗑️</button></td>
                    </tr>
                `;
            }).join('');

            document.getElementById('lista-pedidos').innerHTML = html;
            
            // Atualiza KPIs de Gestão
            document.getElementById('kpi-ticket').innerText = `R$ ${(totalVendas / (list.length || 1)).toLocaleString()}`;
            document.getElementById('kpi-prod').innerText = emProducao;
            document.getElementById('kpi-prev').innerText = `R$ ${previsao.toLocaleString()}`;
        }

        function renderEstoque(data) {
            const html = Object.entries(data).map(([id, p]) => {
                const isCritical = (p.estoque_atual || 0) <= (p.estoque_minimo || 5);
                return `
                    <tr>
                        <td>${p.name}</td>
                        <td><input class="edit-field" type="number" value="${p.estoque_atual || 0}" onchange="update('produtos/${id}', 'estoque_atual', this.value)"></td>
                        <td>${p.estoque_minimo || 5}</td>
                        <td class="${isCritical ? 'stock-alert' : ''}">${isCritical ? '⚠️ REPOR IMEDIATAMENTE' : '✅ OK'}</td>
                    </tr>
                `;
            }).join('');
            document.getElementById('lista-estoque').innerHTML = html;
        }

        function getStatusClass(st) {
            if(st === 'Produção') return 'st-producao';
            if(st === 'Finalizado') return 'st-finalizado';
            return 'st-orcamento';
        }

        function update(path, key, val) { db.ref(path).update({ [key]: val }); }
        
        function novoPedido() {
            const token = "JJ" + Math.floor(Math.random() * 9999);
            db.ref('pedidos/' + token).set({
                token: token,
                cliente: "Novo Cliente VIP",
                total: 0,
                status: "Orçamento",
                prazo: ""
            });
        }

        function remover(path) { if(confirm("Remover permanentemente?")) db.ref(path).remove(); }

        init();
    </script>
</body>
</html>
